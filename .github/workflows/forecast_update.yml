name: Update Forecast JSON
# ── Cron schedule (UTC) ──────────────────────────────────────────────────────
# 4 runs per day, one per slot (IST = UTC + 5:30).
# Each run fires ~15 min before the slot window opens, after NOMADS posting.
#
#  Slot 0  0001-0600 IST → run at 17:45 UTC prev day   (23:15 IST prev day)
#  Slot 1  0601-1200 IST → run at 23:45 UTC prev day   (05:15 IST)
#  Slot 2  1201-1800 IST → run at 05:45 UTC             (11:15 IST)
#  Slot 3  1801-2400 IST → run at 10:15 UTC             (15:45 IST)
#
# Plus an extra evening run at 16:15 UTC (21:45 IST) for the public dashboard
# refresh after the peak afternoon slot.
on:
  schedule:
    - cron: "45 17 * * *"   # Slot 0  — 23:15 IST (prev-day 06Z cycle)
    - cron: "45 23 * * *"   # Slot 1  — 05:15 IST (prev-day 12Z cycle)
    - cron: "45  5 * * *"   # Slot 2  — 11:15 IST (prev-day 18Z cycle) PRIMARY
    - cron: "15 10 * * *"   # Slot 3  — 15:45 IST (same-day 00Z cycle)
    - cron: "15 16 * * *"   # Extra   — 21:45 IST  dashboard refresh
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a specific slot (0-3, leave empty for auto)"
        required: false
        default: ""
concurrency:
  group: sih-forecast-publish
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Reset stale data files
        run: python clean_stale_data.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libeccodes-dev libgeos-dev 2>/dev/null || true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir \
            "scikit-learn==1.7.2" \
            "xgboost>=2.0.0" \
            "joblib>=1.3.0" \
            "shap>=0.45.0" \
            "pandas>=2.0.0" \
            "numpy>=1.24.0" \
            "metpy>=1.6.0" \
            "cfgrib>=0.9.10" \
            "eccodes>=1.6.0" \
            "xarray>=2024.0.0" \
            "requests>=2.31.0" \
            "pytz>=2024.1" \
            "scipy>=1.12.0" \
            "boto3>=1.34.0" \
            "pyproj>=3.6.0" \
            "pyarrow>=14.0.0"

      - name: Install Himawari dependencies
        run: |
          pip install \
            "satpy>=0.47.0" \
            "dask>=2024.1.0" \
            "trollimage>=1.8.0" \
            "jsonschema>=4.0.0"
        continue-on-error: true

      - name: Show library versions
        run: |
          python -c "import sklearn,xgboost,joblib,shap; print(f'sklearn={sklearn.__version__} xgb={xgboost.__version__} joblib={joblib.__version__} shap={shap.__version__}')"

      - name: Diagnose NOMADS/GFS connectivity from this runner (safe, bounded, no secrets)
        id: gfs_diagnostic
        # Priority 1 (2026-10-06 pass): answers "can GitHub Actions reach
        # NOMADS?" with evidence, not assumption -- DNS, HTTPS, cycle
        # resolution, one small (few-MB, CAPE-only) GRIB request, and a
        # real cfgrib read confirming the returned file actually matches
        # the requested cycle/variable. Never downloads a full archive.
        # continue-on-error: a blocked/unreachable result here is an
        # expected, truthful outcome (this sandbox already confirmed NOMADS
        # is blocked), not a reason to fail the whole scheduled job -- the
        # production CB fetch path already handles this honestly via its
        # own FIXED_VALIDATION_FALLBACK path.
        continue-on-error: true
        run: python3 scripts/ci_gfs_connectivity_diagnostic.py | tee /tmp/gfs_diagnostic.json

      - name: Preflight -- AWS Open Data GFS mirror (primary live CB source)
        id: aws_gfs_preflight
        # 2026-10-06 Phase 3 pass: NOMADS access from a GitHub Actions
        # runner is unverified/historically unreliable (see the diagnostic
        # step above). scripts/gfs_live_cb_predictors.py now tries the free,
        # public, no-credential NOAA AWS Open Data GFS mirror FIRST for
        # CB's current-cycle predictors (scripts/gfs_aws_source.py) --
        # this step independently proves, from THIS runner, that the exact
        # chain the production build depends on actually works end to end:
        # DNS -> HTTPS -> current-cycle discovery -> .idx byte-range
        # download -> a real cfgrib decode of the returned bytes. It is a
        # single small (CAPE-only, surface, f006) request, never a full
        # archive download. continue-on-error: true -- same reasoning as
        # the NOMADS diagnostic above: an honest BLOCKED/DEGRADED result
        # here must never fail the whole scheduled job, because
        # phase34_build_unified_forecast.py already falls back to NOMADS
        # and then to the fixed validation cycle on its own.
        continue-on-error: true
        run: |
          python3 - <<'PYEOF' | tee /tmp/aws_gfs_diagnostic.json
          import json, sys
          sys.path.insert(0, "scripts")
          import gfs_aws_source as aws_src

          result = aws_src.check_connectivity()
          print(json.dumps({"connectivity": result}), file=sys.stderr)

          if result["overall"] != "OK":
              print(json.dumps({"connectivity": result, "byte_range_smoke_test": "SKIPPED (connectivity not OK)"}))
              sys.exit(0)

          cycle = aws_src.find_latest_available_cycle()
          smoke = {"cycle": cycle.cycle_str if cycle else None}
          try:
              out_path = __import__("pathlib").Path("/tmp/aws_gfs_smoke.grib2")
              manifest = aws_src.fetch_cycle_subset(cycle, 6, out_path,
                                                     fields=[("CAPE", "surface")])
              smoke["manifest"] = manifest
              validation = aws_src.validate_grib(out_path)
              smoke["grib_validation"] = validation
              smoke["overall"] = "LIVE_VERIFIED" if validation.get("readable") else "BLOCKED"
          except Exception as exc:
              smoke["overall"] = "ERROR"
              smoke["failure_reason"] = f"{type(exc).__name__}: {exc}"
          print(json.dumps({"connectivity": result, "byte_range_smoke_test": smoke}))
          PYEOF

      - name: Fetch GFS real-time data
        run: |
          SLOT_ARG=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          fi
          python gfs_fetcher.py $SLOT_ARG || echo "GFS fetch failed -- pipeline will use climatology defaults"
          [ -f data/gfs_realtime_43295.csv ] && head -2 data/gfs_realtime_43295.csv || echo "No GFS CSV"
        continue-on-error: true

      - name: Fetch pan-India spatial forecast
        run: |
          SLOT_ARG=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          fi
          python pan_india_gfs_fetcher.py $SLOT_ARG
          # pan_india_gfs_fetcher.py writes its own slot-scoped artifact, not the
          # shared data/pan_india_grid.json (that path is owned solely by
          # backend/pipeline.py via update_grid.yml -- see docs/PIPELINE_OWNERSHIP.md).
          [ -f data/pan_india_grid_slotrun.json ] && python3 -c 'import json; d=json.load(open("data/pan_india_grid_slotrun.json")); c=d.get("grid_cells",[]); s=d.get("summary",{}).get("thunderstorm",{}); print("pan-India slot-run grid:",len(c),"cells ts_max="+str(round(s.get("max_prob",0)*100,1))+"%")' || echo 'pan-India slot-run grid not yet available'
        continue-on-error: true

      - name: Fetch Himawari-9 satellite data
        run: python fetch_himawari_realtime.py
        continue-on-error: true

      - name: Fetch BLR terrain DEM (SRTM via AWS Terrain Tiles)
        run: python fetch_dem_terrain.py
        continue-on-error: true
        
      - name: Fetch live METAR (VOBL)
        run: python fetch_metar.py
        continue-on-error: true

      - name: Run forecast pipeline
        run: |
          SLOT_ARG=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          fi
          python forecast_action.py $SLOT_ARG
          python -c "
          import json, sys, os
          from datetime import datetime, timezone
          if not os.path.exists('forecast.json'):
              print('ERROR: forecast.json missing!')
              sys.exit(1)
          with open('forecast.json') as f:
              d = json.load(f)
          gen = d.get('generated_at_utc', '')
          if gen:
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(gen.replace('Z','+00:00'))).total_seconds()/3600
              print(f'forecast.json age: {age:.2f}h  generated_at: {gen}')
              if age > 3:
                  print('WARNING: forecast.json older than 3h')
          "

      - name: Compute real-time SHAP
        run: python compute_realtime_shap.py
        continue-on-error: true

      - name: Run daily verification
        run: python verify_today.py
        continue-on-error: true

      - name: Populate skill scores
        run: python populate_skill_scores.py
        continue-on-error: true

      - name: Append alert log entry
        run: python generate_alert_log.py
        continue-on-error: true

      - name: Sync latest cross-workflow artifacts
        run: |
          git fetch origin main
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" pull origin main --no-rebase --no-edit || true

      - name: Build canonical forecast
        run: python canonical_forecast_writer.py

      - name: Record pre-build marker timestamp (proves the artifact belongs to THIS run)
        # 2026-10-10: a timestamp alone inside the artifact's own JSON
        # content (generated_at_utc) is not independent proof -- it is
        # written by the same process being validated, so a bug or a
        # stale cached value there wouldn't be caught by cross-checking
        # the file against itself. This captures the OS-level wall-clock
        # time from a point OUTSIDE and BEFORE the generator step, so
        # the next step can require data/unified_forecast.json's actual
        # filesystem mtime (not its self-reported content) to be newer
        # than this marker -- real, external proof the file was written
        # during this run, not coincidentally already-fresh from
        # something else.
        run: date -u +%s > /tmp/pre_unified_artifact_marker.txt

      - name: Generate unified SIH forecast artifact (TS/CB/FF, 992 cells x 5 leads)
        id: unified_artifact
        # 2026-10-06 production-plumbing pass (updated same day, Phase 3):
        # this is the ONE authoritative production generator for
        # data/unified_forecast.json (Priority 8). It attempts a real
        # current-cycle GFS fetch for CB internally
        # (scripts/gfs_live_cb_predictors.py: AWS Open Data mirror primary,
        # NOMADS CGI secondary fallback); if both are unreachable from this
        # runner it falls back HONESTLY to the fixed, validated cycle
        # (status FIXED_VALIDATION_FALLBACK, never silently "LIVE"). See
        # the "Preflight -- AWS Open Data GFS mirror" step above for an
        # independent connectivity proof from this exact runner.
        # The script's own atomic-write + reject-list means a malformed
        # build can NEVER overwrite the last-known-good artifact already
        # committed to the repo -- see scripts/phase34_build_unified_forecast.py.
        # continue-on-error so a problem here never blocks the unrelated
        # legacy VOBL dashboard deploy that the rest of this job produces;
        # the step's own exit code (visible in the Action run log) still
        # shows this clearly rather than silently looking green.
        #
        # 2026-10-10: the prior os._exit(0) fix (added to the script's
        # __main__ guard, on the theory the "double free or corruption
        # (!prev)" crash happened during CPython's post-return interpreter
        # shutdown) was verified on this session's own Windows dev
        # machine -- which CANNOT reproduce a glibc heap-corruption abort
        # at all, Windows doesn't use glibc's malloc. That "verification"
        # was never meaningful evidence for the real failure. Confirmed via
        # the GitHub Checks annotations API (job logs require repo sign-in
        # this session has no credentials for, but check-run annotations
        # are public) that the real Ubuntu runner is STILL hitting exit
        # code 134 on every run since, meaning the crash happens somewhere
        # os._exit(0) never gets reached -- most likely DURING execution
        # in a native-extension worker thread (xgboost/OpenMP), not only
        # at shutdown. MALLOC_ARENA_MAX=1 and OMP_NUM_THREADS=1 are the
        # standard, widely-documented mitigation for exactly this "double
        # free or corruption (!prev)" signature from multi-threaded
        # xgboost/OpenBLAS on Linux glibc (thread-local malloc arenas
        # racing on the same corrupted heap region) -- not a blind guess.
        env:
          MALLOC_ARENA_MAX: "1"
          OMP_NUM_THREADS: "1"
        # 2026-10-10: surfaces the real Python traceback (if any -- a
        # native SIGABRT/exit-134 crash has no catchable traceback, but
        # any OTHER failure path now does) as a ::error:: workflow
        # command, visible via the public GitHub Checks annotations API
        # without needing repo sign-in for full job logs.
        run: |
          python scripts/phase34_build_unified_forecast.py 2> /tmp/unified_artifact_stderr.log || {
            echo "::error::phase34_build_unified_forecast.py failed: $(tail -c 3000 /tmp/unified_artifact_stderr.log | tr '\n' ' ')"
            cat /tmp/unified_artifact_stderr.log
            exit 1
          }
        continue-on-error: true

      - name: Verify unified artifact is genuinely fresh and valid (independent of process exit code)
        id: unified_artifact_check
        # 2026-10-10: two separate attempts (os._exit(0), then
        # MALLOC_ARENA_MAX=1/OMP_NUM_THREADS=1/nthread=1) to fix the real
        # exit-134 "double free or corruption (!prev)" native crash in
        # the step above have both failed to stop it from happening on
        # every real CI run (confirmed via the GitHub Checks annotations
        # API) -- yet the ORIGINAL incident report that started this
        # investigation showed the crash happens AFTER the script already
        # printed accepted=true, i.e. after scripts/phase34_build_unified_
        # forecast.py's own atomic os.replace() already safely wrote a
        # genuinely valid data/unified_forecast.json to disk. Relying on
        # the Python process's OWN exit code to decide
        # steps.unified_artifact.outcome is therefore the wrong signal --
        # a native crash in cleanup code that runs AFTER the real work
        # finished will always masquerade as a build failure under that
        # scheme, no matter how the crash itself is eventually fixed.
        # This step instead independently re-validates the artifact's
        # actual on-disk content and freshness, decoupled from whatever
        # the process's exit code was. A file is only accepted here if
        # it is BOTH freshly written during this exact job run (not the
        # old last-known-good artifact left untouched by a genuine
        # reject) AND passes every one of the script's own validation
        # keys again -- so this cannot be tricked by a stale artifact
        # that merely happens to be valid.
        #
        # 2026-10-10 hardening: a timestamp alone is not sufficient
        # proof of successful generation this run -- the artifact's own
        # generated_at_utc is self-reported by the same process being
        # validated, and a 30-minute window alone could theoretically
        # (if unlikely) still match an unrelated stale file. Added: (1)
        # the file's actual OS-level mtime must be newer than a marker
        # timestamp captured OUTSIDE and BEFORE the generator step --
        # real, external proof the file was touched during this run,
        # not merely self-reported as such; (2) explicit record/cell
        # counts re-derived directly from the records array itself
        # (len(records)==4960, len(unique cell_ids)==992), not merely
        # trusting the validation dict's own booleans, which are
        # computed by the same process.
        run: |
          python3 -c "
          import json, os, sys
          from datetime import datetime, timezone

          def fail(reason):
              print(f'NOT OK: {reason}')
              with open('/tmp/unified_artifact_check_ok.txt', 'w') as f:
                  f.write('false')
              sys.exit(0)

          path = 'data/unified_forecast.json'

          try:
              with open('/tmp/pre_unified_artifact_marker.txt') as f:
                  marker_epoch = int(f.read().strip())
          except Exception as exc:
              fail(f'pre-build marker missing or unreadable ({type(exc).__name__}: {exc}) -- '
                   f'cannot prove this run touched the file at all')

          try:
              mtime_epoch = os.path.getmtime(path)
          except Exception as exc:
              fail(f'{path} missing or stat-unreadable ({type(exc).__name__}: {exc})')
          if mtime_epoch < marker_epoch:
              fail(f'{path} filesystem mtime ({mtime_epoch:.0f}) is OLDER than the pre-build marker '
                   f'for this run ({marker_epoch}) -- this is provably the untouched last-known-good '
                   f'artifact from a previous run, not something this run wrote')

          try:
              with open(path, encoding='utf-8') as f:
                  artifact = json.load(f)
          except Exception as exc:
              fail(f'{path} missing or unparseable ({type(exc).__name__}: {exc})')

          generated_at = artifact.get('generated_at_utc')
          try:
              generated_dt = datetime.fromisoformat(generated_at.replace('Z', '+00:00'))
          except Exception as exc:
              fail(f'generated_at_utc missing or unparseable ({generated_at!r}: {exc})')
          age_minutes = (datetime.now(timezone.utc) - generated_dt).total_seconds() / 60.0
          if age_minutes > 30:
              fail(f'artifact is {age_minutes:.1f} minutes old -- not freshly written this run '
                   f'(the script left the old last-known-good artifact untouched, a genuine reject)')

          records = artifact.get('records', [])
          if len(records) != 4960:
              fail(f'expected exactly 4960 records, found {len(records)} (re-derived directly, '
                   f'not trusting the self-reported validation dict)')
          unique_cells = {r.get('cell_id') for r in records}
          if len(unique_cells) != 992:
              fail(f'expected exactly 992 unique cell_ids, found {len(unique_cells)} (re-derived directly)')
          lead_hours_by_cell = {}
          for r in records:
              lead_hours_by_cell.setdefault(r.get('cell_id'), set()).add(r.get('lead_hours'))
          incomplete_cells = [c for c, leads in lead_hours_by_cell.items() if len(leads) != 5]
          if incomplete_cells:
              fail(f'{len(incomplete_cells)} cell(s) do not have exactly 5 distinct lead_hours '
                   f'(re-derived directly): {incomplete_cells[:5]}')

          v = artifact.get('validation', {})
          required_true = [
              'exactly_992_cells', 'exactly_4960_records', 'all_5_lead_slots_present_per_cell',
              'lead_time_arithmetic_correct_for_every_record', 'all_present_probabilities_in_0_1_range',
              'ff_never_carries_a_fabricated_probability', 'no_unavailable_probability_mapped_to_a_risk_category',
          ]
          failed_keys = [k for k in required_true if not v.get(k)]
          if failed_keys:
              fail(f'validation keys failed: {failed_keys}')

          print(f'OK: artifact is {age_minutes:.1f} min old, mtime proves this-run origin, '
                f'4960 records across 992 cells x 5 leads re-derived directly, all validation keys true')
          with open('/tmp/unified_artifact_check_ok.txt', 'w') as f:
              f.write('true')
          "
          echo "ok=$(cat /tmp/unified_artifact_check_ok.txt)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Send WhatsApp alerts
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
        run: python send_alerts.py
        continue-on-error: true

      - name: Push alert notification
        run: |
          ALERT=$(python -c "
          import json, sys
          try:
              d = json.load(open('forecast.json'))
              if d.get('alert_active'):
                  pk = d.get('peak_slot', '?')
                  prob = round(d.get('peak_probability', 0)*100, 1)
                  slot_names = {0:'00:01-06:00',1:'06:01-12:00',2:'12:01-18:00',3:'18:01-24:00'}
                  window = slot_names.get(pk, str(pk))
                  regime = d.get('convective_initiation', {}).get('monsoon_regime', '')
                  cape = d.get('convective_initiation', {}).get('cape_now', 0)
                  sigmet = d.get('sigmet_bulletin') or ''
                  intensity = 'SEVERE' if prob >= 70 else 'MODERATE' if prob >= 40 else 'LIGHT'
                  msg = f'VOBL TS ALERT {intensity} | Slot {pk} ({window} IST) | {prob}% probability | CAPE {cape:.0f} J/kg | Regime {regime}'
                  if sigmet:
                      msg += f'\n---\n{sigmet}'
                  print(msg)
          except Exception as e:
              pass
          ")
          if [ -n "$ALERT" ]; then
            curl -s -o /dev/null -X POST \
              -H "Title: VOBL Thunderstorm Alert" \
              -H "Priority: high" \
              -H "Tags: thunder,cloud,rotating_light" \
              -d "$ALERT" \
              https://ntfy.sh/csir-vobl-thunderstorm || true
            echo "Alert notification sent"
          else
            echo "No alert -- notification skipped"
          fi
        continue-on-error: true

      - name: Inject Worker URL into dashboard
        run: |
          sed -i "s|WORKER_URL_PLACEHOLDER|${{ secrets.WORKER_URL }}|g" index.html
          echo "Worker URL injected into index.html"

      - name: Commit and push forecast outputs
        # 2026-10-08 fix: a real production bug, found and root-caused by
        # diagnosing 9 consecutive failed scheduled runs (all failing at
        # the "Validate unified artifact before deploy" step, every one
        # instantly -- consistent with corrupted, not slow, JSON). `git
        # pull ... || true` swallows a genuine MERGE CONFLICT, not just a
        # harmless "nothing to pull" -- on conflict it leaves literal
        # `<<<<<<<`/`=======`/`>>>>>>>` markers written into the working
        # tree files, and the very next `git add`/`git commit` then
        # happily commits that broken JSON. This was previously masked
        # for data/unified_forecast.json because, before CB started using
        # genuinely live GFS data, the file barely changed between runs
        # (nearly every byte identical except generated_at_utc), so a
        # real line-level conflict was rare. Once CB began varying across
        # most of its 4,960 records every run (2026-10-06), concurrent/
        # back-to-back runs' pulls started conflicting on this file
        # almost every time -- exactly matching when the failures began.
        # Fix: back up EVERY generated file this step adds (not just
        # forecast.json, which already had this protection) and
        # unconditionally restore the freshly-generated version after the
        # pull, so a conflict can never leave a corrupted file staged --
        # this run's own output always wins over whatever pull merged in.
        #
        # 2026-10-08 Phase 1 addition: data/unified_forecast.json is now
        # EXPLICITLY excluded from the commit entirely unless
        # steps.unified_artifact_check.outputs.ok == 'true'. This is on
        # top of, not instead of, the backup/restore/JSON-validate
        # protection below -- a failed build must never even be
        # CANDIDATE for commit, not merely "happen to be filtered out by
        # always being byte-identical to the last good copy".
        #
        # 2026-10-10: switched the gate's source from
        # steps.unified_artifact.outcome (the Python process's own exit
        # code) to steps.unified_artifact_check.outputs.ok (an
        # independent re-validation of the artifact's actual on-disk
        # content and freshness) -- see that step's own comment for why:
        # the real exit-134 native crash this process hits on Linux
        # happens AFTER the artifact is already correctly written, so
        # gating on exit code alone permanently blocks every commit even
        # once the artifact itself is genuinely good.
        env:
          UNIFIED_ARTIFACT_OUTCOME: ${{ steps.unified_artifact_check.outputs.ok }}
        run: |
          git config --global user.name  "SIH Forecast Bot"
          git config --global user.email "bot@sih-hyperlocal.in"
          GENERATED_FILES="forecast.json data/gfs_realtime_43295.csv data/upperair_realtime_43295.csv data/gfs_multiday_43295.json data/himawari_realtime.json data/himawari_history.json data/himawari_b08_features.json data/realtime_shap.json data/verification_today.json data/pipeline_health.json data/skill_scores.json data/forecast_log.csv data/alert_history.json data/blr_terrain.json"
          if [ "$UNIFIED_ARTIFACT_OUTCOME" = "true" ]; then
            GENERATED_FILES="$GENERATED_FILES data/unified_forecast.json"
          else
            echo "unified_artifact_check outputs.ok was '$UNIFIED_ARTIFACT_OUTCOME', not 'true' -- data/unified_forecast.json will NOT be committed this run; last-known-good stays authoritative"
          fi
          mkdir -p /tmp/generated_backup
          for f in $GENERATED_FILES; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/generated_backup/$(dirname "$f")"
              cp "$f" "/tmp/generated_backup/$f"
            fi
          done
          git pull origin main --no-rebase || {
            echo "git pull reported a conflict -- aborting the merge rather than risking corrupted generated files"
            git merge --abort || true
          }
          for f in $GENERATED_FILES; do
            if [ -f "/tmp/generated_backup/$f" ]; then
              cp "/tmp/generated_backup/$f" "$f"
            fi
          done
          python3 -c "
          import json, sys
          path = 'data/unified_forecast.json'
          try:
              with open(path) as f:
                  json.load(f)
          except Exception as exc:
              print(f'ERROR: {path} is not valid JSON after restore ({exc}) -- refusing to commit it')
              sys.exit(1)
          print(f'OK: {path} is valid JSON, safe to commit')
          "
          git add $GENERATED_FILES 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: forecast $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main --force-with-lease || git push origin main || {
            echo "Push failed -- attempting rebase and retry"
            git pull origin main --rebase || { echo "rebase conflict -- aborting"; git rebase --abort || true; }
            for f in $GENERATED_FILES; do
              if [ -f "/tmp/generated_backup/$f" ]; then
                cp "/tmp/generated_backup/$f" "$f"
              fi
            done
            git add $GENERATED_FILES 2>/dev/null || true
            git diff --staged --quiet || git commit -m "auto: forecast retry $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          }

      - name: Build Cloudflare Pages deployment directory
        # 2026-10-08 fix (real production outage, run 37727128213):
        # scripts/phase34_build_unified_forecast.py crashed with
        # ModuleNotFoundError (a dependency that was never committed to
        # git -- now fixed separately) and the pipeline still proceeded
        # all the way to attempting a deploy. Gating this step (and
        # every step after it through the post-deploy smoke test) on
        # steps.unified_artifact_check.outputs.ok == 'true' makes that
        # architecturally impossible going forward: a failed unified
        # build now stops the ENTIRE deploy, not just the one file --
        # per explicit instruction not to publish anything when the
        # pipeline had a partial failure, even though
        # data/unified_forecast.json itself was already protected from
        # corruption (last-known-good preserved; see the commit step).
        if: steps.unified_artifact_check.outputs.ok == 'true'
        run: |
          set -e
          rm -rf pages_dist
          mkdir -p pages_dist
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.pytest_cache/' \
            --exclude='/__pycache__/' \
            --exclude='/backend/' \
            --exclude='/dev/' \
            --exclude='/docs/' \
            --exclude='/DBSIH-Historical-GFSraw/' \
            --exclude='/imd_rain/' \
            --exclude='/models/' \
            --exclude='/notebooks/' \
            --exclude='/pages/' \
            --exclude='/pages_dist/' \
            --exclude='/processed/' \
            --exclude='/rag/' \
            --exclude='/results/' \
            --exclude='/schemas/' \
            --exclude='/scripts/' \
            --exclude='/tests/' \
            --exclude='/worker/' \
            --exclude='/SIH_*/' \
            --exclude='/data/external/' \
            --exclude='/data/_gfs_live_cb_cache/' \
            --exclude='/data/_gfs_live_tmp/' \
            --exclude='/data/_terrain_tile_cache/' \
            --exclude='/data/_location_geocode_cache.json' \
            ./ pages_dist/
          echo "Oversized files remaining in pages_dist (must be empty):"
          find pages_dist -type f -size +25M
          if [ -n "$(find pages_dist -type f -size +25M)" ]; then
            echo "ERROR: pages_dist still contains files over 25MiB"
            exit 1
          fi
          echo "pages_dist size:"
          du -sh pages_dist
          echo "pages_dist top-level contents:"
          ls -la pages_dist

      - name: Validate unified artifact before deploy (reject malformed/empty)
        # Priority 8/15: a bad build of data/unified_forecast.json must
        # never reach production. Uses the SAME validation keys
        # scripts/phase34_build_unified_forecast.py computed and embedded
        # in the artifact itself -- this is a second, independent gate
        # right before deploy, not a re-implementation of that logic.
        if: steps.unified_artifact_check.outputs.ok == 'true'
        run: python3 scripts/ci_validate_unified_artifact.py pages_dist/data/unified_forecast.json

      - name: Deploy to Cloudflare Pages
        if: steps.unified_artifact_check.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="d1ebec3d837d56d32a077b449a65f0c0" \
          npx wrangler@3.87.0 pages deploy pages_dist --project-name=sih-hyperlocal-warning --branch=main

      - name: Post-deploy smoke test (public site actually serves the fresh artifact)
        # Priority 10/13: catches a CDN/propagation-level failure the
        # deploy step itself wouldn't see -- e.g. the Pages deploy
        # "succeeds" but the edge is still serving a stale cached copy.
        # continue-on-error: true because this is a diagnostic check, not
        # a gate -- the deploy already happened by this point, and
        # failing the whole scheduled job here would not undo it.
        #
        # 2026-10-10: a real run showed both checks returning HTTP 403
        # immediately after deploy, while the same URLs returned 200
        # minutes later -- a transient Cloudflare edge-propagation
        # delay, not a genuine deployment failure (confirmed by
        # re-testing both the main domain and the run's own unique
        # deployment URL manually afterward: both 200). The script
        # itself now retries with backoff and exits 1 on a GENUINE
        # failure (never silently passes) -- the sleep here is no
        # longer the only defense against this, so it stays short.
        if: steps.unified_artifact_check.outputs.ok == 'true'
        continue-on-error: true
        run: python3 scripts/ci_smoke_test_deployed_site.py https://sih-hyperlocal-warning.pages.dev