name: India fields (GFS 0.25 deg, all land cells)

# GFS 00Z/12Z cycles are published on the AWS mirror ~3.5-4 h after init; run once they are complete.
on:
  schedule:
    - cron: "40 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-fields
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install eccodes
        run: sudo apt-get update -y && sudo apt-get install -y libeccodes-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas eccodes shapely pillow fastapi httpx
      - name: Ingest the latest complete cycle (all-or-nothing, atomic)
        # exits non-zero and leaves the previous artifact untouched if any hour fails download or verification
        run: python scripts/ingest_india_fields.py
      - name: Independent verification (fail closed)
        run: python scripts/ci_validate_india_fields.py --max-age-hours 20
      - name: Commit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/india_fields_latest.json
          git diff --staged --quiet || git commit -m "Auto: India GFS fields $(date -u +%Y%m%dT%H%MZ)"
          git pull --rebase origin ${{ github.ref_name }} && git push
