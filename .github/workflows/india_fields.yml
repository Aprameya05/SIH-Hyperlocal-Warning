name: India fields (GFS 0.25 deg, all land cells)

# GFS cycles (00/06/12/18Z) are published on the AWS mirror ~3.5-4.5 h after init; run once each is complete. A second, later run per cycle
# covers GitHub delaying or dropping a scheduled run (the ingest is idempotent: an unchanged cycle commits nothing).
on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
    - cron: "20 6,12,18,0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-fields
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install eccodes
        run: sudo apt-get update -y && sudo apt-get install -y libeccodes-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas eccodes shapely pillow fastapi httpx "xgboost>=2.0.0" "scikit-learn==1.7.2" "joblib>=1.3.0"
      - name: Verify model runtime imports (fail early)
        run: python -c "import sklearn,xgboost,joblib; print(sklearn.__version__, xgboost.__version__)"
      - name: Ingest the latest complete cycle (all-or-nothing, atomic)
        # exits non-zero and leaves the previous artifact untouched if any hour fails download or verification
        run: python pipelines/ingestion/ingest_gfs_forecast.py
      - name: Independent verification (fail closed)
        run: python pipelines/validation/validate_national_fields.py --max-age-hours 20
      - name: Apply the evaluated pan-India models to the new cycle
        # always writes an artifact; model_evaluated=false (with a reason) when no lead passed its gate or the cycle is unsupported
        run: |
          python models/thunderstorm/predict_thunderstorm.py
          python models/extreme_rainfall/predict_extreme_rainfall.py
      - name: Build the bundle and run the release-readiness gate on it
        run: |
          python pipelines/publishing/build_pages_bundle.py /tmp/pages_check
          python pipelines/validation/check_release_readiness.py /tmp/pages_check --max-age-hours 20
      - name: Commit artifacts (only reached if every step above succeeded)

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/india_fields_latest.json data/india_ts_model_latest.json data/india_rain_model_latest.json data/ingest_status.json
          git diff --staged --quiet || git commit -m "Auto: India GFS fields $(date -u +%Y%m%dT%H%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }} && git push
