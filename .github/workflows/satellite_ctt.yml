name: Satellite CTT (Himawari-9 B13)

# Near-real-time satellite OBSERVATION: Himawari-9 band-13 brightness temperature and its 30/60-minute change on the 0.25 deg
# grid. Commit-only: the deploy is done by publish_site.yml, which runs right after this workflow (workflow_run) and on a 20-minute
# schedule. The dashboard marks the observation stale after 90 minutes.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to request a site publish after committing (workflow_dispatch is allowed with GITHUB_TOKEN; workflow_run chains are not reliable)

# Own lock: sharing the forecast lock could make GitHub drop a pending forecast run in favour of this one.
concurrency:
  group: satellite-ctt
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy boto3 satpy pyproj pyresample
      - name: Ingest the newest complete scene (all-or-nothing; refuses to publish an invalid artifact)
        run: python pipelines/ingestion/ingest_himawari_ctt.py
      - name: Independent verification (fail closed)
        run: python pipelines/validation/validate_satellite_ctt.py data/india_satellite_ctt_latest.json --max-age-minutes 120
      - name: Commit the artifact
        # main only: a manual run from another ref is a safe dry run of ingestion and validation.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/india_satellite_ctt_latest.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto: Himawari-9 B13 CTT $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the satellite artifact after 3 attempts"; exit 1
      - name: Request a site publish (so the new data reaches the live site now, not at the next scheduled deploy)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish_site.yml --ref main
