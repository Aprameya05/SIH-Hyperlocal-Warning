name: TEST — AWS GFS Preflight (throwaway verification)
# 2026-10-06: isolated, read-only verification that the NOAA AWS Open
# Data GFS mirror (scripts/gfs_aws_source.py) is actually reachable
# from a real GitHub Actions Ubuntu runner -- not just this dev
# sandbox. Deliberately minimal: no checkout of production data, no
# git commit/push, no Cloudflare deploy. Safe to run from any branch
# and safe to delete once verified. Triggers on workflow_dispatch OR a
# push restricted to this exact throwaway branch (GitHub's Actions UI
# doesn't list a workflow_dispatch-only workflow that only exists on a
# non-default branch until it has at least one run -- the push trigger
# below exists solely to produce that first run). Never runs on a
# schedule, and never on main or any other branch.
on:
  workflow_dispatch: {}
  push:
    branches:
      - test/aws-gfs-preflight

jobs:
  aws-gfs-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (read-only, no push back)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies (requests + xarray/cfgrib for GRIB decode)
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir "requests>=2.31.0" "xarray>=2024.0.0" "cfgrib>=0.9.10" "eccodes>=1.6.0"

      - name: AWS GFS mirror -- connectivity + byte-range + GRIB2 decode smoke test
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, "scripts")
          import gfs_aws_source as aws_src

          result = aws_src.check_connectivity()
          print("=== CONNECTIVITY ===")
          print(json.dumps(result, indent=2))

          if result["overall"] != "OK":
              print("Connectivity not OK -- stopping here (this IS the result being verified).")
              sys.exit(0)

          cycle = aws_src.find_latest_available_cycle()
          print(f"\n=== CYCLE DISCOVERY ===\nresolved cycle: {cycle}")

          from pathlib import Path
          out_path = Path("/tmp/aws_gfs_smoke.grib2")
          manifest = aws_src.fetch_cycle_subset(cycle, 6, out_path, fields=[("CAPE", "surface")])
          print("\n=== BYTE-RANGE DOWNLOAD ===")
          print(json.dumps(manifest, indent=2))

          validation = aws_src.validate_grib(out_path)
          print("\n=== GRIB2 DECODE ===")
          print(json.dumps(validation, indent=2))

          overall = "LIVE_VERIFIED" if validation.get("readable") else "BLOCKED"
          print(f"\n=== OVERALL: {overall} ===")
          PYEOF

  full-pipeline-cb-fetch:
    # Phase 1 (2026-10-06): the single-field smoke test above only
    # proves the AWS primitive works on a real runner. This job proves
    # the ACTUAL production code path that phase34_build_unified_forecast.py
    # calls -- scripts/gfs_live_cb_predictors.py's full 992-cell x
    # 8-lead fetch -- runs to completion on GitHub Actions within a
    # practical time/resource budget. Still fully isolated: no checkout
    # of secrets, no git commit/push, no Cloudflare deploy, no
    # forecast_update.yml, no main. use_cache=False forces a genuine
    # fresh fetch so the measured runtime is real, not a cache hit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: aws-gfs-preflight
    steps:
      - name: Checkout repository (read-only, no push back)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir \
            "requests>=2.31.0" "xarray>=2024.0.0" "cfgrib>=0.9.10" "eccodes>=1.6.0" \
            "numpy>=1.24.0" "pandas>=2.0.0" "pyarrow>=14.0.0"

      - name: Disk/memory baseline before fetch
        run: |
          echo "=== DISK (before) ==="; df -h /tmp .
          echo "=== MEMORY (before) ==="; free -h

      - name: Full 992-cell x 8-lead live CB predictor fetch (real runtime measurement)
        run: |
          python3 -c "
          import json, sys, time
          sys.path.insert(0, 'scripts')
          import gfs_live_cb_predictors as cb

          with open('data/pan_india_common_grid_992.json') as f:
              grid = json.load(f)
          cells = grid['cells']
          print(f'cells loaded: {len(cells)}')

          t0 = time.time()
          result = cb.build_live_cb_longform_table(cells, use_cache=False)
          wall_s = time.time() - t0

          df = result.pop('dataframe')
          print(json.dumps(result, indent=2))
          print(f'wall_clock_elapsed_s: {wall_s:.1f}')
          if df is not None:
              print(f'dataframe shape: {df.shape}, unique cells: {df[\"cell_id\"].nunique()}')
              missing_cols = [c for c in df.columns if df[c].isna().all()]
              print(f'columns entirely NaN (never fabricated as 0): {missing_cols}')
          overall = result.get('status')
          print(f'=== FULL PIPELINE OVERALL: {overall} ===')
          if overall == 'UNAVAILABLE':
              sys.exit(1)
          "

      - name: Disk/memory baseline after fetch
        if: always()
        run: |
          echo "=== DISK (after) ==="; df -h /tmp .
          echo "=== MEMORY (after) ==="; free -h
