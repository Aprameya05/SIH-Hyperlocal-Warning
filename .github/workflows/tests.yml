name: Tests (Linux)

on:
  pull_request:
  push:
    branches: [main]
    # bot commits that only refresh generated artifacts do not need a full test run
    paths-ignore:
      - 'data/**'
      - 'forecast.json'
      - 'alert_log.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update -y && sudo apt-get install -y libeccodes-dev libgeos-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # scikit-learn is pinned to the version the model artifacts were trained with.
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest "scikit-learn==1.7.2" "xgboost>=2.0.0" "joblib>=1.3.0" "shap>=0.45.0" \
            "pandas>=2.0.0" "scipy>=1.12.0" "metpy>=1.6.0" "pytz>=2024.1" "pyproj>=3.6.0" \
            "pyarrow>=14.0.0" "httpx>=0.27.0" "shapely" "pillow" "pyyaml" "boto3>=1.34.0" "h5py"
      - name: Run the full test suite
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider -rs

  e2e:
    # Browser tests against the BUILT publish bundle (system Chrome via playwright-core; no browser download).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update -y && sudo apt-get install -y libeccodes-dev libgeos-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bundle build dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt "pandas>=2.0.0" "scipy>=1.12.0" "pyyaml"
      - name: Install Playwright core
        run: cd tests/e2e && npm install --no-audit --no-fund
      - name: Browser tests (dashboard)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: cd tests/e2e && node --test drift.spec.mjs
      - name: Browser tests (cell inspector)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: cd tests/e2e && node --test inspector.spec.mjs
      - name: Browser tests (every tab)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: cd tests/e2e && node --test tabs.spec.mjs
      - name: Browser tests (command centre tabs)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: cd tests/e2e && node --test shell.spec.mjs
      - name: Browser tests (premium interface)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHONUTF8: "1"
        run: cd tests/e2e && node --test design.spec.mjs
