name: Update Hazard Grid

on:
  schedule:
    # Runs at 04:30, 10:30, 16:30, 22:30 UTC (just after each GFS cycle posts)
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:
    # Adds a "Run workflow" button in GitHub Actions tab for manual trigger

permissions:
  contents: write

jobs:
  update-grid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install eccodes system library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pipeline
        run: python backend/pipeline.py

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pan_india_grid.json data/ctt_grid.json
          git diff --staged --quiet || git commit -m "Auto: GFS grid update $(date -u +%Y%m%dT%H%MZ)"
          git push
