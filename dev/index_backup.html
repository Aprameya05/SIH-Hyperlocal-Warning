              <div className="rounded-2xl atc-card p-4">
                <h3 className="text-[10px] text-cyan-300 font-bold uppercase tracking-wider border-b border-[#172338] pb-2 mb-3">
                  ESSENTIAL METEOROLOGICAL READINGS
                </h3>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    { label: 'WIND SURFACE', value: liveData?.metar?.wind_dir != null ? `${liveData.metar.wind_dir}° / ${liveData.metar.wind_speed_kt} kts` : '—' },
                    { label: 'VISIBILITY', value: liveData?.metar?.visibility_km != null ? `${liveData.metar.visibility_km} km` : '—' },
                    { label: 'TEMPERATURE', value: liveData?.metar?.temp_c != null ? `${liveData.metar.temp_c}°C` : '—' },
                    { label: 'REL. HUMIDITY', value: liveData?.metar?.rh_pct != null ? `${liveData.metar.rh_pct.toFixed(0)}%` : '—' },
                    { label: 'CAPE', value: liveData?.met_parameters?.ua_cape_jkg != null ? `${liveData.met_parameters.ua_cape_jkg} J/kg` : (liveData?.met_parameters?.CAPE != null ? `${liveData.met_parameters.CAPE.toFixed(0)} J/kg` : '—') },
                    { label: 'K-INDEX', value: liveData?.met_parameters?.ua_k_index ?? liveData?.met_parameters?.K_INDEX?.toFixed(1) ?? '—' },
                    { label: 'LIFTED INDEX', value: liveData?.met_parameters?.ua_lifted_index ?? liveData?.met_parameters?.LIFTED_INDEX?.toFixed(2) ?? '—' },
                    { label: 'TOTALS-TOTALS', value: liveData?.met_parameters?.ua_totals_totals ?? liveData?.met_parameters?.TOTALS_TOTALS?.toFixed(1) ?? '—' },
                  ].map(item => (
                    <div key={item.label} className="p-3 rounded-xl bg-[#050811] border border-[#172338]">
                      <span className="text-[9px] text-[#607d8b] block font-bold">{item.label}</span>
                      <span className="text-base font-extrabold text-white">{item.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Flight category + METAR */}
              <div className="rounded-2xl atc-card p-4 flex items-center justify-between">
                <div>
                  <div className="text-[9px] text-[#607d8b] font-bold">FLIGHT CATEGORY</div>
                  <div className={`text-2xl font-extrabold ${fcColor}`}>{flightCat}</div>
                  <div className="text-[9px] text-[#607d8b] mt-0.5">VOBL · METAR</div>
                </div>
                <div className="text-right">
                  <div className="text-[9px] text-[#607d8b] font-bold">S-BAND RADAR</div>
                  <div className="text-sm font-bold text-white">BENGALURU ACTIVE</div>
                  <div className="text-[9px] text-[#607d8b]">CSIR/IMD STATION 43295</div>
                </div>
              </div>
            </div>

            {/* Right: situational awareness */}
            <div className="col-span-3 flex flex-col gap-3">

              {/* Monsoon phase */}
              <div className="rounded-2xl atc-card p-4">
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">MONSOON REGIME</div>
                <div className={`text-lg font-extrabold ${phaseColor}`}>
                  {monsoonPhase ?? liveData?.synoptic_regime?.regime_name ?? 'DETECTING...'}
                </div>
                <div className="mt-2 space-y-0.5 text-[9px]">
                  {regimeFactor !== null && (
                    <div className="flex justify-between">
                      <span className="text-[#607d8b]">THRESH FACTOR</span>
                      <span className={`font-bold ${regimeFactor < 1 ? 'text-cyan-400' : regimeFactor > 1 ? 'text-amber-400' : 'text-white'}`}>
                        ×{regimeFactor.toFixed(2)}
                      </span>
                    </div>
                  )}
                  {capeTendency !== null && (
                    <div className="flex justify-between">
                      <span className="text-[#607d8b]">CAPE TENDENCY</span>
                      <span className={`font-bold ${capeTendency > 50 ? 'text-red-400' : capeTendency < -50 ? 'text-emerald-400' : 'text-white'}`}>
                        {capeTendency > 0 ? '+' : ''}{capeTendency.toFixed(0)} J/kg/h
                      </span>
                    </div>
                  )}
                  {capeTrend && (
                    <div className="flex justify-between">
                      <span className="text-[#607d8b]">CAPE TREND</span>
                      <span className={`font-bold ${capeTrend === 'BUILDING' ? 'text-red-400' : capeTrend === 'WEAKENING' ? 'text-emerald-400' : 'text-white'}`}>
                        {capeTrend}
                      </span>
                    </div>
                  )}
                  {monsoonIndex !== null && (
                    <div className="flex justify-between">
                      <span className="text-[#607d8b]">MONSOON IDX</span>
                      <span className="font-bold text-white">{typeof monsoonIndex === 'number' ? monsoonIndex.toFixed(2) : monsoonIndex}</span>
                    </div>
                  )}
                </div>
                {/* Operational threshold note */}
                <div className={`mt-2 pt-2 border-t border-[#172338] text-[8px] font-bold ${phaseColor}`}>
                  {monsoonPhase === 'CONVECTIVE_BURST'
                    ? 'BURST: All thresholds at 80% — maximum sensitivity'
                    : (monsoonPhase === 'ACTIVE' || monsoonPhase === 'ACTIVE_MODERATE')
                      ? 'ACTIVE: Thresholds lowered — increased sensitivity'
                      : monsoonPhase === 'BREAK'
                        ? 'BREAK: Thresholds raised — suppress false alarms'
                        : 'NEUTRAL: Default operational thresholds applied'}
                </div>
              </div>

              {/* Himawari state */}
              <div className={`rounded-2xl atc-card p-4 ${stormDetected ? 'border-orange-500/50' : ''}`}>
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">HIMAWARI-9 SATELLITE</div>
                <div className={`text-base font-extrabold ${stormDetected ? 'text-orange-400 animate-pulse' : 'text-emerald-400'}`}>
                  {stormDetected ? '⚡ STORM DETECTED' : '✓ CLEAR'}
                </div>
                <div className="mt-2 space-y-0.5 text-[9px]">
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">MIN BT (50km)</span>
                    <span className={`font-bold ${minBT !== null && minBT < -40 ? 'text-red-400' : 'text-white'}`}>
                      {minBT !== null ? `${minBT.toFixed(1)}°C` : '—'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">BT TREND 1H</span>
                    <span className={`font-bold ${btTrend1h !== null && btTrend1h < -3 ? 'text-red-400' : btTrend1h !== null && btTrend1h > 3 ? 'text-emerald-400' : 'text-white'}`}>
                      {btTrend1h !== null ? `${btTrend1h > 0 ? '+' : ''}${btTrend1h.toFixed(1)}°C` : '—'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">COLD PIXELS</span>
                    <span className={`font-bold ${coldPx >= 50 ? 'text-orange-400' : 'text-white'}`}>{coldPx}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#607d8b]">SAT OVERRIDE</span>
                    <span className={`font-bold ${isSatOverride ? 'text-orange-400' : 'text-emerald-400'}`}>
                      {isSatOverride ? 'ACTIVE' : 'INACTIVE'}
                    </span>
                  </div>
                  {metarTsOverride && (
                    <div className="flex justify-between">
                      <span className="text-[#607d8b]">METAR TS OVERRIDE</span>
                      <span className="font-bold text-red-400 animate-pulse">ACTIVE</span>
                    </div>
                  )}
                </div>
              </div>

              {/* All slots summary */}
              <div className="rounded-2xl atc-card p-4 flex-1">
                <div className="text-[9px] text-[#607d8b] font-bold mb-2">ALL SLOTS</div>
                <div className="space-y-2">
                  {slots && slots.map(s => {
                    const isActive = s.slot === currentSlot.slot;
                    const exceeded = s.ts_probability >= s.threshold;
                    return (
                      <div key={s.slot} className={`flex items-center justify-between p-2 rounded-lg ${
                        isActive ? 'bg-cyan-500/15 border border-cyan-500/40' : 'bg-[#050811] border border-[#172338]'
                      }`}>
                        <div>
                          <div className={`text-[9px] font-bold ${isActive ? 'text-cyan-300' : 'text-[#607d8b]'}`}>
                            {isActive ? '▶ ' : ''}{s.label}
                          </div>
                          <div className="text-[8px] text-[#607d8b]">{s.time}</div>
                        </div>
                        <div className={`text-sm font-extrabold ${
                          exceeded ? 'text-red-400' : s.ts_probability >= 0.15 ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {(s.ts_probability * 100).toFixed(1)}%
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* ── SIGMET + Recent Alerts strip ── */}
          {(sigmetBulletin || recentAlerts.length > 0) && (
            <div className="px-8 pb-2 flex gap-4">
              {sigmetBulletin && (
                <div className="flex-1 rounded-xl bg-orange-500/10 border border-orange-500/40 p-3">
                  <div className="flex items-center gap-2 mb-1 text-[9px] text-orange-300 font-bold">
                    <span>📡</span>
                    <span>AUTO-GENERATED SIGMET</span>
                    <span className="ml-auto text-[8px] text-[#607d8b]">ADVISORY ONLY — NOT FOR OFFICIAL USE</span>
                  </div>
                  <pre className="text-[9px] text-orange-200 whitespace-pre-wrap leading-relaxed font-mono">{sigmetBulletin}</pre>
                </div>
              )}
              {recentAlerts.length > 0 && (
                <div className="w-64 rounded-xl bg-red-500/5 border border-red-500/30 p-3">
                  <div className="text-[9px] text-red-300 font-bold mb-2">RECENT ALERTS (LAST {recentAlerts.length})</div>
                  <div className="space-y-1">
                    {recentAlerts.slice().reverse().map((a, i) => (
                      <div key={i} className="flex justify-between text-[8px]">
                        <span className="text-[#607d8b]">{a.date} S{a.peak_slot}</span>
                        <span className={`font-bold ${a.peak_probability >= 0.7 ? 'text-red-400' : a.peak_probability >= 0.4 ? 'text-amber-400' : 'text-white'}`}>
                          {(a.peak_probability * 100).toFixed(0)}%
                        </span>
                        <span className="text-[#607d8b] truncate max-w-[80px]">{a.monsoon_regime}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── Footer ── */}
          <div className="px-8 py-3 border-t border-[#172338] flex justify-between items-center text-[10px] text-[#607d8b]">
            <span>FULLSCREEN ATC VIEW · PRESS ESC OR CLICK BUTTON ABOVE TO EXIT</span>
            <button onClick={onExitAtc} className="text-cyan-400 font-bold hover:text-cyan-300">EXIT ATC VIEW ✖</button>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [liveData, setLiveData] = useState(null);
      const [isLiveData, setIsLiveData] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');
      const [fetchLatencyMs, setFetchLatencyMs] = useState(null);
      const [currentSlots, setCurrentSlots] = useState(DEFAULT_SLOTS);
      const [selectedSlotIndex, setSelectedSlotIndex] = useState(() => getInitialSlotByIstTime());
      const [liveTime, setLiveTime] = useState('');
      const NAV_TAB_LIST = ['DASHBOARD', 'FORECAST', 'RADAR MAP', 'MODELS', 'EXPLAINABILITY', 'REGIMES', 'LIVE API', 'ATC VIEW'];
      const hashToTab = (h) => {
        const map = { '#dashboard':'DASHBOARD','#forecast':'FORECAST','#radar':'RADAR MAP','#models':'MODELS','#explainability':'EXPLAINABILITY','#regimes':'REGIMES','#api':'LIVE API','#atc':'ATC VIEW' };
        return map[h.toLowerCase()] || 'DASHBOARD';
      };
      const tabToHash = (t) => {
        const map = { 'DASHBOARD':'#dashboard','FORECAST':'#forecast','RADAR MAP':'#radar','MODELS':'#models','EXPLAINABILITY':'#explainability','REGIMES':'#regimes','LIVE API':'#api','ATC VIEW':'#atc' };
        return map[t] || '#dashboard';
      };
      const [activeNavTab, setActiveNavTab] = useState(() => {
        if (typeof window !== 'undefined' && window.location.hash) return hashToTab(window.location.hash);
        return 'DASHBOARD';
      });
      const [isAtcMode, setIsAtcMode] = useState(false);
      const [showKbHint, setShowKbHint] = useState(() => {
        try { return !localStorage.getItem('csir_kb_hint_seen'); } catch { return true; }
      });
      const [copyFeedback, setCopyFeedback] = useState(false);

      // Fix 2: Parallax Mouse Tracking State & Effect
      const [mousePos, setMousePos] = React.useState({ x: 0.5, y: 0.5 });

      React.useEffect(() => {
        const handler = (e) => {
          const x = e.clientX / window.innerWidth;
          const y = e.clientY / window.innerHeight;
          setMousePos({ x, y });
        };
        window.addEventListener('mousemove', handler);
        return () => window.removeEventListener('mousemove', handler);
      }, []);

      const isTouch = typeof window !== 'undefined' && window.matchMedia('(hover: none)').matches;
      const bgTransform = isTouch
        ? 'scale(1.05)'
        : `translate(${(0.5 - mousePos.x) * 16}px, ${(0.5 - mousePos.y) * 10}px) scale(1.06)`;

      // Fetch forecast telemetry
      const fetchRealForecast = async () => {
        try {
          const t0 = performance.now();
          const res = await fetch('./forecast.json');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const latency = performance.now() - t0;
          setFetchLatencyMs(Math.round(latency));
          setLiveData(json);
          setLastUpdated(json.generated_at || json.date || 'Just now');
          setIsLiveData(true);
          if (Array.isArray(json.slots)) {
            setCurrentSlots(json.slots.map(s => ({
              slot: s.slot,
              label: s.label.toUpperCase(),
              time: s.time,
              ts_probability: s.ts_probability,
              ts_predicted: s.ts_predicted,
              threshold: s.threshold,
              icon: s.slot === 0 ? "🌙" : s.slot === 1 ? "☀️" : s.slot === 2 ? "⛅" : "🌆"
            })));
            // Auto-select peak slot when alert is active (override or model)
            if (json.alert_active && json.peak_slot !== undefined && json.peak_slot !== null) {
              setSelectedSlotIndex(json.peak_slot);
            }
          }
        } catch (err) {
          setIsLiveData(false);
          setLastUpdated('2026-07-25 17:20 IST');
          setCurrentSlots(DEFAULT_SLOTS);
        }
      };

      useEffect(() => {
        fetchRealForecast();
        const interval = setInterval(fetchRealForecast, 300000);
        return () => clearInterval(interval);
      }, []);

      // IST Clock Ticker
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const ist = new Date(utc + (3600000 * 5.5));
          setLiveTime(ist.toLocaleTimeString('en-US', { hour12: false }) + ' IST');
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      const handleNavTabClick = (tab) => {
        setActiveNavTab(tab);
        if (typeof window !== 'undefined') window.location.hash = tabToHash(tab);
        if (tab === 'ATC VIEW') setIsAtcMode(true);
        else setIsAtcMode(false);
      };

      const handleExitAtc = () => {
        setIsAtcMode(false);
        setActiveNavTab('DASHBOARD');
        if (typeof window !== 'undefined') window.location.hash = '#dashboard';
      };

      // Keyboard shortcuts: 1-8 jump tabs
      useEffect(() => {
        const handler = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const idx = parseInt(e.key) - 1;
          if (!isNaN(idx) && idx >= 0 && idx < NAV_TAB_LIST.length) {
            handleNavTabClick(NAV_TAB_LIST[idx]);
          }
          if (e.key === '?' || (e.key === '/' && !e.shiftKey)) {
            setShowKbHint(v => !v);
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, []);

      // Dismiss keyboard hint
      const dismissKbHint = () => {
        setShowKbHint(false);
        try { localStorage.setItem('csir_kb_hint_seen', '1'); } catch {}
      };

      // Copy forecast summary
      const copyForecastSummary = () => {
        if (!liveData) return;
        const slots = liveData.slots || currentSlots;
        const regime = liveData.monsoon_regime?.regime || 'UNKNOWN';
        const maxProb = Math.max(...slots.map(s => s.ts_probability ?? s.ts_prob ?? 0));
        const slotLines = slots.map(s => {
          const labels = ['00–06 IST','06–12 IST','12–18 IST','18–24 IST'];
          const p = ((s.ts_probability ?? s.ts_prob ?? 0)*100).toFixed(1);
          const pred = s.ts_predicted ? '⚡ ALERT' : 'STABLE';
          return `  ${labels[s.slot] || `Slot ${s.slot}`}: ${p}% — ${pred}`;
        }).join('\n');
        const text = `CSIR Thunderstorm Nowcast — VOBL Bengaluru — ${liveData.date || new Date().toISOString().slice(0,10)}
Regime: ${regime} | Max Prob: ${(maxProb*100).toFixed(1)}%
${slotLines}
Source: csir-thunderstorm-bengaluru.pages.dev`;
        navigator.clipboard.writeText(text).then(() => {
          setCopyFeedback(true);
          setTimeout(() => setCopyFeedback(false), 2000);
        });
      };

      // Data staleness check
      const dataAgeHours = (() => {
        if (!liveData?.generated_at) return null;
        try {
          const gen = new Date(liveData.generated_at.replace(' IST','').replace(' ','T'));
          const now = new Date();
          return (now - gen) / 3600000;
        } catch { return null; }
      })();

      return (
        <div className="min-h-screen text-[#e8eaf6] relative overflow-hidden">
          
          {/* ALL 4 SLOT BACKGROUND DIVS — overflow:hidden clips parallax movement */}
          <div className="fixed inset-0 overflow-hidden" style={{zIndex: 0, pointerEvents: 'none'}}>
          <div
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./night1.png')`,
              opacity: selectedSlotIndex === 0 ? 1 : 0,
              transform: bgTransform,
              transition: 'opacity 1s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
          />
          <div
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./morning1.png')`,
              opacity: selectedSlotIndex === 1 ? 1 : 0,
              transform: bgTransform,
              transition: 'opacity 1s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
          />
          <div
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./afternoon1.png')`,
              opacity: selectedSlotIndex === 2 ? 1 : 0,
              transform: bgTransform,
              transition: 'opacity 1s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
          />
          <div
            className="slot-bg-common"
            style={{
              backgroundImage: `url('./evening1.png')`,
              opacity: selectedSlotIndex === 3 ? 1 : 0,
              transform: bgTransform,
              transition: 'opacity 1s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
          />
          </div>

          {/* Radial Vignette Depth Layer */}
          <div
            className="fixed inset-0 pointer-events-none z-[2]"
            style={{ background: 'radial-gradient(ellipse at center, transparent 40%, rgba(4,7,17,0.7) 100%)' }}
          />

          {/* Overlay div */}
          <div className="overlay"></div>

          {/* ── AURORA BACKGROUND ── */}
          <AuroraBackground alertActive={liveData?.alert_active ?? currentSlots.some(s => s.ts_probability >= 0.30)} />

          {/* ── PARTICLE FIELD ── */}
          <ParticleField alertActive={liveData?.alert_active ?? currentSlots.some(s => s.ts_probability >= 0.30)} />

          {/* ── SCAN LINE ── */}
          <ScanLine />

          {/* REAL-TIME ATMOSPHERIC WEATHER OVERLAY */}
          <AtmosphericWeatherOverlay selectedSlotIndex={selectedSlotIndex} />

          {/* Foreground UI Content Container */}
          <div className="relative z-20 flex flex-col min-h-screen">
            
            {/* Header Bar */}
            <HeaderBar 
              liveTime={liveTime} 
              isLiveData={isLiveData} 
              activeNavTab={activeNavTab}
              onNavTabChange={handleNavTabClick}
            />

            {/* ── STALE DATA BANNER ── */}
            {dataAgeHours !== null && dataAgeHours > 4 && (
              <div className="relative z-30 flex items-center justify-between gap-3 px-4 py-2 bg-amber-950/80 border-b border-amber-500/50 font-mono text-xs backdrop-blur-sm">
                <span className="flex items-center gap-2 text-amber-300">
                  <span className="text-base">⚠</span>
                  <span>FORECAST DATA IS <strong>{dataAgeHours.toFixed(1)}h OLD</strong> — Pipeline may have stalled. Last run: {liveData.generated_at}</span>
                </span>
                <span className="text-amber-500 text-[10px] shrink-0">Expected update every 6h</span>
              </div>
            )}

            {/* ── COPY FORECAST + KEYBOARD HINT STRIP ── */}
            <div className="relative z-30 flex items-center justify-between gap-3 px-4 py-1.5 font-mono"
              style={{
                background:'rgba(2,4,12,0.8)',
                borderBottom:'1px solid rgba(56,189,248,0.08)',
                backdropFilter:'blur(10px)',
              }}>
              <div className="flex items-center gap-3 text-[9px]" style={{ color:'rgba(96,125,139,0.85)' }}>
                <span className="hidden sm:inline">Keys 1–8 switch tabs</span>
                <span className="hidden sm:inline" style={{ color:'rgba(56,189,248,0.25)' }}>·</span>
                <span className="hidden sm:inline">? for shortcuts</span>
                <span className="hidden sm:inline" style={{ color:'rgba(56,189,248,0.25)' }}>·</span>
                <span style={{ color:'rgba(56,189,248,0.4)' }}>VOBL · IMD 43295</span>
              </div>
              <button
                onClick={copyForecastSummary}
                className="flex items-center gap-1.5 px-3 py-1 rounded-lg text-[10px] font-bold transition-all"
                style={copyFeedback ? {
                  background:'rgba(76,175,80,0.15)',
                  border:'1px solid rgba(76,175,80,0.4)',
                  color:'#4caf50',
                  textShadow:'0 0 8px rgba(76,175,80,0.5)',
                } : {
                  background:'rgba(56,189,248,0.06)',
                  border:'1px solid rgba(56,189,248,0.15)',
                  color:'rgba(56,189,248,0.6)',
                }}
              >
                {copyFeedback ? '✓ COPIED' : '⎘ COPY FORECAST'}
              </button>
            </div>

            {/* ── KEYBOARD SHORTCUTS OVERLAY ── */}
            {showKbHint && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" onClick={dismissKbHint}>
                <div className="atc-card rounded-2xl p-6 font-mono text-xs max-w-sm w-full mx-4 border border-cyan-500/30" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-sm font-bold text-white tracking-wider">KEYBOARD SHORTCUTS</h3>
                    <button onClick={dismissKbHint} className="text-[#607d8b] hover:text-white text-lg leading-none">✕</button>
                  </div>
                  <div className="space-y-2 mb-4">
                    {NAV_TAB_LIST.map((tab, i) => (
                      <div key={tab} className="flex items-center justify-between">
                        <span className="text-[#90a4ae]">{tab}</span>
                        <kbd className="px-2 py-1 rounded bg-[#172338] text-cyan-300 border border-[#263d55] font-bold">{i + 1}</kbd>
                      </div>

    // ── 1. MULTI-DAY OUTLOOK PAGE ─────────────────────────────────────────────
    function MultidayPage({ liveData }) {
      const [multiday, setMultiday] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [fetchedAt, setFetchedAt] = React.useState(null);
      React.useEffect(() => {
        fetch('./data/gfs_multiday_43295.json', { cache: 'no-cache' })
          .then(r => r.json())
          .then(d => {
            setMultiday(d);
            setFetchedAt(new Date().toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit'}));
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      // gfs_fetcher writes a plain list; support legacy dict format too
      const outlook = Array.isArray(multiday) ? multiday : (multiday?.outlook || []);

      // Derive approximate thunderstorm probability from GFS stability indices
      // Weights: CAPE 35%, K-Index 25%, LI 20%, Totals-Totals 20%
      function deriveProbability(day) {
        const cape = day.CAPE || 0;
        const k    = day.K_INDEX || 30;
        const li   = day.LIFTED_INDEX || 0;
        const tt   = day.TOTALS_TOTALS || 44;
        const pw   = day.PRECIP_WATER || 20;
        const capeScore = Math.min(cape / 2500, 1);
        const kScore    = Math.min(Math.max((k - 20) / 20, 0), 1);
        const liScore   = Math.min(Math.max((-li) / 6, 0), 1);
        const ttScore   = Math.min(Math.max((tt - 44) / 12, 0), 1);
        const pwScore   = Math.min(Math.max((pw - 20) / 40, 0), 1);
        return 0.35*capeScore + 0.25*kScore + 0.20*liScore + 0.12*ttScore + 0.08*pwScore;
      }

      const riskColor = (p) => p >= 0.55 ? '#ef5350' : p >= 0.35 ? '#ff9800' : p >= 0.15 ? '#ffc107' : '#4caf50';
      const riskLabel = (p) => p >= 0.55 ? 'HIGH' : p >= 0.35 ? 'MODERATE' : p >= 0.15 ? 'LOW' : 'MINIMAL';

      return (
        <div className="p-4 lg:p-6 space-y-5">
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold text-[#38bdf8] tracking-widest mb-1">EXTENDED OUTLOOK</div>
            <div className="text-xl font-bold text-white mb-1">Multi-Day Thunderstorm Outlook — VOBL</div>
            <div className="text-[11px] text-[#607d8b] font-mono">
              GFS f024/f048 · CAPE / K-Index / LI / Totals-Totals · Fetched: {fetchedAt || '—'} IST
            </div>
          </div>
          {loading && <div className="text-center text-[#607d8b] font-mono text-sm py-12">Loading multi-day outlook…</div>}
          {!loading && outlook.length === 0 && (
            <div className="atc-card rounded-2xl p-8 text-center">
              <div className="text-4xl mb-3">📡</div>
              <div className="text-[#607d8b] font-mono text-sm">Multi-day GFS data not yet available. Will populate on next pipeline run (5× daily).</div>
            </div>
          )}
          {outlook.map((day, i) => {
            const prob = deriveProbability(day);
            const cape = day.CAPE || 0;
            const k    = day.K_INDEX || 0;
            const li   = day.LIFTED_INDEX || 0;
            const tt   = day.TOTALS_TOTALS || 0;
            const pw   = day.PRECIP_WATER || 0;
            return (
              <div key={i} className="atc-card rounded-2xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <div className="text-[10px] font-bold tracking-widest" style={{color:'#607d8b'}}>GFS f0{day.gfs_fhour || (i+1)*24}0</div>
                    <div className="text-lg font-bold text-white">{day.day_label || `Day +${i+1}`}</div>
                    <div className="text-[12px] font-mono text-[#607d8b]">{day.date || '—'}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-3xl font-bold font-mono" style={{color: riskColor(prob)}}>
                      {Math.round(prob * 100)}%
                    </div>
                    <div className="text-[10px] font-bold tracking-widest" style={{color: riskColor(prob)}}>
                      {riskLabel(prob)} RISK
                    </div>
                  </div>
                </div>

                {/* Stability indices */}
                <div className="grid grid-cols-2 gap-2 mb-3">
                  {[
                    {label:'CAPE', val:`${Math.round(cape)} J/kg`, warn: cape > 1500},
                    {label:'K-Index', val: k.toFixed(1), warn: k > 35},
                    {label:'Lifted Index', val: li.toFixed(1), warn: li < -3},
                    {label:'Totals-Totals', val: tt.toFixed(1), warn: tt > 50},
                    {label:'Precip Water', val:`${pw.toFixed(1)} mm`, warn: pw > 50},
                    {label:'GFS Cycle', val: `f${String(day.gfs_fhour||0).padStart(3,'0')}`, warn: false},
                  ].map(({label, val, warn}) => (
                    <div key={label} className="rounded-xl p-2 flex items-center justify-between"
                      style={{background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)'}}>
                      <span className="text-[10px] font-mono text-[#607d8b]">{label}</span>
                      <span className="text-[11px] font-bold font-mono" style={{color: warn ? '#ff9800' : '#eceff1'}}>{val}</span>
                    </div>
                  ))}
                </div>

                {/* Probability bar */}
                <div className="mt-2">
                  <div className="flex justify-between text-[9px] font-mono text-[#607d8b] mb-1">
                    <span>DERIVED THUNDERSTORM PROBABILITY</span>
                    <span style={{color: riskColor(prob)}}>{Math.round(prob*100)}%</span>
                  </div>
                  <div className="w-full rounded-full" style={{height:'5px', background:'rgba(255,255,255,0.07)'}}>
                    <div className="rounded-full" style={{
                      height:'5px', width:`${Math.round(prob*100)}%`,
                      background: riskColor(prob), transition:'width 1s ease'
                    }}></div>
                  </div>
                  <div className="text-[8px] font-mono text-[#607d8b] mt-1">
                    Based on GFS stability indices · Not slot-level model output
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function AlertsPage({ liveData }) {
      // ── Live alert status ──────────────────────────────────────────────────
      const alertActive = liveData?.alert_active ?? false;
      const peakProb    = liveData?.peak_probability ?? 0;
      const peakSlot    = liveData?.peak_slot;
      const slots       = liveData?.slots || [];
      const maxProb     = Math.max(peakProb, ...slots.map(s => s.ts_probability || 0));
      const isAlert     = alertActive || maxProb >= 0.35;

      // ── Browser push ───────────────────────────────────────────────────────
      const [notifStatus, setNotifStatus] = React.useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
      );
      const [pushThreshold, setPushThreshold] = React.useState(35);

      const enableNotifications = async () => {
        if (typeof Notification === 'undefined') return;
        const perm = await Notification.requestPermission();
        setNotifStatus(perm);
        if (perm === 'granted') {
          new Notification('⚡ CSIR TS Alert — Subscribed', {
            body: `You'll be notified when thunderstorm probability exceeds ${pushThreshold}% at VOBL.`,
            icon: '/manifest.json'
          });
        }
      };

      // ── Self-service subscribe form ────────────────────────────────────────
      const [form, setForm] = React.useState({
        name: '', email: '', phone: '', whatsapp_apikey: '', threshold: 30, daily_digest: true
      });
      const [subState, setSubState] = React.useState('idle'); // idle | loading | success | error
      const [subMsg,   setSubMsg]   = React.useState('');

      const handleFormChange = (k, v) => setForm(f => ({...f, [k]: v}));

      const handleSubscribe = async () => {
        if (!form.email && !form.phone) {
          setSubMsg('Please enter at least an email or phone number.');
          setSubState('error');
          return;
        }
        if (!WORKER_URL) {
          setSubMsg('Alert backend not yet configured. Please ask the dashboard admin to deploy the Cloudflare Worker.');
          setSubState('error');
          return;
        }
        setSubState('loading');
        setSubMsg('');
        try {
          const res = await fetch(`${WORKER_URL}/subscribe`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({...form, threshold: Number(form.threshold)})
          });
          const data = await res.json();
          if (data.ok) {
            setSubState('success');
            setSubMsg(data.message || 'Subscribed! You will receive alerts and daily digests.');
          } else {
            setSubState('error');
            setSubMsg(data.error || 'Subscription failed. Please try again.');
          }
        } catch (e) {
          setSubState('error');
          setSubMsg('Network error. Please check your connection and try again.');
        }
      };

      return (
        <div className="p-4 lg:p-6 space-y-5">
          {/* Header */}
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold text-[#38bdf8] tracking-widest mb-1">ALERT SYSTEM</div>
            <div className="text-xl font-bold text-white mb-1">Thunderstorm Alerts — VOBL/43295</div>
            <div className="text-[11px] text-[#607d8b] font-mono">
              Subscribe for real-time alerts and daily digests. Anyone can subscribe — no login required. Unsubscribe anytime from any email.
            </div>
          </div>

          {/* Current status */}
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-3">CURRENT ALERT STATUS</div>
            <div className="flex items-center gap-3 p-4 rounded-xl" style={{
              background: isAlert ? 'rgba(239,83,80,0.10)' : 'rgba(76,175,80,0.08)',
              border: `1px solid ${isAlert ? 'rgba(239,83,80,0.35)' : 'rgba(76,175,80,0.2)'}`
            }}>
              <div className="text-3xl">{isAlert ? '⚡' : '✅'}</div>
              <div>
                <div className="font-bold text-white text-sm">
                  {isAlert
                    ? `ALERT ACTIVE — ${Math.round(maxProb*100)}% Peak Probability`
                    : maxProb > 0
                    ? `Monitoring — ${Math.round(maxProb*100)}% Peak Probability`
                    : 'No Active Alert — Conditions Clear'}
                </div>
                <div className="text-[11px] font-mono mt-0.5" style={{color: isAlert ? '#ef9a9a' : '#607d8b'}}>
                  {peakSlot ? `Peak slot: ${peakSlot}` : 'All slots below threshold'} · Updated: {liveData?.generated_at_ist || '—'}
                </div>
                {slots.length > 0 && (
                  <div className="text-[10px] font-mono text-[#607d8b] mt-1">
                    {slots.map(s => `${s.slot_label||s.slot_id}: ${Math.round((s.ts_probability||0)*100)}%`).join(' · ')}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Self-service subscribe */}
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-1">EMAIL &amp; WHATSAPP ALERTS</div>
            <div className="text-[11px] text-[#607d8b] font-mono mb-4">
              Enter your details below. Alerts are sent by the pipeline (5× daily). You can unsubscribe at any time from the link in any email.
            </div>

            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <div className="text-[9px] font-bold tracking-widest text-[#607d8b] mb-1">YOUR NAME</div>
                  <input type="text" placeholder="Dr. Geeta Agnihotri" value={form.name}
                    onChange={e => handleFormChange('name', e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 text-sm font-mono text-white outline-none"
                    style={{background:'rgba(255,255,255,0.05)', border:'1px solid rgba(56,189,248,0.2)'}} />
                </div>
                <div>
                  <div className="text-[9px] font-bold tracking-widest text-[#607d8b] mb-1">ALERT THRESHOLD</div>
                  <div className="flex items-center gap-2 h-10">
                    <input type="range" min="10" max="80" value={form.threshold}
                      onChange={e => handleFormChange('threshold', +e.target.value)}
                      className="flex-1" style={{accentColor:'#38bdf8'}} />
                    <span className="text-sm font-bold font-mono text-[#38bdf8] w-10 text-right">{form.threshold}%</span>
                  </div>
                </div>
              </div>

              <div>
                <div className="text-[9px] font-bold tracking-widest text-[#607d8b] mb-1">EMAIL ADDRESS</div>
                <input type="email" placeholder="your@email.com" value={form.email}
                  onChange={e => handleFormChange('email', e.target.value)}
                  className="w-full rounded-xl px-3 py-2.5 text-sm font-mono text-white outline-none"
                  style={{background:'rgba(255,255,255,0.05)', border:'1px solid rgba(56,189,248,0.2)'}} />
              </div>

              <div>
                <div className="text-[9px] font-bold tracking-widest text-[#607d8b] mb-1">
                  WHATSAPP NUMBER <span className="font-normal text-[#455a64] normal-case tracking-normal">(optional · +91XXXXXXXXXX)</span>
                </div>
                <input type="tel" placeholder="+91 98765 43210" value={form.phone}
                  onChange={e => handleFormChange('phone', e.target.value)}
                  className="w-full rounded-xl px-3 py-2.5 text-sm font-mono text-white outline-none"
                  style={{background:'rgba(255,255,255,0.05)', border:'1px solid rgba(56,189,248,0.2)'}} />
              </div>

              {form.phone && (
                <div>
                  <div className="text-[9px] font-bold tracking-widest text-[#607d8b] mb-1">
                    CALLMEBOT API KEY <span className="font-normal text-[#455a64] normal-case tracking-normal">(WhatsApp · get free at callmebot.com)</span>
                  </div>
                  <input type="text" placeholder="Your CallMeBot API key" value={form.whatsapp_apikey}
                    onChange={e => handleFormChange('whatsapp_apikey', e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 text-sm font-mono text-white outline-none"
                    style={{background:'rgba(255,255,255,0.05)', border:'1px solid rgba(56,189,248,0.2)'}} />
                </div>
              )}

              <div className="flex items-center gap-3 pt-1">
                <button
                  onClick={() => handleFormChange('daily_digest', !form.daily_digest)}
                  className="flex items-center gap-2 text-[11px] font-mono cursor-pointer select-none"
                  style={{color: form.daily_digest ? '#38bdf8' : '#607d8b'}}
                >
                  <div className="w-4 h-4 rounded flex items-center justify-center"
                    style={{background: form.daily_digest ? 'rgba(56,189,248,0.3)' : 'rgba(255,255,255,0.06)',
                            border: `1px solid ${form.daily_digest ? 'rgba(56,189,248,0.6)' : 'rgba(255,255,255,0.1)'}`}}>
                    {form.daily_digest && <span style={{fontSize:'9px'}}>✓</span>}
                  </div>
                  Send daily morning digest (08:30 IST)
                </button>
              </div>

              {subMsg && (
                <div className="rounded-xl p-3 text-[11px] font-mono" style={{
                  background: subState==='success' ? 'rgba(76,175,80,0.10)' : 'rgba(239,83,80,0.10)',
                  border: `1px solid ${subState==='success' ? 'rgba(76,175,80,0.3)' : 'rgba(239,83,80,0.3)'}`,
                  color: subState==='success' ? '#81c784' : '#ef9a9a'
                }}>{subMsg}</div>
              )}

              <button onClick={handleSubscribe} disabled={subState==='loading'}
                className="w-full py-3 rounded-xl font-bold text-sm transition-all"
                style={{
                  background: subState==='success' ? 'rgba(76,175,80,0.15)' : 'rgba(56,189,248,0.15)',
                  border: `1px solid ${subState==='success' ? 'rgba(76,175,80,0.4)' : 'rgba(56,189,248,0.4)'}`,
                  color: subState==='success' ? '#4caf50' : '#38bdf8',
                  opacity: subState==='loading' ? 0.6 : 1
                }}>
                {subState==='loading' ? '⏳ Subscribing…' : subState==='success' ? '✅ Subscribed!' : '🔔 Subscribe to Alerts'}
              </button>

              <div className="text-[9px] font-mono text-[#455a64] text-center">
                Every alert email includes a one-click unsubscribe link. No account needed. Free forever.
              </div>
            </div>
          </div>

          {/* Browser push */}
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-3">BROWSER PUSH (THIS DEVICE ONLY)</div>
            <div className="flex items-center gap-3 mb-3">
              <input type="range" min="10" max="80" value={pushThreshold}
                onChange={e => setPushThreshold(+e.target.value)}
                className="flex-1" style={{accentColor:'#38bdf8'}} />
              <span className="text-lg font-bold font-mono text-[#38bdf8] w-14 text-right">{pushThreshold}%</span>
            </div>
            <button onClick={enableNotifications} disabled={notifStatus==='denied'}
              className="w-full py-3 rounded-xl font-bold text-sm"
              style={{
                background: notifStatus==='granted' ? 'rgba(76,175,80,0.12)' : notifStatus==='denied' ? 'rgba(255,0,0,0.07)' : 'rgba(56,189,248,0.10)',
                border: `1px solid ${notifStatus==='granted' ? 'rgba(76,175,80,0.35)' : notifStatus==='denied' ? 'rgba(255,0,0,0.25)' : 'rgba(56,189,248,0.3)'}`,
                color: notifStatus==='granted' ? '#4caf50' : notifStatus==='denied' ? '#ef5350' : '#38bdf8'
              }}>
              {notifStatus==='granted' ? '✅ Push Enabled (this browser)' : notifStatus==='denied' ? '🚫 Blocked — allow in browser settings' : '🔔 Enable Push (this browser only)'}
            </button>
            <div className="text-[9px] font-mono text-[#455a64] mt-2">
              Push alerts fire in-browser only. For persistent alerts across devices, use Email or WhatsApp above.
            </div>
          </div>

          {/* ATC warning text */}
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-3">ATC WARNING TEXT GENERATOR</div>
            <div className="rounded-xl p-4 font-mono text-[11px] text-[#cfd8dc] leading-relaxed" style={{background:'rgba(0,0,0,0.4)', border:'1px solid rgba(255,255,255,0.05)'}}>
              <div className="text-[#38bdf8] mb-2">SIGMET/AIRMET DRAFT — {new Date().toISOString().slice(0,10)}</div>
              <div>VOBL ATIS THUNDERSTORM ADVISORY</div>
              <div>VALID: {liveData?.generated_at_ist || '—'}</div>
              <div className="mt-2">CAPE: {liveData?.gfs_cape || liveData?.cape_jkg || '—'} J/KG. STABILITY: {liveData?.instability_level || 'STABLE'}.</div>
              <div>THUNDERSTORM PROBABILITY: {((liveData?.peak_probability||0)*100).toFixed(0)}%.</div>
              <div>FLIGHT CATEGORY: {liveData?.flight_category || 'VFR'}.</div>
              <div className="mt-2 text-[#ffc107]">
                {(liveData?.peak_probability||0) < 0.15
                  ? 'NO SIGNIFICANT CONVECTION EXPECTED. NORMAL OPERATIONS.'
                  : (liveData?.peak_probability||0) < 0.35
                  ? 'LOW THUNDERSTORM PROBABILITY. MONITOR CONDITIONS.'
                  : 'ELEVATED THUNDERSTORM RISK. ISSUE SIGMET. PILOT DISCRETION ADVISED.'}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── 5. WHAT-IF SIMULATOR ──────────────────────────────────────────────────
    function WhatIfPage({ liveData }) {
      const [cape, setCape] = React.useState(Math.round(liveData?.gfs_cape || liveData?.cape_jkg || 50));
      const [kIdx, setKIdx] = React.useState(Math.round(liveData?.k_index || liveData?.k_idx || 30));
      const [li, setLi] = React.useState(+(liveData?.lifted_index || 0).toFixed(1));
      const [shear, setShear] = React.useState(15);
      const [pw, setPw] = React.useState(45);

      // Approximate probability from convective indices (calibrated to model behaviour)
      const computeProb = () => {
        let score = 0;
        score += Math.min(cape / 3000, 1) * 0.35;
        score += Math.min(Math.max(kIdx - 20, 0) / 20, 1) * 0.25;
        score += Math.min(Math.max(-li / 4, 0), 1) * 0.20;
        score += Math.min(shear / 30, 1) * 0.12;
        score += Math.min(Math.max(pw - 30, 0) / 30, 1) * 0.08;
        return Math.min(Math.max(score, 0.0), 0.95);
      };
      const prob = computeProb();
      const riskColor = prob >= 0.6 ? '#ef5350' : prob >= 0.35 ? '#ff9800' : prob >= 0.15 ? '#ffc107' : '#4caf50';
      const riskLabel = prob >= 0.6 ? 'HIGH RISK' : prob >= 0.35 ? 'MODERATE' : prob >= 0.15 ? 'LOW RISK' : 'MINIMAL';

      const Slider = ({label, unit, value, min, max, step=1, setter, note}) => (
        <div className="mb-4">
          <div className="flex justify-between items-baseline mb-1">
            <span className="text-[10px] font-bold tracking-widest text-[#607d8b]">{label}</span>
            <span className="text-sm font-bold font-mono text-white">{value} <span className="text-[10px] text-[#607d8b]">{unit}</span></span>
          </div>
          <input type="range" min={min} max={max} step={step} value={value} onChange={e=>setter(+e.target.value)}
            className="w-full" style={{accentColor:'#38bdf8'}} />
          {note && <div className="text-[9px] text-[#607d8b] font-mono mt-0.5">{note}</div>}
        </div>
      );

      return (
        <div className="p-4 lg:p-6 space-y-5">
          <div className="atc-card rounded-2xl p-5">
            <div className="text-[10px] font-bold text-[#38bdf8] tracking-widest mb-1">INTERACTIVE TOOL</div>
            <div className="text-xl font-bold text-white mb-1">What-If Thunderstorm Simulator</div>
            <div className="text-[11px] text-[#607d8b] font-mono">Adjust convective indices to explore how the model responds. Sliders initialized to current GFS values.</div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className="atc-card rounded-2xl p-5">
              <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-4">INPUT PARAMETERS</div>
              <Slider label="CAPE" unit="J/kg" value={cape} min={0} max={4000} step={10} setter={setCape} note="Convective Available Potential Energy — primary driver" />
              <Slider label="K-INDEX" unit="" value={kIdx} min={10} max={50} setter={setKIdx} note="Moisture + instability composite — threshold >35 = risk" />
              <Slider label="LIFTED INDEX" unit="" value={li} min={-8} max={4} step={0.5} setter={setLi} note="Negative = unstable; -4 or less = severe convection risk" />
              <Slider label="WIND SHEAR (850–500 hPa)" unit="kt" value={shear} min={0} max={60} setter={setShear} note="Vertical wind shear — organizes and intensifies storms" />
              <Slider label="PRECIPITABLE WATER" unit="mm" value={pw} min={10} max={80} setter={setPw} note="Total column water vapour — fuels precipitation" />
            </div>

            <div className="space-y-4">
              <div className="atc-card rounded-2xl p-5 text-center">
                <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-3">SIMULATED TS PROBABILITY</div>
                <div className="text-7xl font-bold font-mono mb-2" style={{color: riskColor}}>
                  {(prob*100).toFixed(0)}%
                </div>
                <div className="text-lg font-bold tracking-widest" style={{color: riskColor}}>{riskLabel}</div>
                <div className="w-full rounded-full mt-4" style={{height:'6px', background:'rgba(255,255,255,0.08)'}}>
                  <div className="rounded-full transition-all duration-500" style={{height:'6px', width:`${prob*100}%`, background: riskColor}}></div>
                </div>
              </div>

              <div className="atc-card rounded-2xl p-5">
                <div className="text-[10px] font-bold tracking-widest text-[#607d8b] mb-3">PHYSICAL INTERPRETATION</div>
                <div className="space-y-2 text-[11px] font-mono text-[#607d8b]">
                  <div className="flex gap-2">
                    <span style={{color: cape>1000?'#ef5350':cape>500?'#ffc107':'#4caf50'}}>●</span>
                    <span>CAPE {cape>1500?'strongly':cape>500?'moderately':'marginally'} destabilizing ({cape} J/kg)</span>
                  </div>
                  <div className="flex gap-2">
                    <span style={{color: kIdx>40?'#ef5350':kIdx>30?'#ffc107':'#4caf50'}}>●</span>
                    <span>K-Index {kIdx>35?'high — moisture sufficient':kIdx>25?'marginal':'insufficient'} ({kIdx})</span>
                  </div>
                  <div className="flex gap-2">
                    <span style={{color: li<-4?'#ef5350':li<0?'#ffc107':'#4caf50'}}>●</span>
                    <span>LI {li<0?'unstable':'stable'} ({li > 0 ? '+' : ''}{li})</span>
                  </div>
                  <div className="flex gap-2">
                    <span style={{color: shear>25?'#38bdf8':'#607d8b'}}>●</span>
                    <span>Wind shear {shear>25?'favorable for organized convection':'weak'} ({shear} kt)</span>
                  </div>
                </div>
              </div>

              <div className="atc-card rounded-2xl p-4">
                <div className="text-[9px] font-mono text-[#607d8b]">
                  ⚠ This simulator uses a simplified physical parameterization for educational exploration. Operational forecasts use the full XGBoost v6 ensemble with 47 features. Model weights: CAPE 35%, K-Index 25%, LI 20%, Shear 12%, PW 8%.
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // END NEW FEATURE PAGES
    // ═══════════════════════════════════════════════════════════════════════════

    ReactDOM.render(<App />, document.getElementById('root'));

    // ── Service Worker Registration ───────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('[CSIR SW] Registered:', reg.scope);
          // Listen for forecast updates from SW
          navigator.serviceWorker.addEventListener('message', e => {
            if (e.data?.type === 'FORECAST_UPDATED') {
              console.log('[CSIR SW] Forecast updated in background');
            }
          });
        }).catch(err => console.warn('[CSIR SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
