<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRIFT Command Centre</title>
<meta name="description" content="Pan-India severe-weather command centre: live NWP guidance and model outputs with explicit provenance, plus a clearly marked scenario simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M6 20c4-8 8-8 10-3s6 4 10-5' stroke='%2338bdf8' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="assets/vendor/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#16213a;--line:#24324f;--text:#e6edf7;--mute:#93a4c3;--accent:#38bdf8;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sim:#f59e0b;--r:10px;--gap:12px}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef2f8;--panel:#fff;--panel2:#f3f6fb;--line:#d5deec;--text:#0f1b33;--mute:#51627f;--accent:#0369a1;--ok:#047857;--warn:#a16207;--bad:#b91c1c;--sim:#b45309}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:var(--gap);padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.04em}.brand small{display:block;font-weight:400;color:var(--mute);letter-spacing:0;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);color:#04121f}
.seg button.sim[aria-pressed=true]{background:var(--sim);color:#1b1100}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.FRESH i,.chip.AVAILABLE i{background:var(--ok)}.chip.STALE i,.chip.PARTIAL i,.chip.AVAILABLE_DAILY_OUTLOOK_ONLY i{background:var(--warn)}.chip.UNAVAILABLE i{background:var(--bad)}
#banner{padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line)}
#banner.live{background:var(--panel2);color:var(--mute)}
#banner.sim{background:repeating-linear-gradient(45deg,#3a2a05,#3a2a05 14px,#2b2004 14px,#2b2004 28px);color:#ffd48a;font-weight:600}
main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:var(--gap);padding:var(--gap);align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h2{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
aside,section.right{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-weight:600;text-align:left}
.tabs button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button small{display:block;color:var(--mute);font-weight:400;font-size:11px}
label{display:block;font-size:12px;color:var(--mute);margin-top:8px}
select,input[type=range]{width:100%}select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px}
.center{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
#mapwrap{position:relative;flex:none;height:clamp(420px,calc(100vh - 290px),820px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
#map{position:absolute;inset:0}
#maplabel{position:absolute;left:10px;top:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 60px)}
#legend{position:absolute;left:10px;bottom:10px;z-index:2;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;max-width:260px}
#legend details summary{cursor:pointer;color:var(--accent);font-size:11px;margin-top:4px}#legend .bar{height:8px;border-radius:4px;margin:4px 0}
#overlay{position:absolute;inset:0;z-index:1;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(8,12,22,.72);font-weight:600;pointer-events:none}
.sim-mark{position:absolute;right:10px;top:10px;z-index:2;background:var(--sim);color:#1b1100;font-weight:800;padding:4px 10px;border-radius:6px;letter-spacing:.08em;display:none}
#timeline{padding:12px}
.track{position:relative;height:34px;margin:8px 4px 4px;background:var(--panel2);border-radius:6px;border:1px solid var(--line)}
.band{position:absolute;top:0;bottom:0;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(56,189,248,.18),rgba(56,189,248,.18) 6px,rgba(56,189,248,.07) 6px,rgba(56,189,248,.07) 12px);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.band span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);font-weight:700}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);padding:0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{text-decoration:none;color:var(--text);display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#04121f;border-color:transparent}.btn.simb{background:var(--sim);color:#1b1100;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mute{color:var(--mute)}.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500;width:46%}
.na{color:var(--bad);font-weight:600}
.pane{display:none}.pane.on{display:block}
.rtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.rtabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:12px;font-weight:600}
.rtabs button[aria-pressed=true]{background:var(--accent);color:#04121f}
.warn{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.warn.l3{border-left-color:var(--bad)}.warn.l2{border-left-color:var(--sim)}.warn.l1{border-left-color:var(--warn)}
.warn ul{margin:6px 0 0 18px;padding:0}
.bar2{height:6px;border-radius:3px;background:var(--panel2);margin-top:2px;position:relative}.bar2 b{position:absolute;top:0;bottom:0;border-radius:3px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--panel2);border-radius:8px;padding:8px;max-height:180px;overflow:auto}
.log div{padding:2px 0}.log .s{color:var(--sim)}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:var(--panel2)}
.seg2{display:flex;gap:6px}.seg2 button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;font-weight:700}
.seg2 button small{display:block;font-weight:400;color:var(--mute);font-size:11px}.seg2 button[aria-pressed=true],.btn[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.STATIC i,.chip.LOADING i{background:var(--accent)}
.ev{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:6px 0}
.mark{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--warn)}.mark.l2{background:var(--sim)}.mark.l3{background:var(--bad)}
.cursor{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px #fff}
.btn small.mute{font-weight:400}
#tour{position:fixed;left:16px;bottom:16px;z-index:20;width:min(380px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.5);border-color:var(--accent)}
#tour h3{margin:6px 0}.btn.primary{background:var(--accent);color:#04121f;border-color:transparent}
@media (max-width:760px){#tour{left:8px;right:8px;bottom:8px;width:auto;max-height:46vh;overflow:auto}}
#searchwrap{position:relative;flex:1;min-width:180px;max-width:420px}#q{width:100%;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
#sug{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:50vh;overflow:auto}
#sug li{padding:7px 10px;border-radius:6px;cursor:pointer}#sug li:hover,#sug li[aria-selected=true]{background:var(--panel2)}
.hours{display:flex;gap:6px;flex-wrap:wrap}.hr{flex:1;min-width:58px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;text-align:center;position:relative}
.hr small{display:block;color:var(--mute);font-size:10px;line-height:1.2}.hr i{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.hr.PAST_VALID_TIME i{background:var(--warn)}.hr.STALE i,.hr.INVALID_PROVENANCE i,.hr.UNAVAILABLE i{background:var(--bad)}.hr[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.spark{width:100%;height:34px;display:block;margin:2px 0 4px;background:var(--panel2);border-radius:6px}
details.hz{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}details.hz summary{cursor:pointer}
.tscroll{overflow-x:auto}table.cmp td,table.cmp th{min-width:84px}table.prov th{width:34%}
.chip.AVAILABLE_EVALUATED i{background:var(--ok)}
footer{padding:8px 16px;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
.lvl0{color:var(--mute)}.lvl1{color:var(--warn)}.lvl2{color:var(--sim)}.lvl3{color:var(--bad)}
@media (max-width:1100px){main{grid-template-columns:260px minmax(0,1fr)}section.right{grid-column:1/-1}}
@media (max-width:760px){#legend{max-width:62%;font-size:10px;padding:5px 7px;bottom:28px}#legend .mute{display:none}main{grid-template-columns:1fr;padding:8px}.center{order:-1}section.right{order:0}aside{order:1}#mapwrap{height:58vh}header{padding:8px 10px}.seg button{padding:6px 10px}.brand small{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">DRIFT<small>Pan-India severe-weather command centre</small></div>
  <div class="seg" role="group" aria-label="Operating mode">
    <button id="m-live" aria-pressed="true">LIVE</button>
    <button id="m-sim" class="sim" aria-pressed="false">SIMULATION</button>
  </div>
  <div id="searchwrap"><input id="q" type="search" placeholder="Search city, district or state…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="sug" aria-label="Search location"><ul id="sug" role="listbox"></ul></div>
  <span class="spacer"></span>
  <button class="btn primary" id="tour-start">Guided tour</button>
  <span id="fresh" class="chip UNAVAILABLE"><i></i><span>loading…</span></span>
  <a class="btn" href="index.html" id="home-link">&larr; Bengaluru nowcast home</a>
</header>
<div id="banner" class="live" role="status"></div>
<main>
  <aside>
    <div class="card"><h2>Hazard pathway</h2><div id="hz" class="tabs" role="group" aria-label="Hazard"></div></div>
    <div class="card" id="controls"></div>
    <div class="card" id="hzinfo"></div>
  </aside>
  <div class="center">
    <div id="mapwrap">
      <div id="map" aria-label="Pan-India hazard map"></div>
      <div id="maplabel"></div><div class="sim-mark" id="simmark">SIMULATION</div>
      <div id="overlay"></div><div id="legend"></div>
    </div>
    <div class="card" id="timeline"></div>
  </div>
  <section class="right">
    <div class="card">
      <div class="rtabs" role="group" aria-label="Panels">
        <button data-p="detail" aria-pressed="true">Location</button><button data-p="hazards" aria-pressed="false">Hazards</button><button data-p="compare" aria-pressed="false">Compare</button>
        <button data-p="alerts" aria-pressed="false">Alerts &amp; actions</button><button data-p="sources" aria-pressed="false">Sources</button><button data-p="eval" aria-pressed="false">Evaluation</button>
      </div>
      <div id="p-detail" class="pane on"></div><div id="p-hazards" class="pane"></div><div id="p-compare" class="pane"></div><div id="p-alerts" class="pane"></div>
      <div id="p-sources" class="pane"></div><div id="p-eval" class="pane"></div>
    </div>
  </section>
</main>
<div id="tour" class="card" role="dialog" aria-label="Guided tour" style="display:none"></div>
<footer>DRIFT outputs are research/advisory model outputs, not IMD/NDMA warnings. For official warnings consult IMD, NDMA and local authorities.</footer>
<script src="assets/vendor/maplibre-gl.js"></script>
<script src="assets/drift_sim.js"></script>
<script src="assets/drift_location.js"></script>
<script src="assets/drift_app.js"></script>
</body>
</html>
