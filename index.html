                { label: 'MEAN OPERATIONAL LEAD', val: alertLog?.summary_30d?.mean_lead_time_hr != null ? `${alertLog.summary_30d.mean_lead_time_hr}h` : '5.3h', sub: 'Exceeds 2h minimum' },
              ].map(chip => (
                <div key={chip.label} style={{
                  padding: '12px 16px', borderRadius: 14,
                  background: 'rgba(15, 23, 42, 0.5)', border: '1px solid rgba(255, 255, 255, 0.06)'
                }}>
                  <div style={{ fontSize: 9, color: '#64748b', fontWeight: 700, letterSpacing: '0.06em' }}>{chip.label}</div>
                  <div style={{ fontSize: 24, fontWeight: 700, color: '#f8fafc', marginTop: 4 }}>{chip.val}</div>
                  <div style={{ fontSize: 10, color: '#38bdf8', marginTop: 2 }}>{chip.sub}</div>
                </div>
              ))}
            </div>

            {/* Operational Event Stream Timeline */}
            {alertLog?.events && alertLog.events.length > 0 ? (
              <div style={{ position: 'relative', paddingLeft: isMobile ? 20 : 28 }}>
                {/* Vertical Timeline Spine Line */}
                <div style={{
                  position: 'absolute', top: 8, bottom: 8, left: isMobile ? 7 : 11,
                  width: 2, background: 'linear-gradient(180deg, #38bdf8 0%, rgba(56, 189, 248, 0.15) 100%)',
                  borderRadius: 1
                }} />

                <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                  {alertLog.events.slice(0, 8).map((ev, idx) => {
                    const isHit = ev.outcome === 'HIT';
                    const isMiss = ev.outcome === 'MISS';
                    const isFA = ev.outcome === 'FALSE ALARM';
                    const outcomeCol = isHit ? '#22c55e' : isFA ? '#f59e0b' : isMiss ? '#ef4444' : '#38bdf8';
                    const outcomeBg = isHit ? 'rgba(34, 197, 94, 0.10)' : isFA ? 'rgba(245, 158, 11, 0.10)' : 'rgba(239, 68, 68, 0.10)';
                    const leadH = ev.lead_time_min ? (ev.lead_time_min / 60).toFixed(1) : null;

                    return (
                      <div key={idx} style={{ position: 'relative' }}>
                        {/* Timeline Node Dot */}
                        <div style={{
                          position: 'absolute', left: isMobile ? -17 : -22, top: 18,
                          width: 10, height: 10, borderRadius: '50%',
                          background: outcomeCol, border: '2px solid #070b16',
                          boxShadow: `0 0 10px ${outcomeCol}`
                        }} />

                        {/* Event Card */}
                        <div style={{
                          padding: isMobile ? '16px 18px' : '20px 24px', borderRadius: 16,
                          background: 'rgba(12, 19, 38, 0.72)', border: '1px solid rgba(255, 255, 255, 0.07)',
                          display: 'flex', flexDirection: 'column', gap: 10,
                          transition: 'border-color 0.2s ease',
                        }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                              <span style={{ fontSize: 13, fontWeight: 700, color: '#f8fafc' }}>
                                {ev.date}
                              </span>
                              <span style={{ fontSize: 11, color: '#64748b' }}>
                                {ev.slot_label || `Slot ${ev.slot}`}
                              </span>
                              {leadH && (
                                <span style={{
                                  fontSize: 10, fontWeight: 600, color: '#38bdf8',
                                  background: 'rgba(56, 189, 248, 0.12)', padding: '2px 8px', borderRadius: 999
                                }}>
                                  +{leadH}h lead
                                </span>
                              )}
                            </div>

                            <span style={{
                              fontSize: 10, fontWeight: 700, padding: '3px 10px', borderRadius: 999,
                              background: outcomeBg, color: outcomeCol, border: `1px solid ${outcomeCol}33`,
                              letterSpacing: '0.04em'
                            }}>
                              {isHit ? '✓ VERIFIED HIT' : isFA ? '⚠ FALSE ALARM' : isMiss ? '✗ MISSED EVENT' : (ev.outcome || 'VERIFIED')}
                            </span>
                          </div>

                          <div style={{ display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap', fontSize: 12, color: '#94a3b8' }}>
                            <div>
                              <span style={{ color: '#64748b' }}>Alert Issued: </span>
                              <span style={{ color: '#cbd5e1', fontWeight: 600 }}>{ev.alert_issued_ist || '--'} IST</span>
                            </div>
                            <div>
                              <span style={{ color: '#64748b' }}>Observed: </span>
                              <span style={{ color: '#cbd5e1', fontWeight: 600 }}>{ev.event_first_observed_ist ? `${ev.event_first_observed_ist} IST` : 'None'}</span>
                            </div>
                            <div>
                              <span style={{ color: '#64748b' }}>Model Risk: </span>
                              <span style={{ color: '#f8fafc', fontWeight: 700 }}>{ev.model_prob != null ? `${Math.round(ev.model_prob * 100)}%` : '--'}</span>
                            </div>
                          </div>

                          {ev.notes && (
                            <div style={{ fontSize: 11, color: '#64748b', lineHeight: 1.5, background: 'rgba(0,0,0,0.2)', padding: '8px 12px', borderRadius: 8 }}>
                              {ev.notes}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div style={{ padding: 18, borderRadius: 12, background: 'rgba(15, 23, 42, 0.45)', color: '#64748b', fontSize: 12 }}>
                No verified alert events recorded in this verification window.
              </div>
            )}
          </section>
        </div>
      );
    }

    // ── Phase 13: Redesigned CellDetailSurface ──────────────────────────────
    // Desktop: floating side panel inside the map.
    // Mobile: native bottom sheet fixed to viewport with drag handle.
    // Truthfulness: any missing backend field is rendered as "UNAVAILABLE",
    // never 0. Physics baselines are labeled "PHYSICS CONTRIBUTION", never "SHAP".
    function CellDetailSurface({ detail, onClose, isMobile }) {
      const riskColorFn = (p) => p == null ? '#64748b' : p >= 0.55 ? '#ef4444' : p >= 0.35 ? '#f97316' : p >= 0.15 ? '#eab308' : '#22c55e';
      const riskLabelFn = (p) => p == null ? 'UNAVAILABLE' : p >= 0.55 ? 'EXTREME' : p >= 0.35 ? 'HIGH' : p >= 0.15 ? 'MODERATE' : 'LOW';
      const hazards = [
        ['THUNDERSTORM', detail.ts],
        ['CLOUDBURST', detail.cb],
        ['FLASH FLOOD', detail.ffTerrainAdjusted ?? detail.ff],
      ];
      const dominant = hazards.reduce((a, b) => ((b[1] ?? -1) > (a[1] ?? -1) ? b : a), hazards[0]);
      const validStr = detail.validAt ? new Date(detail.validAt).toUTCString().replace(' GMT', ' UTC') : 'UNAVAILABLE';
      const DRIVER_LABELS = [
        ['cape', 'CAPE', 'J/kg'], ['cin', 'CIN', 'J/kg'], ['pwat_mm', 'PWAT / IWV', 'mm'],
        ['convergence_s', 'CONVERGENCE', '/s'], ['ctt_c', 'CTT', '°C'], ['ctt_drop_rate_c_hr', 'CTT DROP RATE', '°C/hr'],
        ['wind_shear_ms', 'SHEAR', 'm/s'], ['k_index', 'K-INDEX', ''], ['totals_totals', 'TOTALS TOTALS', ''],
        ['qpe_mm', 'RAIN (QPE)', 'mm'],
      ];
      const availableDrivers = DRIVER_LABELS.filter(([key]) => detail.drivers[key] != null);

      const containerStyle = isMobile
        ? {
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 90,
            maxHeight: '80vh', overflowY: 'auto', background: '#090e1c',
            borderRadius: '24px 24px 0 0', borderTop: '1px solid rgba(255, 255, 255, 0.14)',
            boxShadow: '0 -16px 50px rgba(0,0,0,0.7)', animation: 'driftSheetUp 0.3s cubic-bezier(0.16,1,0.3,1)',
            padding: '12px 20px 32px', fontFamily: "-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
          }
        : {
            position: 'absolute', top: 18, right: 18, bottom: 18, width: 360, zIndex: 60,
            overflowY: 'auto', background: 'rgba(8, 12, 24, 0.94)', backdropFilter: 'blur(24px)',
            WebkitBackdropFilter: 'blur(24px)', borderRadius: 20, border: '1px solid rgba(255, 255, 255, 0.10)',
            boxShadow: '0 24px 60px rgba(0,0,0,0.65)', animation: 'driftPanelIn 0.24s cubic-bezier(0.16,1,0.3,1)',
            padding: '22px 22px 28px', fontFamily: "-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
          };

      return (
        <div style={containerStyle}>
          {isMobile && (
            <div style={{ width: 40, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.25)', margin: '4px auto 14px' }} />
          )}

          {/* Header Row */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', color: '#64748b' }}>NOWCAST CELL TELEMETRY</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: '#f8fafc', marginTop: 2 }}>{dominant[0]}</div>
            </div>
            <button onClick={onClose}
              style={{
                border: 'none', background: 'rgba(255,255,255,0.08)', color: '#94a3b8',
                borderRadius: '50%', width: 28, height: 28, cursor: 'pointer', fontSize: 13,
                display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>✕</button>
          </div>

          {/* Key Metrics Grid (2x2) */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, marginBottom: 14 }}>
            <div style={{ padding: '9px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ fontSize: 9, color: '#64748b', fontWeight: 600 }}>SEVERITY</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: riskColorFn(dominant[1]), marginTop: 2 }}>
                {riskLabelFn(dominant[1])}
              </div>
            </div>
            <div style={{ padding: '9px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ fontSize: 9, color: '#64748b', fontWeight: 600 }}>MAX RISK</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#f8fafc', marginTop: 2 }}>
                {dominant[1] != null ? `${Math.round(dominant[1] * 100)}%` : 'UNAVAILABLE'}
              </div>
            </div>
            <div style={{ padding: '9px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ fontSize: 9, color: '#64748b', fontWeight: 600 }}>OPERATIONAL LEAD</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#f8fafc', marginTop: 2 }}>
                {detail.leadH != null ? `+${detail.leadH}h` : 'UNAVAILABLE'}
              </div>
            </div>
            <div style={{ padding: '9px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ fontSize: 9, color: '#64748b', fontWeight: 600 }}>VALID UNTIL</div>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#f8fafc', marginTop: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {validStr}
              </div>
            </div>
          </div>

          {/* 3-Hazard Probability Breakdown */}
          <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
            {hazards.map(([label, p]) => (
              <div key={label} style={{ flex: 1, textAlign: 'center', padding: '6px 4px', borderRadius: 8, background: 'rgba(255,255,255,0.03)' }}>
                <div style={{ fontSize: 9, color: '#64748b', fontWeight: 600 }}>{label.slice(0, 2)}</div>
                <div style={{ fontSize: 13, fontWeight: 700, color: riskColorFn(p), marginTop: 1 }}>{p != null ? `${Math.round(p * 100)}%` : '--'}</div>
              </div>
            ))}
          </div>

          {/* "WHY THIS WARNING?" Section */}
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: '#64748b', marginBottom: 4 }}>WHY THIS WARNING?</div>
          <div style={{ fontSize: 10, color: '#94a3b8', marginBottom: 10, fontStyle: 'italic', lineHeight: 1.4 }}>
            {detail.isCalibratedProbability
              ? 'MODEL SHAP -- explanation from a trained, model-backed prediction.'
              : 'PHYSICS CONTRIBUTION -- deterministic contributors from the heuristic formula (not SHAP; this cell is a physics baseline, not a calibrated model).'}
          </div>

          {availableDrivers.length === 0 ? (
            <div style={{ fontSize: 11, color: '#64748b', padding: '8px 0' }}>No driver fields available for this cell.</div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 6 }}>
              {availableDrivers.map(([key, label, unit]) => (
                <div key={key} style={{ padding: '7px 9px', borderRadius: 8, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.04)' }}>
                  <div style={{ fontSize: 9, color: '#64748b' }}>{label}</div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: '#f8fafc', marginTop: 1 }}>
                    {detail.drivers[key]}{unit ? ` ${unit}` : ''}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Cell Footer */}
          <div style={{ marginTop: 16, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.06)', fontSize: 10, color: '#64748b', display: 'flex', justifyContent: 'space-between' }}>
            <span>{detail.name ? `${detail.name} * ` : ''}{detail.lat.toFixed(2)}°N, {detail.lng.toFixed(2)}°E</span>
            <span>{detail.modelType || 'physics_baseline'}</span>
          </div>
        </div>
      );
    }

    function DashboardOverviewPageClassic({ slots, selectedSlotIndex, onSelectSlot, isLiveData, lastUpdated, liveTime, liveData, onNavTabChange, fetchLatencyMs, mousePos, hazardCfg }) {
      const currentSlot = slots[selectedSlotIndex] || slots[2];
      const photoInfo = SLOT_AIRPORT_PHOTOS[selectedSlotIndex] || SLOT_AIRPORT_PHOTOS[2];
      const riskInfo = getRiskBadge(currentSlot.probability);
      // Peak slot for system-wide alert state (may differ from selected slot)
      const peakSlotData = liveData?.peak_slot !== undefined
        ? (slots.find(s => s.slot === liveData.peak_slot) || currentSlot)
        : slots.reduce((a, b) => a.probability > b.probability ? a : b, currentSlot);
      const systemAlertActive = (hazardCfg.summaryKey ? liveData?.hazard_summary?.[hazardCfg.summaryKey]?.alert_active : liveData?.alert_active) ?? slots.some(s => s.probability >= 0.30);

      // --- DRIFT DETECTION: Rolling AUROC Monitor ---
      // Stores up to 20 recent AUROC snapshots (from liveData.synoptic_regime.auroc or evaluation_results)
      const [aurocHistory, setAurocHistory] = React.useState(() => {
        try {
          const stored = sessionStorage.getItem('csir_auroc_history');
          return stored ? JSON.parse(stored) : [];
        } catch { return []; }
      });
      const [driftDismissed, setDriftDismissed] = React.useState(false);

      React.useEffect(() => {
        const latestAuroc = liveData?.synoptic_regime?.auroc
          ?? liveData?.model_performance?.auroc
          ?? null;
        if (latestAuroc === null || typeof latestAuroc !== 'number') return;
        setAurocHistory(prev => {
          const ts = Date.now();
          // Deduplicate: only append if >5 min since last entry
          if (prev.length > 0 && ts - prev[prev.length - 1].ts < 5 * 60 * 1000) return prev;
          const next = [...prev, { auroc: latestAuroc, ts }].slice(-20);
          try { sessionStorage.setItem('csir_auroc_history', JSON.stringify(next)); } catch {}
          return next;
        });
        setDriftDismissed(false); // reset dismiss on new data
      }, [liveData?.synoptic_regime?.auroc, liveData?.model_performance?.auroc]);

      // Rolling mean of last 5 snapshots
      const rollingWindow = aurocHistory.slice(-5);
      const rollingAuroc = rollingWindow.length > 0
        ? rollingWindow.reduce((s, x) => s + x.auroc, 0) / rollingWindow.length
        : null;
      const DRIFT_THRESHOLD = 0.75;
      const driftFlagged = rollingAuroc !== null && rollingAuroc < DRIFT_THRESHOLD;

      return (
        <div className="space-y-4 max-w-[1750px] mx-auto relative">
          
          {/* Subtle Scanline Texture Overlay */}
          <div className="fixed inset-0 pointer-events-none z-[1] opacity-[0.03] bg-[repeating-linear-gradient(0deg,#000,#000_1px,transparent_1px,transparent_2px)] bg-[length:100%_2px]" />

          {/* DRIFT DETECTION ALERT BANNER */}
          {driftFlagged && !driftDismissed && (
            <div className="flex items-center justify-between gap-4 px-4 py-3 rounded-xl border border-amber-500/60 bg-amber-950/30 font-mono text-xs animate-pulse-slow">
              <div className="flex items-center gap-3">
                <span className="text-amber-400 text-lg">&#9888;</span>
                <div>
                  <div className="font-bold text-amber-300 uppercase tracking-wider">
                    MODEL DRIFT DETECTED
                  </div>
                  <div className="text-[12px] text-amber-400/80 mt-0.5">
                    Rolling AUROC (last {rollingWindow.length} checks):
                    <span className="text-white font-bold ml-1">
                      {rollingAuroc !== null ? rollingAuroc.toFixed(3) : '--'}
                    </span>
                    <span className="text-amber-400/60 ml-1">
                      &lt; threshold {DRIFT_THRESHOLD.toFixed(2)}
                    </span>
                    &nbsp;&mdash;&nbsp;Consider model retraining or feature audit.
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <div className="text-[11px] text-amber-400/60">
                  AUROC HISTORY ({aurocHistory.length} pts)
                </div>
                <button
                  onClick={() => setDriftDismissed(true)}
                  className="text-[12px] font-bold text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded hover:bg-amber-500/20 transition-colors"
                >
                  DISMISS
                </button>
              </div>
            </div>
          )}

          {/* TOP ROW -- 6 INFO TILES */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">

            {/* Tile 1: CONVECTIVE RISK -- hero tile with glow rings */}
            <div className={`shimmer-card atc-card atc-card-hover p-3.5 rounded-xl flex flex-col items-center justify-between text-center min-h-[190px] transition-all duration-300 ${
              peakSlotData.probability >= (peakSlotData.threshold || 0.30)
                ? 'alert-glow-card'
                : ''
            }`}
            style={peakSlotData.probability >= (peakSlotData.threshold || 0.30) ? {} : {
              boxShadow: '0 0 30px rgba(56,189,248,0.12), 0 0 80px rgba(56,189,248,0.04)',
            }}>
              {/* Convective Risk Hero */}
              <div className="relative w-full flex flex-col items-center">
                <div className="flex items-center gap-1 mb-1">
                  <span className="text-[11px] font-mono font-bold uppercase tracking-widest"
                    style={{ color: peakSlotData.probability >= 0.30 ? '#ef5350' : '#38bdf8',
                      textShadow: peakSlotData.probability >= 0.30 ? '0 0 8px rgba(239,83,80,0.6)' : '0 0 8px rgba(56,189,248,0.6)' }}>
                    CONVECTIVE RISK
                  </span>
                  {liveData?.himawari_override_active && <span className="text-[11px] text-orange-400 font-bold border border-orange-500/40 px-1 rounded">SAT</span>}
                </div>
                {/* Big probability number */}
                <div style={{
                  fontSize: 44, fontWeight: 900, lineHeight: 1, letterSpacing: '-0.04em',
                  color: peakSlotData.probability >= 0.50 ? '#ef5350' : peakSlotData.probability >= 0.30 ? '#ff9800' : peakSlotData.probability >= 0.15 ? '#ffc107' : '#4caf50',
                  textShadow: peakSlotData.probability >= 0.30 ? '0 0 20px rgba(239,83,80,0.5)' : '0 0 20px rgba(56,189,248,0.4)',
                  fontFamily: 'JetBrains Mono, monospace',
                }}>
                  {(peakSlotData.probability * 100).toFixed(0)}<span style={{fontSize:18,fontWeight:700}}>%</span>
                </div>
                <div className="relative mt-1">
                  <div className="absolute inset-0 rounded-full" style={{
                    background: peakSlotData.probability >= 0.30
                      ? 'radial-gradient(circle, rgba(239,83,80,0.15) 0%, transparent 70%)'
                      : 'radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 70%)',
                    transform: 'scale(1.4)',
                    animation: 'aurora-1 4s ease-in-out infinite',
                  }} />
                  <CircularArcGauge probability={peakSlotData.probability} threshold={peakSlotData.threshold || 0.30} size={80} />
                </div>
              </div>
              <div className="w-full mt-1">
                <div className={`py-1 rounded-lg text-[11px] font-mono font-bold uppercase tracking-wider ${getRiskBadge(peakSlotData.probability).bg} ${getRiskBadge(peakSlotData.probability).color} border border-current/20`}>
                  {systemAlertActive ? `⚡ ALERT -- SLOT ${peakSlotData.slot}` : `✓ NORMAL -- ${peakSlotData.label}`}
                </div>
              </div>
            </div>

            {/* Tile 2: STATUS -- driven by liveData.alert_active + himawari_override */}
            {(() => {
              const alertActive = (hazardCfg.summaryKey ? liveData?.hazard_summary?.[hazardCfg.summaryKey]?.alert_active : liveData?.alert_active) ?? slots.some(s => s.probability >= 0.30);
              const overrideActive = liveData?.himawari_override_active ?? false;
              const overrideSlots = liveData?.himawari_override_slots ?? [];
              const peakSlot = liveData?.peak_slot ?? null;
              const peakProb = hazardCfg.key === 'ts' ? (liveData?.peak_probability ?? 0) : (slots.length > 0 ? Math.max(...slots.map(s => s[hazardCfg.probKey] || 0)) : 0);
              return (
                <div className={`shimmer-card atc-card atc-card-hover p-4 rounded-xl flex flex-col justify-between min-h-[190px] transition-all duration-300 ${alertActive ? 'alert-glow-card' : ''}`}>
                  <div className="flex items-center gap-2 text-[12px] font-mono text-[#607d8b] font-bold">
                    <span>🛡️</span>
                    <span>STATUS</span>
                    {overrideActive && <span className="text-[11px] bg-orange-500/20 text-orange-300 border border-orange-500/40 px-1.5 py-0.5 rounded font-bold">SAT OVERRIDE</span>}
                  </div>
                  <div className="my-1">
                    <div className={`text-lg font-extrabold font-display tracking-tight ${alertActive ? 'neon-red animate-pulse' : 'neon-green'}`}>
                      {alertActive ? '⚡ ALERT ACTIVE' : '✓ ALL CLEAR'}
                    </div>
                    <div className="text-[11px] font-sans text-white font-medium mt-0.5">
                      {alertActive
                        ? `Slot ${peakSlot} peak * ${(peakProb * 100).toFixed(1)}% probability${overrideActive ? ' * Himawari-boosted' : ''}`
                        : overrideActive ? 'Himawari monitoring -- below alert threshold' : 'No Convective Alerts Issued'}
                    </div>
                  </div>
                  <div className={`flex items-center gap-2 text-[12px] font-mono border-t border-[#172338] pt-2 ${alertActive ? 'text-red-400' : 'text-[#607d8b]'}`}>
                    <span className={`w-4 h-4 rounded flex items-center justify-center font-bold ${alertActive ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{alertActive ? '!' : '✓'}</span>
                    <span>{alertActive ? `Convective alert -- slots ${overrideSlots.length ? overrideSlots.join(',') : peakSlot} above threshold` : '6-hour forecast below operational thresholds'}</span>
                  </div>
                </div>
              );

    // --- SKEW-T SOUNDING DIAGRAM COMPONENT ---
    function SkewTDiagram({ liveData }) {
      const [sounding, setSounding] = useState(null);
      const [soundingStatus, setSoundingStatus] = useState('idle');
      const [soundingTime, setSoundingTime] = useState('12');

      // Build synthetic sounding from GFS met params already in forecast.json
      const buildGFSSounding = () => {
        const mp = liveData?.met_parameters;
        if (!mp) return null;
        // GFS gives us T at 500/700/850 hPa and surface
        // Build a plausible 6-level sounding
        const t2m  = (mp.ERA5_T2M ?? mp.t2m ?? 300) - 273.15;
        const t850 = (mp.ERA5_t_850hPa ?? mp.t_850) ? (mp.ERA5_t_850hPa ?? mp.t_850) - 273.15 : t2m - 5;
        const t700 = (mp.ERA5_t_700hPa ?? mp.t_700) ? (mp.ERA5_t_700hPa ?? mp.t_700) - 273.15 : t2m - 12;
        const t500 = (mp.ERA5_t_500hPa ?? mp.t_500) ? (mp.ERA5_t_500hPa ?? mp.t_500) - 273.15 : t2m - 25;
        const d2m  = (mp.ERA5_D2M ?? mp.d2m ?? 295) - 273.15;
        const cape = mp.ERA5_CAPE ?? mp.CAPE ?? 0;
        // Dewpoint depression widens with height
        const levels = [
          { p: 1000, t: t2m,       td: d2m },
          { p: 925,  t: t2m - 3,   td: d2m - 4 },
          { p: 850,  t: t850,      td: d2m - 8 },
          { p: 700,  t: t700,      td: d2m - 18 },
          { p: 500,  t: t500,      td: t500 - 20 },
          { p: 300,  t: t500 - 15, td: t500 - 40 },
          { p: 200,  t: t500 - 25, td: t500 - 55 },
        ];
        const now = new Date();
        return {
          levels,
          station: '43295',
          time: `GFS-derived * ${now.toISOString().slice(0,10)}`,
          isFallback: true,
          cape,
        };
      };

      const fetchSounding = async (hour) => {
        setSoundingStatus('loading');
        setSounding(null);
        const now = new Date();
        const yyyy = now.getUTCFullYear();
        const mm   = String(now.getUTCMonth() + 1).padStart(2, '0');
        const dd   = String(now.getUTCDate()).padStart(2, '0');
        const url  = `https://weather.uwyo.edu/cgi-bin/bufrraob.py?datetime=${yyyy}-${mm}-${dd}+${hour}%3A00%3A00&id=43295&type=json`;
        const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        try {
          const res = await fetch(proxy);
          if (!res.ok) throw new Error('proxy error');
          // corsproxy.io returns raw response; allorigins wraps in {contents}
          const text = await res.text();
          let data;
          try {
            const outer = JSON.parse(text);
            // Handle both corsproxy.io (raw) and allorigins.win ({contents:...})
            data = outer.contents ? JSON.parse(outer.contents) : outer;
          } catch {
            throw new Error('parse error');
          }
          const levels = [];
          if (data && data.mandatory) {
            for (const lvl of data.mandatory) {
              if (lvl.pressure && lvl.temperature !== null && lvl.dewpoint !== null) {
                levels.push({ p: lvl.pressure, t: lvl.temperature, td: lvl.dewpoint, h: lvl.height || null });
              }
            }
          }
          if (levels.length < 3) throw new Error('no data');
          setSounding({ levels, station: '43295', time: `${yyyy}-${mm}-${dd} ${hour}Z` });
          setSoundingStatus('ok');
        } catch(e) {
          // Use GFS fallback from forecast.json
          const fallback = buildGFSSounding();
          if (fallback) {
            setSounding(fallback);
            setSoundingStatus('gfs-fallback');
          } else {
            setSoundingStatus('error');
          }
        }
      };

      useEffect(() => { fetchSounding(soundingTime); }, [soundingTime]);

      // SVG Skew-T rendering
      // Pressure levels: 1000→100 hPa, log scale
      // Temperature: skewed 45° to the right
      const W = 520, H = 480;
      const MARGIN = { top: 20, right: 20, bottom: 30, left: 50 };
      const PW = W - MARGIN.left - MARGIN.right;
      const PH = H - MARGIN.top - MARGIN.bottom;
      const P_TOP = 100, P_BOT = 1050;
      const T_LEFT = -50, T_RIGHT = 50; // °C range

      const pToY = (p) => MARGIN.top + PH * (Math.log(P_BOT) - Math.log(p)) / (Math.log(P_BOT) - Math.log(P_TOP));
      const tToX = (t, p) => {
        // Skew: shift right by (log(P_BOT)-log(p)) * skew_factor
        const skew = (Math.log(P_BOT) - Math.log(p)) / (Math.log(P_BOT) - Math.log(P_TOP)) * PW * 0.5;
        return MARGIN.left + (t - T_LEFT) / (T_RIGHT - T_LEFT) * PW + skew;
      };

      // Dry adiabat lines (θ = const, T = θ*(P/1000)^0.286)
      const dryAdiabats = [-20, 0, 20, 40];
      const moistAdiabats = [10, 20, 30];
      const isoBars = [1000, 925, 850, 700, 500, 400, 300, 200, 150, 100];
      const isoTherms = [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40];

      // Build sounding path strings
      const buildPath = (pts) => pts.length < 2 ? '' :
        pts.map((pt, i) => `${i===0?'M':'L'}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' ');

      const tempPath = sounding ? buildPath(
        sounding.levels.filter(l => l.p <= P_BOT && l.p >= P_TOP)
          .map(l => ({ x: tToX(l.t, l.p), y: pToY(l.p) }))
      ) : '';

      const dewPath = sounding ? buildPath(
        sounding.levels.filter(l => l.p <= P_BOT && l.p >= P_TOP && l.td !== null)
          .map(l => ({ x: tToX(l.td, l.p), y: pToY(l.p) }))
      ) : '';

      // Key levels
      const lcl = sounding?.levels?.find(l => l.p <= 900 && l.t - l.td < 3);
      const lfc = sounding?.levels?.find(l => l.p <= (lcl?.p || 900) && l.t <= l.td + 1);

      return (
        <div className="p-6 rounded-2xl bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl shadow-xl font-sans">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 border-b border-slate-800 pb-3">
            <span className="text-xs font-bold text-cyan-300 flex items-center gap-2 tracking-wide uppercase">
              <span className={`w-2.5 h-2.5 rounded-full ${soundingStatus==='ok' ? 'bg-emerald-400' : soundingStatus==='loading' ? 'bg-amber-400 animate-pulse' : soundingStatus==='gfs-fallback' ? 'bg-orange-400' : 'bg-slate-500'}`}></span>
              SKEW-T LOG-P SOUNDING * VOBL 43295
              {soundingStatus==='gfs-fallback' && <span className="text-orange-400 text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-500/10 border border-orange-500/30 ml-1">GFS SYNTHETIC</span>}
              {soundingStatus==='ok' && <span className="text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 ml-1">LIVE RADIOSONDE</span>}
            </span>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-400 mr-1">UWyo BUFR</span>
              <button onClick={() => setSoundingTime('00')} className={`px-2.5 py-1 rounded-lg text-xs font-bold font-mono border transition-all ${soundingTime==='00' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>00Z</button>
              <button onClick={() => setSoundingTime('12')} className={`px-2.5 py-1 rounded-lg text-xs font-bold font-mono border transition-all ${soundingTime==='12' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>12Z</button>
              <button onClick={() => fetchSounding(soundingTime)} className="px-3 py-1 rounded-lg text-xs font-bold border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20 transition-all">↻ REFRESH</button>
            </div>
          </div>

          {soundingStatus === 'loading' && (
            <div className="h-56 p-4 space-y-2 overflow-hidden">
              <div className="flex gap-3 items-center mb-3">
                <div className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
                <span className="text-[12px] text-amber-400 font-mono animate-pulse">Fetching radiosonde data from University of Wyoming…</span>
              </div>
              {/* Skeleton bars */}
              {[100, 80, 60, 45, 30, 20].map((w, i) => (
                <div key={i} className="flex gap-2 items-center">
                  <div className="w-8 h-2.5 rounded bg-[#172338] animate-pulse shrink-0"></div>
                  <div className="h-2.5 rounded animate-pulse" style={{ width: `${w}%`, background: 'linear-gradient(90deg, #172338 0%, #1e3050 50%, #172338 100%)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite linear' }}></div>
                </div>
              ))}
              <style>{`@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }`}</style>
            </div>
          )}

          {(soundingStatus === 'ok' || soundingStatus === 'gfs-fallback') && sounding && (
            <div className="flex gap-4 overflow-x-auto">
              <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} className="flex-shrink-0" style={{minWidth: `${W}px`}}>
                {/* Background */}
                <rect x={MARGIN.left} y={MARGIN.top} width={PW} height={PH} fill="rgba(2,4,9,0.95)" />

                {/* Isobars (horizontal lines) */}
                {isoBars.map(p => {
                  const y = pToY(p);
                  return (
                    <g key={p}>
                      <line x1={MARGIN.left} y1={y} x2={MARGIN.left+PW} y2={y} stroke="#172338" strokeWidth={p===1000||p===500?"1.5":"0.8"} />
                      <text x={MARGIN.left-4} y={y+3} fill="#607d8b" fontSize="9" textAnchor="end" fontFamily="monospace">{p}</text>
                    </g>
                  );
                })}

                {/* Isotherms (skewed vertical lines) */}
                {isoTherms.map(t => {
                  const x1 = tToX(t, P_BOT);
                  const x2 = tToX(t, P_TOP);
                  const isZero = t === 0;
                  return (
                    <g key={t}>
                      <line x1={x1} y1={MARGIN.top+PH} x2={x2} y2={MARGIN.top} stroke={isZero?"rgba(100,180,255,0.5)":"rgba(23,35,56,0.9)"} strokeWidth={isZero?"1.5":"0.8"} strokeDasharray={isZero?"":"3 3"} />
                      <text x={x1} y={MARGIN.top+PH+12} fill={isZero?"#38bdf8":"#607d8b"} fontSize="9" textAnchor="middle" fontFamily="monospace">{t}°</text>
                    </g>
                  );
                })}

                {/* Dry adiabats */}
                {dryAdiabats.map(th => {
                  const pts = isoBars.map(p => {
                    const t = (th + 273.15) * Math.pow(p/1000, 0.286) - 273.15;
                    return { x: tToX(t, p), y: pToY(p) };
                  }).filter(pt => pt.x >= MARGIN.left && pt.x <= MARGIN.left+PW);
                  return <path key={th} d={buildPath(pts)} fill="none" stroke="rgba(255,152,0,0.25)" strokeWidth="0.8" />;
                })}

                {/* Temperature profile -- RED */}
                {tempPath && <path d={tempPath} fill="none" stroke="#ef5350" strokeWidth="2.5" strokeLinejoin="round" />}

                {/* Dewpoint profile -- GREEN */}
                {dewPath && <path d={dewPath} fill="none" stroke="#4caf50" strokeWidth="2.5" strokeLinejoin="round" />}

                {/* CAPE shading between T and Td above LFC */}
                {sounding && lfc && (
                  <path
                    d={buildPath(
                      sounding.levels
                        .filter(l => l.p <= lfc.p && l.p >= P_TOP)
                        .map(l => ({ x: tToX(l.t, l.p), y: pToY(l.p) }))
                    ) + ' ' + buildPath(
                      sounding.levels
                        .filter(l => l.p <= lfc.p && l.p >= P_TOP)
                        .reverse()
                        .map(l => ({ x: tToX(l.td || l.t - 5, l.p), y: pToY(l.p) }))
                    ) + ' Z'}
                    fill="rgba(239,83,80,0.12)"
                    stroke="none"
                  />
                )}

                {/* LCL marker */}
                {lcl && (
                  <g>
                    <line x1={MARGIN.left} y1={pToY(lcl.p)} x2={MARGIN.left+PW} y2={pToY(lcl.p)} stroke="rgba(255,235,59,0.4)" strokeWidth="1" strokeDasharray="4 3" />
                    <text x={MARGIN.left+PW-2} y={pToY(lcl.p)-3} fill="#ffc107" fontSize="8" textAnchor="end" fontFamily="monospace">LCL {lcl.p}hPa</text>
                  </g>
                )}

                {/* LFC marker */}
                {lfc && (
                  <g>
                    <line x1={MARGIN.left} y1={pToY(lfc.p)} x2={MARGIN.left+PW} y2={pToY(lfc.p)} stroke="rgba(239,83,80,0.5)" strokeWidth="1" strokeDasharray="4 3" />
                    <text x={MARGIN.left+PW-2} y={pToY(lfc.p)-3} fill="#ef5350" fontSize="8" textAnchor="end" fontFamily="monospace">LFC {lfc.p}hPa</text>
                  </g>
                )}

                {/* Border */}
                <rect x={MARGIN.left} y={MARGIN.top} width={PW} height={PH} fill="none" stroke="#172338" strokeWidth="1.5" />

                {/* Axis label */}
                <text x={MARGIN.left + PW/2} y={H-2} fill="#607d8b" fontSize="9" textAnchor="middle" fontFamily="monospace">TEMPERATURE (°C) -- SKEWED 45°</text>
                <text x={12} y={MARGIN.top + PH/2} fill="#607d8b" fontSize="9" textAnchor="middle" fontFamily="monospace" transform={`rotate(-90,12,${MARGIN.top+PH/2})`}>PRESSURE (hPa)</text>
              </svg>

              {/* Right panel -- key values */}
              <div className="flex-1 space-y-2 text-[12px]">
                <div className="text-[11px] text-emerald-400 font-bold mb-2">{sounding.time} * Station 43295</div>

                {/* Legend */}
                <div className="flex gap-3 mb-3">
                  <span className="flex items-center gap-1"><span className="inline-block w-6 h-1 bg-red-400 rounded"></span> Temperature</span>
                  <span className="flex items-center gap-1"><span className="inline-block w-6 h-1 bg-green-400 rounded"></span> Dewpoint</span>
                </div>

                {/* Level table */}
                <div className="space-y-1">
                  <div className="grid grid-cols-3 text-[11px] text-[#607d8b] border-b border-[#172338] pb-1 font-bold">
                    <span>PRES (hPa)</span><span>TEMP (°C)</span><span>DEWP (°C)</span>
                  </div>
                  {sounding.levels.filter(l => [1000,925,850,700,500,300].includes(Math.round(l.p/25)*25) || [1000,925,850,700,500,300].includes(l.p)).slice(0,8).map((l,i) => (
                    <div key={i} className="grid grid-cols-3 text-[12px] border-b border-[#172338]/50 py-0.5">
                      <span className="text-cyan-300 font-bold">{Math.round(l.p)}</span>
                      <span className={l.t > 0 ? 'text-red-400' : 'text-blue-300'}>{l.t?.toFixed(1)}</span>
                      <span className="text-green-400">{l.td?.toFixed(1)}</span>
                    </div>
                  ))}
                </div>

                {/* Key derived indices */}
                <div className="mt-3 space-y-1 border-t border-[#172338] pt-2">
                  {lcl && <div className="flex justify-between"><span className="text-[#607d8b]">LCL</span><span className="text-yellow-400 font-bold">{lcl.p} hPa</span></div>}
                  {lfc && <div className="flex justify-between"><span className="text-[#607d8b]">LFC</span><span className="text-red-400 font-bold">{lfc.p} hPa</span></div>}
                  <div className="flex justify-between"><span className="text-[#607d8b]">850 hPa T</span><span className="text-white font-bold">{sounding.levels.find(l=>l.p<=870&&l.p>=830)?.t?.toFixed(1) ?? '--'}°C</span></div>
                  <div className="flex justify-between"><span className="text-[#607d8b]">500 hPa T</span><span className="text-white font-bold">{sounding.levels.find(l=>l.p<=520&&l.p>=480)?.t?.toFixed(1) ?? '--'}°C</span></div>
                  <div className="flex justify-between"><span className="text-[#607d8b]">Lapse Rate</span>
                    <span className="text-white font-bold">{(() => {
                      const t850 = sounding.levels.find(l=>l.p<=870&&l.p>=830)?.t;
                      const t500 = sounding.levels.find(l=>l.p<=520&&l.p>=480)?.t;
                      return (t850 && t500) ? `${((t850-t500)/3.5).toFixed(1)} °C/km` : '--';
                    })()}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {soundingStatus === 'error' && (
            <div className="h-24 flex items-center justify-center text-red-400 text-xs">
              Could not fetch sounding or build GFS fallback. Try refreshing.
            </div>
          )}
        </div>
      );
    }

    // --- 4. EXPLAINABILITY PAGE (SHAP BARS + RAG TERMINAL) ---
    function ExplainabilityPage({ liveData, hazardCfg }) {
      const { lang } = React.useContext(LangContext);
      const [shapSlot, setShapSlot] = useState(2);
      const [ragQuery, setRagQuery] = useState('');
      const [apiWarming, setApiWarming] = useState(false);
      const [apiWarmSec, setApiWarmSec] = useState(0);
      const [ragLogs, setRagLogs] = useState(
        `System ready. Connect to /rag/explain endpoint to activate Llama-3.3 powered meteorological explanation. Ask: Why did Slot 2 fire today?`
      );

      // Real-time SHAP -- computed inside component so liveData is in scope
      const DERIVED_FEATURES_RT = new Set(['cape_x_kindex','li_x_totals','thetae_850','q_gradient_500_850','wind_shear_500_850','wind_shear_700_850','moisture_flux_850','moisture_flux_700','thickness_500_850','mid_level_drying']);
      const _shapKey = hazardCfg?.key === 'cb' ? 'cb_realtime_shap' : hazardCfg?.key === 'ff' ? 'ff_realtime_shap' : 'realtime_shap';
      const realtimeShap = liveData?.[_shapKey]?.[String(shapSlot)];
      const isRealtime = !!realtimeShap?.top_features;
      const maxShap = isRealtime ? Math.max(...realtimeShap.top_features.map(f => Math.abs(f.shap)), 0.01) : 0.85;
      const SHAP_DATA = isRealtime ? realtimeShap.top_features.map(f => ({
          feature: f.feature,
          value: Math.abs(f.shap),
          raw_shap: f.shap,
          isDerived: DERIVED_FEATURES_RT.has(f.feature),
          direction: f.direction,
          actual_value: f.value,
        })) : SHAP_DATA_FALLBACK;

      const handleRunQuery = async (e) => {
        e.preventDefault();
        const query = ragQuery || 'Why did Slot 2 fire today?';
        const today = new Date().toISOString().split('T')[0];
        setRagLogs(`[RAG EXPLAINABILITY LOG -- ENDPOINT /rag/explain]:\nQuery: "${query}"\n\nConnecting to Llama-3.3 engine...`);
        setApiWarming(true); setApiWarmSec(0);
        const warmTimer = setInterval(() => setApiWarmSec(s => s + 1), 1000);
        try {
          const res = await fetch('https://csir-thunderstorm-api.onrender.com/rag/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query, date: today })
          });
          if (!res.ok) throw new Error(`API error: ${res.status}`);
          const data = await res.json();
          setRagLogs(
            `[RAG EXPLAINABILITY LOG -- ENDPOINT /rag/explain]:\n` +
            `Query: "${query}"\n\n` +
            `${data.explanation || data.response || data.answer || JSON.stringify(data, null, 2)}`
          );
        } catch (err) {
          setRagLogs(
            `[RAG EXPLAINABILITY LOG -- ENDPOINT /rag/explain]:\n` +
            `Query: "${query}"\n\n` +
            `[ERROR] Could not reach API: ${err.message}\n` +
            `Check: https://csir-thunderstorm-api.onrender.com/docs`
          );
        } finally {
          clearInterval(warmTimer);
          setApiWarming(false);
        }
      };

      return (
        <div className="space-y-6 max-w-[1750px] mx-auto font-sans">
          <PageHeader
            eyebrow="MODEL INTERPRETABILITY * SHAP & SOUNDINGS"
            title="Attribution & Atmospheric Physics"
            subtitle="Feature contribution values, atmospheric soundings, and hodograph kinematics"
            badge="EXPLAINABLE AI"
          />
          <SHAPWaterfallCard shapData={liveData?.realtime_shap} slotIdx={2} />

          {/* SHAP plain-language narration */}
          {(() => {
            const SLOT_NAMES = [t(lang,'LATE NIGHT')+' (00-06 UTC)', t(lang,'MORNING')+' (06-12 UTC)', t(lang,'AFTERNOON')+' (12-18 UTC)', t(lang,'EVENING')+' (18-00 UTC)'];
            const shapData = liveData?.realtime_shap;
            if (!shapData) return null;
            const slotKeys = Object.keys(shapData).sort();
            return (
              <div className="p-6 rounded-2xl bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl shadow-xl space-y-4">
                <div className="text-xs font-bold text-cyan-300 uppercase tracking-wider border-b border-slate-800 pb-2">
                  WHY DID EACH SLOT FIRE? -- SHAP DRIVER NARRATION
                </div>
                {slotKeys.map(sk => {
                  const entry = shapData[sk];
                  if (!entry?.top_features) return null;
                  const slotIdx = parseInt(sk, 10);
                  const slotName = SLOT_NAMES[slotIdx] || `Slot ${slotIdx}`;
                  const prob = entry.ts_probability ?? entry.probability ?? 0;
                  const pct = (prob * 100).toFixed(1);
                  const sorted = [...entry.top_features].sort((a, b) => Math.abs(b.shap) - Math.abs(a.shap)).slice(0, 3);
                  const baseRate = (entry.base_rate ?? 0.18) * 100;

                  const featureDesc = (ft) => {
                    const sign = ft.shap >= 0 ? 'elevated' : 'suppressed';
                    const mag  = Math.abs(ft.shap);
                    const strength = mag > 0.15 ? 'strongly' : mag > 0.07 ? 'moderately' : 'slightly';
                    const valStr = ft.value !== undefined ? ` (${typeof ft.value === 'number' ? ft.value.toFixed(1) : ft.value})` : '';
                    return `${ft.feature}${valStr} ${strength} ${sign} risk by ${ft.shap >= 0 ? '+' : ''}${ft.shap.toFixed(3)} SHAP`;
                  };

                  const topDriver = sorted[0];
                  const isAlert = prob >= 0.35;
                  const alertWord = prob >= 0.55 ? 'HIGH probability' : prob >= 0.35 ? 'ELEVATED probability' : prob >= 0.15 ? 'LOW-to-MODERATE probability' : 'LOW probability';
                  const direction = topDriver?.shap >= 0 ? 'above' : 'below';

                  return (
                    <div key={sk} className="rounded-xl border p-4" style={{
                      borderColor: isAlert ? 'rgba(239,83,80,0.3)' : 'rgba(56,189,248,0.1)',
                      background: isAlert ? 'rgba(239,83,80,0.04)' : 'rgba(5,8,17,0.6)',
                    }}>
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-[11px] font-bold text-[#607d8b] uppercase tracking-widest">{slotName}</span>
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded" style={{
                          background: isAlert ? 'rgba(239,83,80,0.15)' : 'rgba(56,189,248,0.1)',
                          color: isAlert ? '#ef5350' : '#38bdf8',
                        }}>{pct}%</span>
                      </div>
                      <p className="text-[11px] text-[#90a4ae] leading-relaxed">
                        {`${slotName} shows ${alertWord} at ${pct}% (base rate ${baseRate.toFixed(0)}%). `}
                        {sorted.length > 0 && `Primary driver: ${featureDesc(sorted[0])}. `}
                        {sorted.length > 1 && `${featureDesc(sorted[1])}. `}
                        {sorted.length > 2 && `${featureDesc(sorted[2])}.`}
                      </p>
                    </div>
                  );
                })}
              </div>
            );
          })()}

          <div className="flex flex-col sm:flex-row justify-end items-start sm:items-center gap-3 border-b border-[#172338] pb-4">
            {/* Slot Switcher */}
            <div className="flex items-center gap-1 text-xs">
              {['Slot 0 (Late Night)', 'Slot 1 (Morning)', 'Slot 2 (Afternoon)', 'Slot 3 (Evening)'].map((sLabel, idx) => (
                <button
                  key={idx}
                  onClick={() => setShapSlot(idx)}
                  className={`px-3 py-1.5 rounded font-bold transition-all ${
                    shapSlot === idx ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400/50' : 'bg-[#050811] text-[#607d8b] border border-[#172338]'
                  }`}
                >
                  {sLabel}
                </button>
              ))}
            </div>
          </div>

          {/* SKEW-T SOUNDING DIAGRAM */}
          <SkewTDiagram liveData={liveData} />

          {/* SHAP slot label */}
          <div className="text-[12px] text-[#607d8b] -mt-2">↑ Slot switcher above controls SHAP only -- Skew-T shows today's full atmospheric column</div>

          {!isRealtime && (
            <div className="text-[11px] font-bold px-2 py-1 rounded border text-amber-300 border-amber-700/50 bg-amber-900/20 inline-block">
              STATIC / HISTORICAL FALLBACK -- live per-run SHAP unavailable for this slot, showing illustrative example values
            </div>
          )}

          {/* SHAP Chart Legend */}
          <div className="flex items-center gap-6 text-xs border-b border-[#172338] pb-3">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded bg-cyan-400"></span>
              <span className="text-[#90a4ae]">Original ERA5 / IMD Features</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded bg-red-400"></span>
              <span className="text-[#90a4ae]">New v3 Physical Interaction Features (Derived)</span>
            </div>
          </div>

          {/* TRUE SHAP WATERFALL CHART -- Cumulative contribution path */}
          {isRealtime && realtimeShap.base_value !== undefined && (() => {
            const feats = realtimeShap.top_features.slice(0, 9);
            const base = realtimeShap.base_value;
            const finalProb = realtimeShap.prob;
            let running = base;
            const bars = feats.map(f => {
              const start = running;
              running += f.shap;
              return { ...f, start, end: running };
            });
            const residual = finalProb - running;
            if (Math.abs(residual) > 0.001) {
              bars.push({ feature: '+ other features', shap: residual, start: running, end: finalProb,
                direction: residual > 0 ? 'increases_risk' : 'decreases_risk' });
            }
            // Use actual data range (SHAP base can exceed 1.0 in some model configs)
            const allRaw = [base, finalProb, ...bars.map(b => b.start), ...bars.map(b => b.end)];
            const dataMin = Math.min(...allRaw);
            const dataMax = Math.max(...allRaw);
            const pad5 = (dataMax - dataMin) * 0.05 || 0.05;
            const minV = dataMin - pad5;
            const maxV = dataMax + pad5;
            const range = maxV - minV || 0.01;
            const W = 680, H = 28 * (bars.length + 2) + 50;
            const PAD = { t: 28, r: 80, b: 32, l: 170 };
            const chartW = W - PAD.l - PAD.r;
            const chartH = H - PAD.t - PAD.b;
            const rowH = chartH / (bars.length + 1);
            const barH = rowH * 0.55;
            const toX = val => PAD.l + ((val - minV) / range) * chartW;
            const toY = idx => PAD.t + (idx + 0.5) * rowH;
            const baseX = toX(base);
            const finalX = toX(finalProb);
            return (
              <div className="p-4 rounded-xl bg-[#020409] border border-cyan-500/20 space-y-1">
                <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                  <div>
                    <h4 className="text-xs font-bold text-white">SHAP WATERFALL -- PREDICTION PATH</h4>
                    <p className="text-[11px] text-[#607d8b]">Cumulative feature contributions: base probability → model output * Slot {shapSlot}</p>
                  </div>
                  <div className="flex items-center gap-4 text-[11px] font-mono">
                    <span className="text-[#607d8b]">BASE RATE <span className="text-white font-bold">{(base*100).toFixed(1)}%</span></span>
                    <span className="text-cyan-400">→ OUTPUT <span className="text-cyan-300 font-bold">{(finalProb*100).toFixed(1)}%</span></span>
                  </div>
                </div>
                <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ fontFamily: 'JetBrains Mono, monospace', overflow: 'visible' }}>
                  <defs>
                    <clipPath id="shap-bars-clip">
                      <rect x={PAD.l} y={PAD.t} width={chartW} height={chartH} />
                    </clipPath>
                  </defs>
                  {/* Zero-change baseline */}
                  <line x1={baseX} y1={PAD.t - 8} x2={baseX} y2={H - PAD.b + 5} stroke="#607d8b" strokeWidth="1" strokeDasharray="3 3" />
                  <text x={baseX} y={PAD.t - 10} textAnchor="middle" fontSize="8" fill="#607d8b">BASE {(base*100).toFixed(1)}%</text>
                  {/* Final probability line */}
                  <line x1={finalX} y1={PAD.t - 8} x2={finalX} y2={H - PAD.b + 5} stroke="#38bdf8" strokeWidth="1.5" />
                  <text x={finalX} y={PAD.t - 10} textAnchor="middle" fontSize="8.5" fill="#38bdf8" fontWeight="bold">P={`${(finalProb*100).toFixed(1)}%`}</text>
                  {/* Each SHAP bar */}
                  {bars.map((bar, i) => {
                    const y = toY(i);
                    const x1 = toX(Math.min(bar.start, bar.end));
                    const x2 = toX(Math.max(bar.start, bar.end));
                    const w = Math.max(x2 - x1, 1.5);
                    const isPos = bar.shap >= 0;
                    const barColor = isPos ? '#ef5350' : '#38bdf8';
                    const endX = toX(bar.end);
                    return (
                      <g key={bar.feature}>
                        {i > 0 && (
                          <line x1={toX(bars[i-1].end)} y1={toY(i-1) + barH/2}
                                x2={toX(bars[i-1].end)} y2={y - barH/2}
                                stroke="#172338" strokeWidth="0.8" strokeDasharray="2 2" />
                        )}
                        <g clipPath="url(#shap-bars-clip)">
                          <rect x={x1} y={y - barH/2} width={w} height={barH} fill={barColor} opacity="0.80" rx="2" />
                        </g>
                        <text x={PAD.l - 6} y={y + 3.5} textAnchor="end" fontSize="8.5" fill="#90a4ae">{bar.feature}</text>
                        <text x={endX + (isPos ? 4 : -4)} y={y + 3.5}
                              textAnchor={isPos ? 'start' : 'end'} fontSize="8" fill={barColor} fontWeight="bold">
                          {(bar.shap >= 0 ? '+' : '') + (bar.shap * 100).toFixed(1) + 'pp'}
                        </text>
                        <circle cx={endX} cy={y} r="2.5" fill={barColor} opacity="0.9" />
                      </g>
                    );
                  })}
                  {/* X-axis ticks -- evenly spaced across actual data range */}
                  {Array.from({length: 6}, (_, i) => minV + (i / 5) * (maxV - minV)).map((v, i) => (
                    <g key={i}>
                      <line x1={toX(v)} y1={H - PAD.b} x2={toX(v)} y2={H - PAD.b + 4} stroke="#172338" strokeWidth="0.8" />
                      <text x={toX(v)} y={H - PAD.b + 13} textAnchor="middle" fontSize="7.5" fill="#607d8b">
                        {(v * 100).toFixed(0)}%
                      </text>
                    </g>
                  ))}
                  <line x1={PAD.l} y1={H - PAD.b} x2={W - PAD.r} y2={H - PAD.b} stroke="#172338" strokeWidth="0.8" />
                </svg>
                <div className="flex items-center gap-4 text-[11px] font-mono text-[#607d8b] border-t border-[#172338] pt-2">
                  <span className="flex items-center gap-1"><span className="w-3 h-2 rounded bg-red-500/70 inline-block"></span>increases TS probability</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-2 rounded bg-cyan-500/70 inline-block"></span>suppresses TS probability</span>
                  <span className="text-[#3d5066]">Each bar shifts cumulative probability from base rate</span>
                </div>
              </div>
            );
          })()}

          {/* ── WIND HODOGRAPH ── */}
          {liveData?.met_parameters && (() => {
            const mp = liveData.met_parameters;
            // Wind vectors at pressure levels: [hPa, u, v]
            const levels = [
              { hPa: 850, u: mp.U_WIND_850 ?? mp.u850 ?? null, v: mp.V_WIND_850 ?? mp.v850 ?? null, label: '850', color: '#ef5350' },
              { hPa: 700, u: mp.U_WIND_700 ?? mp.u700 ?? null, v: mp.V_WIND_700 ?? mp.v700 ?? null, label: '700', color: '#ff9800' },
              { hPa: 500, u: mp.U_WIND_500 ?? mp.u500 ?? null, v: mp.V_WIND_500 ?? mp.v500 ?? null, label: '500', color: '#ffc107' },
              { hPa: 300, u: mp.U_WIND_300 ?? mp.u300 ?? null, v: mp.V_WIND_300 ?? mp.v300 ?? null, label: '300', color: '#4caf50' },
            ].filter(l => l.u !== null && l.v !== null && !isNaN(l.u) && !isNaN(l.v));

            if (levels.length < 2) return null;

            const CX = 120, CY = 120, R = 100;
            // Scale: find max wind magnitude
            const maxWind = Math.max(...levels.map(l => Math.sqrt(l.u**2 + l.v**2)), 10);
            const scale = R / maxWind;
            // Convert met convention: u = east component, v = north component
            // SVG: right=east, up=north (invert y)
            const toXY = (u, v) => [CX + u * scale, CY - v * scale];

            const pathD = levels.map((l, i) => {
              const [x, y] = toXY(l.u, l.v);
              return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');

            const rings = [0.25, 0.5, 0.75, 1.0].map(r => (r * maxWind).toFixed(0));
