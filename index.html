    // == DATA & GRAPHS PAGE ==================================================
    function DataGraphsPage({ liveData }) {
      const { lang } = React.useContext(LangContext);
      const [history, setHistory] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('sih_history') || '[]'); } catch { return []; }
      });
      const [selectedMetric, setSelectedMetric] = React.useState('probability');

      React.useEffect(() => {
        if (!liveData) return;
        const now = new Date();
        const istStr = now.toLocaleString('en-IN', { timeZone:'Asia/Kolkata', hour12:false, hour:'2-digit', minute:'2-digit', month:'short', day:'numeric' });
        const snap = {
          ts: Date.now(), label: istStr,
          probability: Math.round((liveData.peak_probability || 0) * 100),
          iwv:  liveData.gfs?.iwv_kg_m2        != null ? Math.round(liveData.gfs.iwv_kg_m2) : null,
          cape: liveData.gfs?.ua_cape_jkg       != null ? Math.round(liveData.gfs.ua_cape_jkg) : null,
          shear:liveData.gfs?.wind_shear_0_6km_ms != null ? Math.round(liveData.gfs.wind_shear_0_6km_ms*10)/10 : null,
          kidx: liveData.gfs?.ua_k_index        != null ? Math.round(liveData.gfs.ua_k_index) : null,
        };
        setHistory(prev => {
          const last = prev[prev.length - 1];
          if (last && (snap.ts - last.ts) < 5 * 60 * 1000) return prev;
          const next = [...prev.slice(-47), snap];
          try { localStorage.setItem('sih_history', JSON.stringify(next)); } catch {}
          return next;
        });
      }, [liveData]);

      const METRICS = [
        { key:'probability', label:'Thunderstorm Probability', unit:'%',     color:'#ef5350', max:100,  thresholdLine:35   },
        { key:'iwv',         label:'Integrated Water Vapour',  unit:'kg/m²',color:'#38bdf8', max:60,   thresholdLine:45   },
        { key:'cape',        label:'CAPE  (Storm Energy)',      unit:'J/kg',  color:'#ffa726', max:3000, thresholdLine:1500 },
        { key:'shear',       label:'Wind Shear 0-6 km',       unit:'m/s',   color:'#66bb6a', max:30,   thresholdLine:12   },
        { key:'kidx',        label:'K-Index',                  unit:'',      color:'#ab47bc', max:50,   thresholdLine:35   },
      ];
      const m = METRICS.find(x => x.key === selectedMetric) || METRICS[0];
      const data = history.filter(h => h[m.key] != null);

      const W=640, H=180, PAD={l:42,r:12,t:16,b:36};
      const cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
      const toX = i => PAD.l + (data.length<=1 ? cW/2 : (i/(data.length-1))*cW);
      const toY = v => PAD.t + cH - Math.min(1,Math.max(0,v/(m.max||100)))*cH;
      const pts  = data.map((d,i)=>`${toX(i)},${toY(d[m.key])}`).join(' ');
      const poly = data.length>1
        ? `${PAD.l},${PAD.t+cH} ${data.map((d,i)=>`${toX(i)},${toY(d[m.key])}`).join(' ')} ${toX(data.length-1)},${PAD.t+cH}`
        : '';

      const cv = liveData ? (() => {
        if(m.key==='probability') return Math.round((liveData.peak_probability||0)*100);
        if(m.key==='iwv')   return liveData.gfs?.iwv_kg_m2!=null?Math.round(liveData.gfs.iwv_kg_m2):null;
        if(m.key==='cape')  return liveData.gfs?.ua_cape_jkg!=null?Math.round(liveData.gfs.ua_cape_jkg):null;
        if(m.key==='shear') return liveData.gfs?.wind_shear_0_6km_ms!=null?Math.round(liveData.gfs.wind_shear_0_6km_ms*10)/10:null;
        if(m.key==='kidx')  return liveData.gfs?.ua_k_index!=null?Math.round(liveData.gfs.ua_k_index):null;
        return null;
      })() : null;
      const aboveThresh = m.thresholdLine && cv!=null && cv>=m.thresholdLine;

      return (
        <div className="font-sans max-w-[1750px] mx-auto space-y-6">
          <PageHeader 
            eyebrow="METEOROLOGICAL TIME SERIES" 
            title="Data & Atmospheric Graphs"
            subtitle="Atmospheric parameters tracked over time at VOBL/Bengaluru. Readings captured automatically each session."
            badge="LIVE TELEMETRY" 
            badgeColor="sky" 
          />

          {/* Parameter selector pills */}
          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-5 shadow-2xl">
            <div className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-3">SELECT ATMOSPHERIC PARAMETER</div>
            <div className="flex flex-wrap gap-2.5">
              {METRICS.map(mx => {
                const isActive = selectedMetric === mx.key;
                return (
                  <button 
                    key={mx.key} 
                    onClick={() => setSelectedMetric(mx.key)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold tracking-wider transition-all flex items-center gap-2 ${
                      isActive 
                        ? 'border shadow-[0_0_14px_rgba(56,189,248,0.2)]' 
                        : 'bg-[#080d1a]/80 border border-[#1e293b]/70 text-slate-400 hover:text-slate-200 hover:bg-[#111c38]'
                    }`}
                    style={isActive ? {
                      backgroundColor: `${mx.color}22`,
                      borderColor: mx.color,
                      color: mx.color
                    } : {}}
                  >
                    <span className="w-2 h-2 rounded-full" style={{backgroundColor: mx.color}}></span>
                    <span>{mx.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* KPI Stat Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div className={`bg-[#0c1326]/75 border backdrop-blur-xl rounded-2xl p-5 shadow-xl transition-all ${aboveThresh ? 'border-rose-500/50 shadow-[0_0_20px_rgba(244,63,94,0.15)]' : 'border-[#1e293b]/70'}`}>
              <div className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-1">CURRENT READING</div>
              <div className="text-3xl font-mono font-black" style={{color: aboveThresh ? '#f43f5e' : m.color}}>
                {cv != null ? cv : '--'}<span className="text-xs text-slate-400 ml-1.5 font-normal">{m.unit}</span>
              </div>
              {aboveThresh && (
                <div className="text-[10px] text-rose-400 font-bold tracking-wider uppercase mt-2 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-ping"></span>
                  ABOVE THRESHOLD ({m.thresholdLine}{m.unit})
                </div>
              )}
            </div>
            {data.length > 0 && [
              {label:'SESSION MAXIMUM', val:Math.max(...data.map(d=>d[m.key]))},
              {label:'SESSION AVERAGE', val:Math.round(data.reduce((a,d)=>a+d[m.key],0)/data.length)},
            ].map(x => (
              <div key={x.label} className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-5 shadow-xl">
                <div className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-1">{x.label}</div>
                <div className="text-3xl font-mono font-black text-slate-100">
                  {x.val}<span className="text-xs text-slate-400 ml-1.5 font-normal">{m.unit}</span>
                </div>
              </div>
            ))}
          </div>

          {/* SVG Timeseries Graph */}
          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl">
            <div className="flex justify-between items-center mb-5">
              <div>
                <div className="text-xs font-bold tracking-wider text-slate-300 uppercase">{m.label.toUpperCase()} OVER TIME</div>
                <div className="text-xs font-mono text-slate-400 mt-0.5">{data.length} telemetry readings recorded this session</div>
              </div>
              {data.length > 0 && (
                <button 
                  onClick={() => { try{localStorage.removeItem('sih_history');}catch{} setHistory([]); }}
                  className="px-3 py-1.5 rounded-lg text-xs font-mono text-slate-400 hover:text-rose-400 bg-[#080d1a] border border-[#1e293b] hover:border-rose-500/40 transition-colors"
                >
                  Clear History
                </button>
              )}
            </div>

            {data.length < 2 ? (
              <div className="text-center py-14 text-slate-400 text-sm">
                <div className="text-4xl mb-3">📊</div>
                Readings accumulate automatically as you monitor conditions. Check back after a few minutes.
              </div>
            ) : (
              <div style={{overflowX:'auto'}}>
                <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:'320px',height:'auto',fontFamily:'system-ui, -apple-system, sans-serif'}}>
                  <defs>
                    <linearGradient id="metricGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor={m.color} stopOpacity="0.25" />
                      <stop offset="100%" stopColor={m.color} stopOpacity="0.0" />
                    </linearGradient>
                  </defs>
                  {[0,0.25,0.5,0.75,1].map(f => {
                    const y = PAD.t + cH * (1 - f);
                    const val = Math.round(m.max * f);
                    return (
                      <g key={f}>
                        <line x1={PAD.l} x2={PAD.l + cW} y1={y} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1" />
                        <text x={PAD.l - 6} y={y + 3.5} textAnchor="end" fontSize="8" fill="#64748b" fontFamily="monospace">{val}</text>
                      </g>
                    );
                  })}
                  {m.thresholdLine && (() => {
                    const ty = toY(m.thresholdLine);
                    return (
                      <g>
                        <line x1={PAD.l} x2={PAD.l + cW} y1={ty} y2={ty} stroke="#f43f5e" strokeWidth="1" strokeDasharray="4 3" opacity="0.7" />
                        <text x={PAD.l + cW} y={ty - 3} textAnchor="end" fontSize="8" fill="#f43f5e" fontWeight="bold">threshold ({m.thresholdLine})</text>
                      </g>
                    );
                  })()}
                  {poly && <polygon points={poly} fill="url(#metricGrad)" />}
                  <polyline points={pts} fill="none" stroke={m.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                  {data.map((d, i) => (
                    <circle key={i} cx={toX(i)} cy={toY(d[m.key])} r="3.5" fill={m.color} stroke="#0c1326" strokeWidth="1.5" />
                  ))}
                  {data.filter((_,i) => i % Math.max(1, Math.floor(data.length / 6)) === 0 || i === data.length - 1).map(d => (
                    <text key={d.ts} x={toX(data.indexOf(d))} y={H - 8} textAnchor="middle" fontSize="7.5" fill="#64748b" fontFamily="monospace">
                      {d.label.split(',')[0]}
                    </text>
                  ))}
                  <text x={PAD.l - 2} y={PAD.t - 5} textAnchor="middle" fontSize="8" fill="#94a3b8" fontFamily="monospace">{m.unit}</text>
                </svg>
              </div>
            )}
          </div>

          {/* Historical Readings Table */}
          {data.length > 0 && (
            <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl overflow-x-auto">
              <div className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-4">LAST {Math.min(data.length, 10)} TELEMETRY READINGS</div>
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-[#1e293b]/70 text-slate-400 font-mono">
                    {['TIME (IST)','PROB %','IWV','CAPE','K-IDX'].map(h => (
                      <th key={h} className={`p-3 font-bold tracking-wider ${h==='TIME (IST)' ? 'text-left' : 'text-right'}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#1e293b]/40 font-mono">
                  {[...history].reverse().slice(0, 10).map((row, i) => (
                    <tr key={row.ts} className="hover:bg-sky-500/5 transition-colors">
                      <td className="p-3 text-slate-300">{row.label}</td>
                      <td className={`p-3 text-right font-bold ${row.probability>=35 ? 'text-rose-400' : 'text-slate-200'}`}>{row.probability ?? '--'}%</td>
                      <td className="p-3 text-right text-sky-400">{row.iwv ?? '--'}</td>
                      <td className={`p-3 text-right font-bold ${(row.cape||0)>=1500 ? 'text-amber-400' : 'text-slate-300'}`}>{row.cape ?? '--'}</td>
                      <td className={`p-3 text-right font-bold ${(row.kidx||0)>=35 ? 'text-purple-400' : 'text-slate-300'}`}>{row.kidx ?? '--'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // == CONTACTS PAGE =======================================================
    function ContactsPage({ liveData }) {
      const { lang } = React.useContext(LangContext);
      const [contacts, setContacts] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('sih_contacts')||'[]'); } catch { return []; }
      });
      const [form, setForm] = React.useState({name:'',phone:'',email:'',note:''});
      const [alertMsg, setAlertMsg] = React.useState('');
      const [sending, setSending] = React.useState(false);
      const [sentTo, setSentTo] = React.useState([]);

      const save = (next) => { setContacts(next); try{localStorage.setItem('sih_contacts',JSON.stringify(next));}catch{} };

      const addContact = () => {
        if (!form.name.trim() || (!form.phone.trim() && !form.email.trim())) {
          alert('Please enter a name and at least a phone number or email.'); return;
        }
        save([...contacts, {...form, id:Date.now()}]);
        setForm({name:'',phone:'',email:'',note:''});
      };

      const maxProb = liveData ? Math.max(liveData.peak_probability||0,...(liveData.slots||[]).map(s=>s.probability||0)) : 0;
      const isAlert = maxProb>=0.35;

      const threshItems = [
        {label:'Thunderstorm Probability', val:Math.round((liveData?.peak_probability||0)*100), threshold:35, unit:'%', color:'#ef5350'},
        {label:'Integrated Water Vapour',  val:liveData?.gfs?.iwv_kg_m2!=null?Math.round(liveData.gfs.iwv_kg_m2):null, threshold:45, unit:'kg/m²', color:'#38bdf8'},
        {label:'CAPE',                     val:liveData?.gfs?.ua_cape_jkg!=null?Math.round(liveData.gfs.ua_cape_jkg):null, threshold:1500, unit:'J/kg', color:'#ffa726'},
        {label:'K-Index',                  val:liveData?.gfs?.ua_k_index!=null?Math.round(liveData.gfs.ua_k_index):null, threshold:35, unit:'', color:'#ab47bc'},
      ];

      const sendAlert = () => {
        if (!contacts.length){alert('No contacts registered yet.');return;}
        const msg = alertMsg.trim() || `Emergency alert from IMD Hyperlocal Warning System. Current thunderstorm probability at VOBL: ${Math.round(maxProb*100)}%. Please take precautions.`;
        setSending(true);
        setTimeout(()=>{
          setSentTo(contacts.map(c=>c.name));
          setSending(false); setAlertMsg('');
          alert('Alert prepared for '+contacts.length+' contact(s):\n\n'+msg+'\n\n(In production this dispatches via SMS/WhatsApp/email through the alert worker.)');
        },1000);
      };

      return (
        <div className="font-sans max-w-[1750px] mx-auto space-y-6">
          <PageHeader 
            eyebrow="EMERGENCY CONTACTS &amp; DISPATCH" 
            title="Contacts &amp; Manual Alerts"
            subtitle="Register emergency response coordinators and dispatch multi-channel advisories during severe convection."
            badge={isAlert ? 'ALERT CONDITIONS' : 'STANDBY'} 
            badgeColor={isAlert ? 'red' : 'green'} 
          />

          {/* Automatic Threshold Status */}
          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl space-y-4">
            <div className="text-xs font-bold tracking-wider text-slate-400 uppercase">AUTOMATIC THRESHOLD STATUS</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {threshItems.map(item => {
                const triggered = item.val != null && item.val >= item.threshold;
                return (
                  <div key={item.label} className={`p-4 rounded-xl transition-all ${
                    triggered 
                      ? 'bg-rose-500/10 border border-rose-500/35 shadow-[0_0_16px_rgba(244,63,94,0.12)]' 
                      : 'bg-[#080d1a]/80 border border-[#1e293b]/60'
                  }`}>
                    <div className="text-[11px] font-bold tracking-wider uppercase text-slate-400 mb-1">{item.label}</div>
                    <div className="text-2xl font-mono font-black" style={{color: triggered ? item.color : '#f1f5f9'}}>
                      {item.val != null ? item.val : '--'}<span className="text-xs font-normal text-slate-400 ml-1">{item.unit}</span>
                    </div>
                    <div className={`text-[11px] font-mono mt-1.5 font-bold ${triggered ? 'text-rose-400' : 'text-slate-400'}`}>
                      {triggered ? '⚠ EXCEEDED' : '✓ OK'} -- limit: {item.threshold}{item.unit}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="text-xs font-mono text-slate-400 pt-2 border-t border-[#1e293b]/50">
              Browser push notifications fire automatically when probability exceeds your set limit. Manual broadcast below messages all registered personnel directly.
            </div>
          </div>

          {/* Manual Dispatcher */}
          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl space-y-4">
            <div className="text-xs font-bold tracking-wider text-slate-400 uppercase">BROADCAST MANUAL ALERT TO ALL CONTACTS</div>
            <textarea 
              value={alertMsg} 
              onChange={e => setAlertMsg(e.target.value)} 
              rows={3}
              placeholder={'Custom alert message (leave blank to send the automated IMD advisory)'}
              className="w-full p-4 rounded-xl text-sm font-sans bg-[#080d1a]/90 border border-[#1e293b]/70 text-slate-100 outline-none focus:border-sky-400/60 transition-colors resize-vertical"
            />
            <div className="flex flex-wrap items-center gap-3">
              <button 
                onClick={sendAlert} 
                disabled={sending}
                className={`px-5 py-2.5 rounded-xl font-bold text-xs tracking-wider uppercase transition-all flex items-center gap-2 ${
                  isAlert 
                    ? 'bg-rose-500/20 border border-rose-500/50 text-rose-300 hover:bg-rose-500/30 shadow-[0_0_15px_rgba(244,63,94,0.2)]' 
                    : 'bg-sky-500/20 border border-sky-400/40 text-sky-300 hover:bg-sky-500/30 shadow-[0_0_15px_rgba(56,189,248,0.15)]'
                }`}
              >
                <span>{sending ? '⏳ Dispatching…' : `📢 Dispatch to ${contacts.length} Contact(s)`}</span>
              </button>
              {sentTo.length > 0 && (
                <span className="text-xs font-mono text-emerald-400 font-bold">✔ Dispatched to: {sentTo.join(', ')}</span>
              )}
            </div>
          </div>

          {/* Register New Contact */}
          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl space-y-4">
            <div className="text-xs font-bold tracking-wider text-slate-400 uppercase">REGISTER NEW EMERGENCY CONTACT</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {[
                {k:'name',p:'Full Name *',t:'text'},
                {k:'phone',p:'Phone / WhatsApp',t:'tel'},
                {k:'email',p:'Email Address',t:'email'},
                {k:'note',p:'Role / Department',t:'text'}
              ].map(f => (
                <input 
                  key={f.k} 
                  type={f.t} 
                  placeholder={f.p} 
                  value={form[f.k]}
                  onChange={e => setForm(x => ({...x, [f.k]: e.target.value}))}
                  className="px-3.5 py-2.5 rounded-xl text-sm font-sans bg-[#080d1a]/90 border border-[#1e293b]/70 text-slate-100 outline-none focus:border-sky-400/60 transition-colors"
                />
              ))}
            </div>
            <button 
              onClick={addContact}
              className="px-5 py-2.5 rounded-xl font-bold text-xs tracking-wider uppercase transition-all bg-sky-500/20 border border-sky-400/40 text-sky-300 hover:bg-sky-500/30 shadow-[0_0_15px_rgba(56,189,248,0.15)]"
            >
              + Register Contact
            </button>
          </div>

          {/* Contacts Directory */}
          {contacts.length > 0 ? (
            <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl space-y-4">
              <div className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-3">
                REGISTERED EMERGENCY CONTACTS ({contacts.length})
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                {contacts.map(c => (
                  <div key={c.id} className="p-4 rounded-xl bg-[#080d1a]/85 border border-[#1e293b]/60 flex items-center justify-between hover:border-sky-500/40 transition-all">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-sky-300 font-bold font-mono text-sm">
                        {c.name.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <div className="font-bold text-sm text-slate-100">{c.name}</div>
                        <div className="text-xs font-mono text-slate-400 mt-0.5 space-x-2">
                          {c.phone && <span>📞 {c.phone}</span>}
                          {c.email && <span>✉️ {c.email}</span>}
                          {c.note && <span className="text-sky-400">📋 {c.note}</span>}
                        </div>
                      </div>
                    </div>
                    <button 
                      onClick={() => save(contacts.filter(x => x.id !== c.id))}
                      className="px-3 py-1 rounded-lg text-xs font-mono font-bold text-rose-400 bg-rose-500/10 border border-rose-500/30 hover:bg-rose-500/20 transition-colors"
                    >
                      Remove
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-10 text-center text-slate-400 shadow-2xl">
              <div className="text-4xl mb-3">📞</div>
              <div className="text-base font-bold text-slate-300 mb-1">No emergency contacts registered yet.</div>
              <div className="text-xs text-slate-400">Register emergency coordinators above to enable manual broadcast and notifications.</div>
            </div>
          )}
        </div>
      );
    }


    // END NEW FEATURE PAGES
    // ═══════════════════════════════════════════════════════════════════════════

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e }; }
      render() {
        if (this.state.error) {
          return (
            <div style={{position:'fixed',inset:0,background:'#040711',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:'24px'}}>
              <div style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:'12px',padding:'24px',maxWidth:'600px',fontFamily:'monospace',color:'#f87171'}}>
                <div style={{fontSize:'11px',letterSpacing:'0.15em',marginBottom:'12px',color:'#ef4444'}}>⛔ REACT RUNTIME ERROR</div>
                <div style={{fontSize:'13px',marginBottom:'8px',color:'#fca5a5',fontWeight:'bold'}}>{String(this.state.error)}</div>
                <div style={{fontSize:'10px',color:'#6b7280',whiteSpace:'pre-wrap',maxHeight:'300px',overflow:'auto'}}>{this.state.error?.stack}</div>
                <button onClick={()=>window.location.reload()} style={{marginTop:'16px',padding:'8px 16px',background:'rgba(239,68,68,0.2)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:'6px',color:'#f87171',cursor:'pointer',fontSize:'11px'}}>RELOAD</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));

    // ── Service Worker Registration ───────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('[IMD SW] Registered:', reg.scope);
          // Listen for forecast updates from SW
          navigator.serviceWorker.addEventListener('message', e => {
            if (e.data?.type === 'FORECAST_UPDATED') {
              console.log('[IMD SW] Forecast updated in background');
            }
          });
        }).catch(err => console.warn('[IMD SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
