  <!-- Kill all service workers and caches -- forces latest version for every visitor -->
  <script>
    (function() {
      // Unregister every SW
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      // Nuke every cache entry
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    })();
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #040711; }
    ::-webkit-scrollbar-thumb { background: #172338; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

    /* Fix 2: ONE Overlay only, 20% opacity maximum -- rgba(0, 0, 0, 0.20), no blur, no bg-black */
    .overlay {
      background: rgba(0, 0, 0, 0.20);
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Fix 1: Background CSS for all 4 slot divs */
    .slot-bg-common {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: none !important;
      -webkit-filter: none !important;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Fix 4: Panel cards -- background: rgba(6,10,20,0.88) on all panel cards */
    .atc-card {
      background: rgba(6, 10, 20, 0.88) !important;
      border: 1px solid rgba(23, 35, 56, 0.85);
    }
    
    .atc-card-hover {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .atc-card-hover:hover {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    /* Active Teal Highlight Ring */
    .slot-active-teal {
      border: 2px solid #38bdf8 !important;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35), inset 0 0 15px rgba(56, 189, 248, 0.15) !important;
      background: rgba(12, 24, 46, 0.95) !important;
    }

    /* Radar Scan Animation */
    @keyframes radarScan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-radar { animation: radarScan 6s linear infinite; transform-origin: center; }

    /* Rain particle animation */
    @keyframes fallRain {
      0% { transform: translateY(-100px) translateX(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(100vh) translateX(-60px); opacity: 0; }
    }
    /* Twinkle stars animation */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .star-particle { animation: starTwinkle 3s infinite ease-in-out; }

    /* Drift detection banner pulse */
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
    .animate-pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }

    /* ── AURORA BLOBS ─────────────────────────────────────────────── */
    @keyframes aurora-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      30%  { transform: translate(60px,-40px) scale(1.12); }
      60%  { transform: translate(-30px,30px) scale(0.93); }
    }
    @keyframes aurora-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%  { transform: translate(-80px,50px) scale(1.08); }
      70%  { transform: translate(40px,-30px) scale(0.96); }
    }
    @keyframes aurora-3 {
      0%,100% { transform: translate(0,0) scale(1) rotate(0deg); }
      50%  { transform: translate(30px,60px) scale(1.1) rotate(8deg); }
    }
    .aurora-blob-1 {
      animation: aurora-1 18s ease-in-out infinite;
    }
    .aurora-blob-2 {
      animation: aurora-2 22s ease-in-out infinite;
    }
    .aurora-blob-3 {
      animation: aurora-3 15s ease-in-out infinite;
    }

    /* ── GRADIENT BORDER SWEEP ───────────────────────────────────── */
    @keyframes border-sweep {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    /* ── GRADIENT TEXT ───────────────────────────────────────────── */
    @keyframes gradient-pan {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .gradient-text {
      background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 45%, #38bdf8 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-pan 5s ease infinite;
    }
    .gradient-text-fast {
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6, #38bdf8);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-pan 3s linear infinite;
    }

    /* ── CARD ENTRANCE ───────────────────────────────────────────── */
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    .card-enter { animation: card-enter 0.45s cubic-bezier(0.16,1,0.3,1) forwards; }

    /* ── GLASS CARD UPGRADE (Apple / Aviation Ops Console) ──────── */
    .atc-card {
      background: rgba(11, 19, 38, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border-radius: 20px !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif !important;
    }
    .atc-card::before {
      display: none !important;
    }
    .atc-card:hover {
      border-color: rgba(56, 189, 248, 0.3) !important;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
    }

    /* ── NEON TEXT ───────────────────────────────────────────────── */
    .neon-cyan  { color:#38bdf8; text-shadow:0 0 10px rgba(56,189,248,0.9),0 0 30px rgba(56,189,248,0.5); }
    .neon-red   { color:#ef5350; text-shadow:0 0 10px rgba(239,83,80,0.9), 0 0 30px rgba(239,83,80,0.5); }
    .neon-green { color:#4caf50; text-shadow:0 0 10px rgba(76,175,80,0.9), 0 0 30px rgba(76,175,80,0.4); }
    .neon-amber { color:#ffc107; text-shadow:0 0 10px rgba(255,193,7,0.9), 0 0 30px rgba(255,193,7,0.4); }

    /* ── NAV ACTIVE GLOW ─────────────────────────────────────────── */
    .nav-tab-active {
      color: #38bdf8 !important;
      text-shadow: 0 0 16px rgba(56,189,248,0.8);
      position: relative;
    }
    .nav-tab-active::after {
      content:'';
      position: absolute;
      bottom: -1px; left:0; right:0;
      height: 2px;
      background: linear-gradient(90deg,transparent,#38bdf8,#a78bfa,#38bdf8,transparent);
      background-size: 200% 100%;
      animation: border-sweep 2.5s ease infinite;
    }

    /* ── SCAN LINE ───────────────────────────────────────────────── */
    @keyframes scan {
      0%   { transform: translateY(-4px); opacity:0; }
      5%   { opacity:1; }
      95%  { opacity:0.4; }
      100% { transform: translateY(100vh); opacity:0; }
    }
    .scan-line {
      position: fixed;
      top:0; left:0; right:0;
      height: 1px;
      background: linear-gradient(90deg,transparent 0%,rgba(56,189,248,0.25) 30%,rgba(167,139,250,0.25) 70%,transparent 100%);
      pointer-events: none;
      z-index: 14;
      animation: scan 12s linear infinite;
    }

    /* ── SHIMMER ON HOVER ────────────────────────────────────────── */
    @keyframes shimmer-pass {
      from { transform: translateX(-200%); }
      to   { transform: translateX(200%); }
    }
    .shimmer-card { position:relative; overflow:hidden; }
    .shimmer-card::after {
      content:'';
      position:absolute;
      top:0; left:0;
      width:50%; height:100%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);
      transform: translateX(-200%);
      pointer-events: none;
    }
    .shimmer-card:hover::after { animation: shimmer-pass 0.7s ease; }

    /* ── ALERT PULSE ─────────────────────────────────────────────── */
    @keyframes alert-glow {
      0%,100% { box-shadow:0 0 20px rgba(239,83,80,0.3); }
      50%      { box-shadow:0 0 60px rgba(239,83,80,0.7),0 0 120px rgba(239,83,80,0.2); }
    }
    .alert-glow-card { animation: alert-glow 2s ease-in-out infinite; }

    /* ── FLOATING ────────────────────────────────────────────────── */
    @keyframes float-gentle {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .float-gentle { animation: float-gentle 4s ease-in-out infinite; }

    /* ── HEADER GRADIENT BORDER ──────────────────────────────────── */
    .header-gradient-border {
      background: linear-gradient(90deg,rgba(56,189,248,0.12),rgba(139,92,246,0.08),rgba(56,189,248,0.12)) !important;
      background-size: 200% 100%;
      animation: border-sweep 6s ease infinite;
    }

    /* ── PARTICLE CANVAS ─────────────────────────────────────────── */
    #csir-particles {
      position: fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      pointer-events: none;
      z-index: 3;
      opacity: 0.55;
    }

    /* ── PAGE GRID TEXTURE (Clean dark canvas) ────────────────────── */
    .page-grid-bg {
      background-color: #070b16 !important;
      background-image: none !important;
      position: relative;
      z-index: 10;
    }

    /* ── PAGE HERO BANNER (Editorial Apple Style) ────────────────── */
    .page-hero-banner {
      position: relative;
      background: transparent !important;
      border: none !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 0 !important;
      padding: 10px 0 24px 0 !important;
      margin-bottom: 32px !important;
    }
    .page-hero-banner::before, .page-hero-banner::after {
      display: none !important;
    }
    .page-hero-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      color: #38bdf8 !important;
      text-shadow: none !important;
      margin-bottom: 6px !important;
    }
    .page-hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif !important;
      font-size: 28px !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      letter-spacing: -0.02em !important;
      text-transform: none !important;
      line-height: 1.2 !important;
      margin-bottom: 6px !important;
    }
    .page-hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif !important;
      font-size: 13px !important;
      color: #94a3b8 !important;
      line-height: 1.4 !important;
    }

    /* ── CONTENT SECTION DIVIDER ─────────────────────────────────── */
    .section-rule {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.18), transparent);
      margin: 4px 0;
    }

    /* ── STAT CHIP ───────────────────────────────────────────────── */
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: 1px solid rgba(56,189,248,0.25);
      background: rgba(56,189,248,0.08);
      color: #38bdf8;
    }


    /* == DARK MODE READABILITY FIXES =============================================== */
    /* Brighter muted text so nothing is invisible on dark background */
    .page-hero-sub { color: #8bb8d4 !important; }
    .bnav-btn { color: #8baabe !important; }

    /* Boost all very-faint inline cyan spans (header strips, nav group labels) */
    /* We target via a filter on the whole doc at full saturation */
    * { -webkit-font-smoothing: antialiased; }

    /* Slightly larger tiny fonts globally */
    body { font-size: 14px; }

    /* Old light-mode base rules removed — see DRIFT PREMIUM LIGHT MODE below */

    @keyframes lm-ambient-pulse {

    /* === BASE CANVAS === */

        radial-gradient(rgba(100, 116, 139, 0.12) 1px, transparent 1px) !important;
      background-size: auto, auto, 28px 28px !important;

    /* === HEADER === */

      background: rgba(250, 249, 247, 0.88) !important;
      backdrop-filter: blur(32px) saturate(1.8) !important;

      border-bottom: 1px solid rgba(209, 213, 219, 0.6) !important;
      box-shadow:
        0 1px 0 rgba(209, 213, 219, 0.8),
        0 4px 24px rgba(13, 17, 23, 0.04) !important;

      background: rgba(243, 242, 240, 0.85) !important;

    body.light-mode header button,
    body.light-mode header a {
      color: #374151 !important;

       in light mode instead of inheriting the generic header-button color above
       (which made unselected CB/FF unreadable against the dark pill track). */

      color: #4b5563 !important;

    }
    body.light-mode .nav-tab-active { color: #4f46e5 !important; text-shadow: none !important; }
    body.light-mode .nav-tab-active::after {
      background: linear-gradient(90deg, transparent, #4f46e5, #06b6d4, #4f46e5, transparent) !important;
    }

    /* === PAGE TITLE TYPOGRAPHY === */
    .page-hero-title { color: #f8fafc; }
    .page-hero-sub   { color: #94a3b8; }

    body.light-mode .page-hero-title,
    body.light-mode h1,
    body.light-mode h2,
    body.light-mode h3,
    body.light-mode h4,

    body.light-mode h6 {
      color: #0d1117 !important;
    }
    body.light-mode .page-hero-sub { color: #4b5563 !important; }

    /* === EDITORIAL DASHBOARD HERO === */

    body.light-mode .drift-hero-section {
      background: linear-gradient(160deg,
        #faf9f7 0%,
        #f5f3ef 40%,
        #eef4fb 80%,
        #e8f2fb 100%
      ) !important;
      border-bottom: 1px solid rgba(209, 213, 219, 0.7) !important;
    }
    body.light-mode .drift-hero-title { color: #0d1117 !important; text-shadow: none !important; }
    body.light-mode .drift-hero-sub   { color: #4b5563 !important; }

    /* Telemetry Quick-Bar cards */
    body.light-mode .drift-telemetry-card {
      background: rgba(255, 255, 255, 0.9) !important;
      border: 1px solid rgba(209, 213, 219, 0.8) !important;
      box-shadow:
        0 1px 2px rgba(13, 17, 23, 0.04),
        0 4px 16px rgba(13, 17, 23, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.9) !important;
      color: #0d1117 !important;
    }
    body.light-mode .drift-telemetry-card [style*="color: #f8fafc"] { color: #0d1117 !important; }
    body.light-mode .drift-telemetry-card [style*="color: #94a3b8"] { color: #6b7280 !important; }

    /* === CARDS, PANELS, MODALS === */

    body.light-mode .slot-card,
    body.light-mode .shimmer-card,
    body.light-mode #main-content-area [class*="rounded-2xl"],
    body.light-mode #main-content-area [class*="rounded-xl"],
    body.light-mode [class*="0c1326"],
    body.light-mode [class*="080d1a"],
    body.light-mode [class*="0b1328"],
    body.light-mode [class*="050811"],
    body.light-mode [class*="020409"],
    body.light-mode [class*="0f1b35"],
    body.light-mode [class*="040711"],
    body.light-mode [class*="060a14"],
    body.light-mode [class*="070c18"],
    body.light-mode [class*="slate-950"],
    body.light-mode [class*="slate-900"],
    body.light-mode [class*="slate-850"] {
      background: rgba(255, 255, 255, 0.92) !important;
      backdrop-filter: blur(20px) saturate(1.5) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.5) !important;
      border: 1px solid rgba(209, 213, 219, 0.7) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 4px 6px -1px rgba(13, 17, 23, 0.04),
        0 10px 28px -4px rgba(13, 17, 23, 0.07) !important;
      color: #0d1117 !important;
    }
    body.light-mode .atc-card::before { background: none !important; }
    body.light-mode .atc-card:hover,
    body.light-mode .slot-card:hover {
      border-color: rgba(99, 102, 241, 0.4) !important;

    // --- ANIMATED NUMBER COMPONENT ---
    function AnimatedNumber({ value, decimals = 1, suffix = '' }) {
      const [displayValue, setDisplayValue] = useState(0);
      useEffect(() => {
        let start = null;
        const target = parseFloat(value);
        function update(now) {
          if (!start) start = now;
          const progress = Math.min((now - start) / 1200, 1);
          setDisplayValue((1 - Math.pow(1 - progress, 3)) * target);
          if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
      }, [value]);
      return <span className="font-mono">{displayValue.toFixed(decimals)}{suffix}</span>;
    }

    // ── PARTICLE FIELD ────────────────────────────────────────────────────────
    function ParticleField({ alertActive }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let raf;
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);

        // Create particles
        const N = 70;
        const particles = Array.from({ length: N }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.4 + 0.3,
          vx: (Math.random() - 0.5) * 0.18,
          vy: -(Math.random() * 0.25 + 0.05),
          opacity: Math.random() * 0.6 + 0.15,
          pulse: Math.random() * Math.PI * 2,
          pulseSpeed: Math.random() * 0.015 + 0.005,
        }));

        // lightning streaks
        let streaks = [];
        let streakTimer = 0;

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const isAlert = alertActive;
          const baseColor = isAlert ? '239,83,80' : '56,189,248';
          const accentColor = isAlert ? '255,152,0' : '167,139,250';

          particles.forEach(p => {
            p.pulse += p.pulseSpeed;
            const alpha = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));
            p.x += p.vx; p.y += p.vy;
            if (p.y < -4) { p.y = canvas.height + 4; p.x = Math.random() * canvas.width; }
            if (p.x < -4) p.x = canvas.width + 4;
            if (p.x > canvas.width + 4) p.x = -4;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
            grad.addColorStop(0, `rgba(${baseColor},${alpha})`);
            grad.addColorStop(1, `rgba(${baseColor},0)`);
            ctx.fillStyle = grad;
            ctx.fill();
          });

          // Rare connecting lines between close particles
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < 90) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(${accentColor},${0.06 * (1 - dist/90)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }

          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
      }, [alertActive]);

      return <canvas id="csir-particles" ref={canvasRef} />;
    }

    function CircularArcGauge({ probability, threshold = 0.34, size = 110 }) {
      const strokeWidth = 9;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const maxSweep = 270;
      const strokeDashArray = `${(maxSweep / 360) * circumference} ${circumference}`;
      const fillOffset = (1 - Math.min(Math.max(probability, 0), 1)) * ((maxSweep / 360) * circumference);

      return (
        <div className="relative flex items-center justify-center mx-auto" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform rotate-[135deg]">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="#172338" strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} fill="transparent" strokeLinecap="round" />
            <circle cx={size / 2} cy={size / 2} r={radius} stroke={probability >= 0.3 ? '#ef5350' : '#4caf50'} strokeWidth={strokeWidth} strokeDasharray={strokeDashArray} strokeDashoffset={fillOffset} strokeLinecap="round" fill="transparent" style={{ transition: 'stroke-dashoffset 1s ease-out' }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="font-mono text-xl font-extrabold text-white">

              THRESH: {(threshold * 100).toFixed(0)}%

          </div>
        </div>
      );

  const v = window.__SIH_VERIFICATION__ || {};

  const brier = v.brier != null ? v.brier.toFixed(3) : '--';
  const n    = v.n_days || 30;

  const chips = [
    { label: 'POD',   val: pod,   good: v.pod > 0.5,   tooltip: 'Probability of Detection -- fraction of real storms caught' },
    { label: 'FAR',   val: far,   good: v.far < 0.4,   invert: true, tooltip: 'False Alarm Ratio -- lower is better' },
    { label: 'CSI',   val: csi,   good: v.csi > 0.3,   tooltip: 'Critical Success Index -- combined hit/miss/FA score' },
    { label: 'Brier', val: brier, good: v.brier < 0.1, invert: true, tooltip: 'Brier Score -- probability calibration error (lower=better)' },

function CTTTrendCard({ liveData }) {
  const sat   = liveData?.satellite?.himawari9 || {};
  const hist  = liveData?.satellite?.history   || [];
  const bt    = sat.vobl_bt_celsius;
  const minBT = sat.min_bt_50km;
  const trend = sat.bt_trend_1h;
  const ts    = sat.storm_detected;
  const cold  = sat.cold_pixels_count ?? 0;

  // Derive CTT drop rate from last two history entries
  let dropRate = liveData?.met_parameters?.ctt_drop_rate_c_per_h;
  if (dropRate == null && hist.length >= 2) {
    const last = hist[hist.length - 1];
    const prev = hist[hist.length - 2];
    if (last.vobl_bt_celsius != null && prev.vobl_bt_celsius != null) {
      const dtH = (new Date(last.timestamp_utc) - new Date(prev.timestamp_utc)) / 3600000;
      if (dtH > 0) dropRate = (last.vobl_bt_celsius - prev.vobl_bt_celsius) / dtH;
    }
  }

  const dropColor  = dropRate == null ? '#607d8b'
    : dropRate < -10 ? '#ef5350'
    : dropRate < -4  ? '#ff9800'
    : '#4caf50';
  const dropLabel  = dropRate == null ? 'N/A'
    : (dropRate < 0 ? '' : '+') + dropRate.toFixed(1) + ' °C/h';
  const dropDesc   = dropRate == null ? 'No trend data'
    : dropRate < -10 ? 'Explosive updraft -- severe TS'
    : dropRate < -4  ? 'Rapid cooling -- developing storm'
    : dropRate < 0   ? 'Slow cooling -- weakening cell'
    : 'Warming -- storm dissipating';

  return (
    <div className="atc-card rounded-2xl p-4 font-mono" style={{ minWidth: 0 }}>
      <div className="text-[11px] font-bold text-white uppercase tracking-wider mb-3 flex items-center gap-1.5 flex-wrap" style={{rowGap:'2px'}}>
        <span style={{ color: '#38bdf8' }}>🛰</span><span>CLOUD TOP TEMP</span>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <div className="text-[11px] text-[#607d8b] uppercase mb-1">VOBL BT</div>
          <div className="text-xl font-extrabold" style={{ color: bt != null && bt < -40 ? '#ef5350' : '#e8eaf6' }}>
            {bt != null ? bt.toFixed(1) + '°C' : '--'}
          </div>
        </div>
        <div>
          <div className="text-[11px] text-[#607d8b] uppercase mb-1">MIN BT (50km)</div>
          <div className="text-xl font-extrabold" style={{ color: minBT != null && minBT < -40 ? '#ef5350' : '#ffc107' }}>
            {minBT != null ? minBT.toFixed(1) + '°C' : '--'}
          </div>
        </div>
        <div>
          <div className="text-[11px] text-[#607d8b] uppercase mb-1">CTT DROP RATE</div>
          <div className="text-lg font-extrabold" style={{ color: dropColor }}>{dropLabel}</div>
          <div className="text-[11px] mt-0.5" style={{ color: dropColor }}>{dropDesc}</div>
        </div>
        <div>
          <div className="text-[11px] text-[#607d8b] uppercase mb-1">COLD PIXELS</div>
          <div className="text-lg font-extrabold" style={{ color: cold > 100 ? '#ef5350' : cold > 20 ? '#ff9800' : '#e8eaf6' }}>
            {cold}
          </div>
          <div className="text-[11px] text-[#607d8b]">&lt;{sat.threshold_celsius ?? -40}°C threshold</div>
        </div>
      </div>
      {ts && (
        <div className="mt-3 px-2 py-1 rounded text-[11px] font-bold"
          style={{ background: 'rgba(239,83,80,0.12)', border: '1px solid rgba(239,83,80,0.3)', color: '#ef5350' }}>
          ⚡ STORM DETECTED -- Himawari-9 Band 13
        </div>
      )}

  );

function SHAPWaterfallCard({ shapData, slotIdx }) {
  if (!shapData) return null;
  const slotKey = String(slotIdx ?? 2);
  const entry   = shapData[slotKey];
  if (!entry) return null;

  const features = [...(entry.top_features || [])]
    .sort((a, b) => Math.abs(b.shap) - Math.abs(a.shap))
    .slice(0, 10);

  const maxAbs = Math.max(...features.map(f => Math.abs(f.shap)), 0.01);
  const baseVal = entry.base_value ?? 0;
  const prob    = entry.prob ?? 0;
  const slotNames = ['Late Night', 'Morning', 'Afternoon', 'Evening'];

  const FEATURE_LABELS = {
    CAPE: 'CAPE (J/kg)', K_INDEX: 'K-Index', LIFTED_INDEX: 'Lifted Index',
    TOTALS_TOTALS: 'Total-Totals', PRECIP_WATER: 'Precipitable Water',
    ERA5_T2M: 'Surface Temp (ERA5)', ERA5_u_850hPa: 'U-wind 850hPa',
    ERA5_v_850hPa: 'V-wind 850hPa', ERA5_CAPE: 'CAPE (ERA5)',
    ERA5_SP: 'Surface Pressure', RF: 'Rainfall (obs)',
    rf_std_7d: 'Rainfall StdDev 7d', LABEL_lag1: 'TS Yesterday',
    cape_x_kindex: 'CAPE × K-Index', MIN: 'Min Temp', MAX: 'Max Temp',
    MIN_lag1: 'Min Temp (lag1)', MIN_3d_avg: 'Min Temp (3d avg)',
    MAX_3d_avg: 'Max Temp (3d avg)', EVP: 'Evaporation', SSH: 'Sunshine Hours',
    DOY_sin: 'Day-of-Year (sin)', doy_sin: 'Day-of-Year (sin)',
    DRNRF: 'Dry days (no rain)', wet_bulb_potential_temp: 'Wet Bulb Theta',
    ts_any_yesterday: 'TS any slot yesterday', slot_month_clim: 'Monthly climatology',
    lapse_rate_850_500: 'Lapse rate 850-500hPa', RF_3d: 'Rainfall (3d)',
    ERA5_v_700hPa: 'V-wind 700hPa', ERA5_t_500hPa: 'Temp 500hPa (ERA5)',
    srh_0_3km: 'Storm Rel. Helicity',
  };

  return (
    <div className="atc-card rounded-2xl p-4 font-mono">
      <div className="text-[11px] font-bold text-white uppercase tracking-wider mb-1 flex items-center justify-between">
        <span>SHAP WATERFALL -- SLOT {slotIdx} ({slotNames[slotIdx] || ''})</span>
        <span className="text-[11px]" style={{ color: prob >= 0.3 ? '#ef5350' : '#4caf50' }}>
          Final prob: {(prob * 100).toFixed(1)}%
        </span>
      </div>
      <div className="text-[11px] text-[#607d8b] mb-3">
        Base: {baseVal.toFixed(3)} (log-odds) → each bar shows how much a feature pushed the prediction up or down
      </div>

      <div className="space-y-1.5">
        {features.map((f, i) => {
          const isUp  = f.shap > 0;
          const pct   = (Math.abs(f.shap) / maxAbs) * 100;
          const color = isUp ? '#ef5350' : '#4caf50';
          const label = FEATURE_LABELS[f.feature] || f.feature;
          const valFmt = Math.abs(f.value) > 1000
            ? f.value.toExponential(2)
            : typeof f.value === 'number' ? f.value.toFixed(2) : f.value;

          return (
            <div key={i} className="flex items-center gap-2">

function injectIWVTendencyLayer(map, liveData) {
  const history = liveData?.satellite?.history || [];
  // Always register a no-op toggle so the button doesn't silently fail
  window.__IWV_TOGGLE__ = () => {};
  if (history.length < 2) return;

  // Build tendency frames from BT history (cooler BT = more cloud moisture)
  // We encode IWV tendency as darkening/intensifying of the heatmap center
  const frames = history.slice(-6).map((h, i, arr) => {
    const bt    = h.min_bt_50km ?? 0;
    const prev  = i > 0 ? (arr[i-1].min_bt_50km ?? bt) : bt;
    const trend = bt - prev;               // negative = cooling = IWV rising
    const intensity = Math.min(1, Math.max(0, (-bt) / 70)); // 0 to 1
    const tendency  = Math.min(1, Math.max(0, (-trend) / 20));
    return { timestamp: h.timestamp_ist, intensity, tendency, cold_pixels: h.cold_pixels_count ?? 0 };
  });

  let frameIdx = 0;
  let animTimer = null;

  const sourceId = 'iwv-tendency-src';
  const layerId  = 'iwv-tendency-layer';

  // Add a heatmap layer that pulses with each frame
  const buildGeoJSON = (frame) => {
    const features = [];
    const lat0 = 13.1979, lon0 = 77.7063;
    const sigma = 12 + frame.tendency * 20;  // tighter when tendency high
    for (let dlat = -0.6; dlat <= 0.6; dlat += 0.05) {
      for (let dlon = -0.6; dlon <= 0.6; dlon += 0.05) {
        const lat = lat0 + dlat, lon = lon0 + dlon;
        const dist = Math.sqrt(dlat**2 + dlon**2) * 111;
        const v = frame.intensity * Math.exp(-(dist**2) / (2 * sigma**2));
        if (v > 0.05) features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [lon, lat] },
          properties: { weight: v * (1 + frame.tendency) }
        });
      }
    }
    return { type: 'FeatureCollection', features };
  };

  try {
    if (map.getSource(sourceId)) map.removeLayer(layerId), map.removeSource(sourceId);
    map.addSource(sourceId, { type: 'geojson', data: buildGeoJSON(frames[0]) });
    map.addLayer({
      id: layerId, type: 'heatmap', source: sourceId,
      layout: { visibility: 'none' },  // starts hidden; toggle button below shows it
      paint: {
        'heatmap-weight': ['get', 'weight'],
        'heatmap-intensity': 2.5,
        'heatmap-color': [
          'interpolate', ['linear'], ['heatmap-density'],
          0, 'rgba(0,0,0,0)',
          0.2, 'rgba(0,100,255,0.3)',
          0.5, 'rgba(0,200,255,0.55)',
          0.8, 'rgba(100,255,200,0.72)',
          1,   'rgba(255,255,100,0.88)',
        ],
        'heatmap-radius': 30,
        'heatmap-opacity': 0.75,
      },
    });

    // Animate frames every 600ms when layer is visible, with safe styleLoaded check
    if (window.__iwvAnimTimer__) {
      clearInterval(window.__iwvAnimTimer__);
      window.__iwvAnimTimer__ = null;
    }
    window.__iwvAnimTimer__ = setInterval(() => {
      try {
        if (!map || !map.isStyleLoaded || !map.isStyleLoaded()) return;
        if (!map.getLayer(layerId)) {
          clearInterval(window.__iwvAnimTimer__);
          window.__iwvAnimTimer__ = null;
          return;
        }
        const vis = map.getLayoutProperty(layerId, 'visibility');
        if (vis !== 'visible') return;
        frameIdx = (frameIdx + 1) % frames.length;
        map.getSource(sourceId)?.setData(buildGeoJSON(frames[frameIdx]));
      } catch(e) {}
    }, 600);

    // Expose toggle for the IWV button with styleLoaded check
    window.__IWV_TOGGLE__ = () => {
      try {
        if (!map || !map.isStyleLoaded || !map.isStyleLoaded() || !map.getLayer(layerId)) return;
        const vis = map.getLayoutProperty(layerId, 'visibility');
        map.setLayoutProperty(layerId, 'visibility', vis === 'visible' ? 'none' : 'visible');
      } catch(e) {}
    };
    window.__IWV_FRAME_META__ = frames;
  } catch(e) { console.warn('[IWV layer]', e); }
}

function injectDrainageOverlay(map, liveData) {
  const zones = liveData?.terrain?.high_risk_zones || [];
  const ffSlots = liveData?.hazard_summary?.flash_flood?.slots || {};
  const maxFF = Math.max(...Object.values(ffSlots).map(Number), 0);

  // Always register a no-op toggle so the button doesn't silently fail
  window.__DRAINAGE_TOGGLE__ = () => {};
  if (zones.length === 0) return;

  const features = zones.map(z => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [z.lon, z.lat] },
    properties: {
      susceptibility: z.flood_susceptibility ?? 0.5,
      elevation_m: z.elevation_m ?? 0,
      slope_deg: z.slope_deg ?? 0,
      risk: maxFF > 0 ? maxFF * z.flood_susceptibility : 0,
    }
  }));

  const lineFeatures = [];
  // Connect zones to nearest downstream zone (simple southward flow proxy)
  const sorted = [...zones].sort((a, b) => b.lat - a.lat);
  for (let i = 0; i < sorted.length - 1 && i < 5; i++) {
    lineFeatures.push({
      type: 'Feature',
      geometry: {
        type: 'LineString',
        coordinates: [
          [sorted[i].lon, sorted[i].lat],
          [sorted[i+1].lon, sorted[i+1].lat],
        ]
      },
      properties: { susceptibility: (sorted[i].flood_susceptibility + sorted[i+1].flood_susceptibility) / 2 }
    });
  }

  try {
    map.addSource('drainage-src', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [...features, ...lineFeatures] }
    });

    // Drainage path lines
    map.addLayer({
      id: 'drainage-lines', type: 'line', source: 'drainage-src',
      filter: ['==', '$type', 'LineString'],
      layout: { visibility: 'none', 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color': ['interpolate', ['linear'], ['get', 'susceptibility'],
          0.5, '#ffc107', 0.8, '#ff5722', 1.0, '#ef5350'],
        'line-width': 2.5,
        'line-opacity': 0.8,
        'line-dasharray': [3, 2],
      }
    });

    // High-risk zone circles
    map.addLayer({
      id: 'drainage-circles', type: 'circle', source: 'drainage-src',
      filter: ['==', '$type', 'Point'],
      layout: { visibility: 'none' },
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['get', 'susceptibility'], 0.5, 6, 1.0, 12],
        'circle-color': ['interpolate', ['linear'], ['get', 'susceptibility'],
          0.5, '#ffc107', 0.8, '#ff5722', 1.0, '#ef5350'],
        'circle-opacity': 0.85,
        'circle-stroke-width': 1.5,
        'circle-stroke-color': 'rgba(239,83,80,0.5)',
      }
    });

    // Expose toggle with safe styleLoaded check
    window.__DRAINAGE_TOGGLE__ = () => {
      try {
        if (!map || !map.isStyleLoaded || !map.isStyleLoaded()) return;
        ['drainage-lines', 'drainage-circles'].forEach(id => {
          if (!map.getLayer(id)) return;
          const vis = map.getLayoutProperty(id, 'visibility');
          map.setLayoutProperty(id, 'visibility', vis === 'visible' ? 'none' : 'visible');
        });
      } catch(e) {}
    };
  } catch(e) { console.warn('[drainage overlay]', e); }
}

    const VOBL = { lng: 77.7063, lat: 13.1979 };
    const BLR_CLIM_ZONES = [
      { name: 'Airport (VOBL)', lat: 13.1979, lng: 77.7063, factor: 1.00 },
      { name: 'Yelahanka', lat: 13.10, lng: 77.60, factor: 0.88 },
      { name: 'Hebbal', lat: 13.035, lng: 77.59, factor: 0.84 },
      { name: 'Whitefield', lat: 12.966, lng: 77.750, factor: 0.79 },
      { name: 'Electronic City', lat: 12.845, lng: 77.660, factor: 0.74 },
      { name: 'Bannerghatta', lat: 12.80, lng: 77.575, factor: 0.81 },
      { name: 'Jayanagar', lat: 12.925, lng: 77.583, factor: 0.82 },
      { name: 'Koramangala', lat: 12.934, lng: 77.624, factor: 0.80 },
      { name: 'Indiranagar', lat: 12.978, lng: 77.641, factor: 0.83 },
      { name: 'MG Road', lat: 12.975, lng: 77.607, factor: 0.80 },
      { name: 'Rajajinagar', lat: 12.992, lng: 77.553, factor: 0.78 },
      { name: 'Marathahalli', lat: 12.956, lng: 77.701, factor: 0.82 },
      { name: 'Devanahalli', lat: 13.248, lng: 77.712, factor: 0.91 },
    ];

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function buildHeatmapGeoJSON(peakProb) {
      const features = [];
      const sigma = 18;
      for (let lat = 12.72; lat <= 13.55; lat += 0.035) {
        for (let lng = 77.25; lng <= 78.05; lng += 0.035) {
          const dist = haversineKm(lat, lng, VOBL.lat, VOBL.lng);
          let zoneFactor = 0.72;
          let minDist = Infinity;
          for (const z of BLR_CLIM_ZONES) {
            const d = haversineKm(lat, lng, z.lat, z.lng);
            if (d < minDist) { minDist = d; zoneFactor = z.factor; }
          }
          const intensity = peakProb * Math.exp(-(dist * dist) / (2 * sigma * sigma)) * zoneFactor;
          if (intensity >= 0.015) {
            features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] }, properties: { intensity } });
          }
        }
      }
      return { type: 'FeatureCollection', features };
    }

          // Add range rings at 50/100/150/200 km centred on VOBL

          };
          const ringFeatures = [50, 100, 150, 200].map(r => makeRingGeoJSON(VOBL.lng, VOBL.lat, r));
          map.addSource('range-rings', { type: 'geojson', data: { type: 'FeatureCollection', features: ringFeatures } });
          map.addLayer({ id: 'range-rings-layer', type: 'line', source: 'range-rings', paint: {

          // Range ring labels

          }, paint: { 'text-color': 'rgba(56,189,248,0.55)', 'text-halo-color': 'rgba(0,0,0,0.6)', 'text-halo-width': 1 }});

          // Pan-India multi-hazard grid layer

          map.addLayer({

          // ── Hazard-specific atmospheric overlays ─────────────────────────────────

          // TS: convective instability (electric purple->yellow representing CAPE zones)
          // CB: moisture concentration (deep indigo->cyan representing IWV pooling)
          (function buildHazardOverlays() {
            const BBOX_W = 76.0, BBOX_E = 79.5, BBOX_S = 11.5, BBOX_N = 15.0; // BLR region
            const CW = 512, CH = 512;

            // Helper: add a canvas image layer
            function addCanvasLayer(id, canvasData, sourceId) {

            // ── FF overlay: SRTM terrain flood susceptibility ──────────────────────
            fetch('data/blr_terrain.json?v=1')
              .then(r => r.ok ? r.json() : null)
              .then(terrain => {
                if (!terrain || !terrain.grid || terrain.grid.length === 0) return;
                const canvas = document.createElement('canvas');
                canvas.width = CW; canvas.height = CH;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(CW, CH);
                const lookup = {};
                terrain.grid.forEach(pt => {
                  lookup[Math.round(pt.lat*100) + ',' + Math.round(pt.lon*100)] = pt.flood_susceptibility;
                });
                for (let py = 0; py < CH; py++) {
                  for (let px = 0; px < CW; px++) {
                    const lon = BBOX_W + (px/(CW-1))*(BBOX_E-BBOX_W);
                    const lat = BBOX_N - (py/(CH-1))*(BBOX_N-BBOX_S);
                    const fs = lookup[Math.round(lat*100)+','+Math.round(lon*100)];
                    const idx = (py*CW+px)*4;
                    if (fs !== undefined && fs >= 0.30) {
                      // Deep blue -> electric cyan -> amber -> red (richer saturation)
                      let r, g, b;
                      if (fs < 0.50) {
                        const t = (fs-0.30)/0.20;
                        r=Math.round(0); g=Math.round(30+80*t); b=Math.round(255);
                      } else if (fs < 0.65) {
                        const t = (fs-0.50)/0.15;
                        r=Math.round(0+20*t); g=Math.round(110+120*t); b=Math.round(255-30*t);
                      } else if (fs < 0.80) {
                        const t = (fs-0.65)/0.15;
                        r=Math.round(20+235*t); g=Math.round(230-80*t); b=Math.round(225-225*t);
                      } else {
                        const t = (fs-0.80)/0.20;
                        r=255; g=Math.round(150-150*t); b=0;
                      }
                      imgData.data[idx]=r; imgData.data[idx+1]=g; imgData.data[idx+2]=b;
                      imgData.data[idx+3]=Math.round(210*Math.pow((fs-0.30)/0.70, 0.55));
                    } else { imgData.data[idx+3]=0; }
                  }
                }
                ctx.putImageData(imgData, 0, 0);
                addCanvasLayer('flood-susc-overlay', canvas.toDataURL('image/png'), 'flood-susc-canvas');
              }).catch(()=>{});

            // ── TS overlay: rotating storm cell, legend-aligned colors ─────────────
            // TS overlay: proper storm cell drawn with canvas 2D API -- spiral arms + electric core
            (function buildTSOverlay() {
              return; // removed -- spiral graphic disabled
              const SRC = document.createElement('canvas');
              SRC.width = CW; SRC.height = CH;
              const srcCtx = SRC.getContext('2d');
              // Storm centre: BLR in all-India BBOX (68-98E, 6-37N)
              const cx = Math.round((77.59-BBOX_W)/(BBOX_E-BBOX_W)*CW); // ~164
              const cy = Math.round((BBOX_N-12.97)/(BBOX_N-BBOX_S)*CH); // ~397
              const R = 92; // ~5.5 degrees radius

              srcCtx.clearRect(0, 0, CW, CH);

              // Layer 1: wide faint outer envelope
              const env = srcCtx.createRadialGradient(cx, cy, R*0.45, cx, cy, R*1.05);
              env.addColorStop(0,    'rgba(140,0,220,0.38)');
              env.addColorStop(0.4,  'rgba(90,0,180,0.28)');
              env.addColorStop(0.75, 'rgba(40,0,100,0.14)');
              env.addColorStop(1.0,  'rgba(0,0,0,0)');
              srcCtx.fillStyle = env;
              srcCtx.beginPath(); srcCtx.arc(cx, cy, R*1.05, 0, Math.PI*2); srcCtx.fill();

              // Layer 2: mid rain-band ring (orange belt)
              const band = srcCtx.createRadialGradient(cx, cy, R*0.38, cx, cy, R*0.72);
              band.addColorStop(0,   'rgba(255,120,0,0.0)');
              band.addColorStop(0.3, 'rgba(255,100,0,0.50)');
              band.addColorStop(0.6, 'rgba(220,60,0,0.42)');
              band.addColorStop(1.0, 'rgba(160,20,120,0.0)');
              srcCtx.fillStyle = band;
              srcCtx.beginPath(); srcCtx.arc(cx, cy, R*0.72, 0, Math.PI*2); srcCtx.fill();

              // Layer 3: hot inner core
              const core = srcCtx.createRadialGradient(cx, cy, 0, cx, cy, R*0.38);
              core.addColorStop(0,   'rgba(255,255,240,0.98)');
              core.addColorStop(0.18,'rgba(255,220,60,0.90)');
              core.addColorStop(0.38,'rgba(255,80,0,0.78)');
              core.addColorStop(0.65,'rgba(180,0,60,0.45)');
              core.addColorStop(1.0, 'rgba(0,0,0,0)');
              srcCtx.fillStyle = core;
              srcCtx.beginPath(); srcCtx.arc(cx, cy, R*0.38, 0, Math.PI*2); srcCtx.fill();

              // Layer 4: three spiral arms (drawn as thick arcs with gradient alpha)
              for (let arm = 0; arm < 3; arm++) {
                const baseA = (arm/3)*Math.PI*2;
                srcCtx.beginPath();
                let first = true;
                for (let t = 0.08; t <= 1.0; t += 0.008) {
                  const r2 = t * R * 0.95;
                  const a2 = baseA - t * Math.PI * 1.75;
                  const px2 = cx + r2*Math.cos(a2), py2 = cy + r2*Math.sin(a2);
                  if (first) { srcCtx.moveTo(px2, py2); first = false; }
                  else srcCtx.lineTo(px2, py2);
                }
                const alpha = 0.68 - arm*0.12;
                srcCtx.strokeStyle = `rgba(255,210,40,${alpha})`;
                srcCtx.lineWidth = 5 - arm*1.2;
                srcCtx.lineCap = 'round';
                srcCtx.shadowColor = 'rgba(255,200,0,0.6)';
                srcCtx.shadowBlur = 8;
                srcCtx.stroke();
                srcCtx.shadowBlur = 0;
              }

              // Layer 5: bright eye dot
              const eye = srcCtx.createRadialGradient(cx, cy, 0, cx, cy, R*0.07);
              eye.addColorStop(0,   'rgba(255,255,255,1.0)');
              eye.addColorStop(0.6, 'rgba(200,230,255,0.7)');
              eye.addColorStop(1.0, 'rgba(0,0,0,0)');
              srcCtx.fillStyle = eye;
              srcCtx.beginPath(); srcCtx.arc(cx, cy, R*0.07, 0, Math.PI*2); srcCtx.fill();

              // Animate: rotate spiral arms anticlockwise (NH cyclone direction)
              const ANIM = document.createElement('canvas');
              ANIM.width = CW; ANIM.height = CH;
              const animCtx = ANIM.getContext('2d');
              let tsAngle = 0, tsTimer = null;
              function drawTSFrame() {
                tsAngle -= 0.011;
                animCtx.clearRect(0, 0, CW, CH);
                animCtx.save();
                animCtx.translate(cx, cy);
                animCtx.rotate(tsAngle);
                animCtx.translate(-cx, -cy);
                animCtx.drawImage(SRC, 0, 0);
                animCtx.restore();
                const flicker = 0.82 + 0.18 * Math.sin(tsAngle * 19);
                try {
                  if (map.getSource('ts-instability-canvas'))
                    map.getSource('ts-instability-canvas').updateImage({ url: ANIM.toDataURL('image/png') });
                  if (map.getLayer('ts-instability-overlay'))
                    map.setPaintProperty('ts-instability-overlay', 'raster-opacity', flicker);
                } catch(e) {}
              }
              animCtx.drawImage(SRC, 0, 0);
              addCanvasLayer('ts-instability-overlay', SRC.toDataURL('image/png'), 'ts-instability-canvas');
              if (!window._overlayAnims) window._overlayAnims = {};
              window._overlayAnims.startTS = () => { /* static - no spin */ };
              window._overlayAnims.stopTS = () => {};
            })();

            // ── CB overlay: scrolling cloud formations across the map ─────────────────
            // Pre-renders wide cloud texture, scrolls it eastward (~10fps)
            (function buildCBOverlay() {
              // Source canvas: 2x wide for seamless horizontal wrap
              const SRC = document.createElement('canvas');
              SRC.width = CW*2; SRC.height = CH;
              const srcCtx = SRC.getContext('2d');
              const srcImg = srcCtx.createImageData(CW*2, CH);
              // Cloud clusters -- spread across both tiles so scroll wraps seamlessly
              const clouds = [
                { px: 258, py: 180, rx: 100, ry: 68, angle: 0.3, str: 1.00 },
                { px: 68,  py: 155, rx: 55,  ry: 90, angle: 0.1, str: 0.82 },
                { px: 52,  py: 240, rx: 48,  ry: 80, angle: 0.0, str: 0.70 },
                { px: 148, py: 98,  rx: 85,  ry: 55, angle: 0.4, str: 0.75 },
                { px: 380, py: 130, rx: 70,  ry: 50, angle: 0.5, str: 0.68 },
                { px: 420, py: 250, rx: 75,  ry: 48, angle: 0.6, str: 0.60 },
                { px: 200, py: 320, rx: 80,  ry: 52, angle: 0.2, str: 0.65 },
                { px: 460, py: 80,  rx: 55,  ry: 40, angle: 0.7, str: 0.50 },
                { px: 30,  py: 330, rx: 45,  ry: 70, angle: 0.0, str: 0.55 },
                { px: 340, py: 330, rx: 60,  ry: 42, angle: 0.3, str: 0.48 },
                { px: 220, py: 55,  rx: 65,  ry: 40, angle: 0.5, str: 0.58 },
                { px: 460, py: 390, rx: 42,  ry: 30, angle: 0.8, str: 0.42 },
                { px: 110, py: 400, rx: 50,  ry: 35, angle: 0.1, str: 0.45 },
                { px: 300, py: 440, rx: 55,  ry: 32, angle: 0.4, str: 0.40 },
                { px: 170, py: 470, rx: 40,  ry: 28, angle: 0.2, str: 0.38 },
                // Second tile (offset by CW for wrapping)
                { px: 258+CW, py: 180, rx: 100, ry: 68, angle: 0.3, str: 1.00 },
                { px: 68+CW,  py: 155, rx: 55,  ry: 90, angle: 0.1, str: 0.82 },
                { px: 52+CW,  py: 240, rx: 48,  ry: 80, angle: 0.0, str: 0.70 },
                { px: 148+CW, py: 98,  rx: 85,  ry: 55, angle: 0.4, str: 0.75 },
                { px: 380+CW, py: 130, rx: 70,  ry: 50, angle: 0.5, str: 0.68 },
                { px: 420+CW, py: 250, rx: 75,  ry: 48, angle: 0.6, str: 0.60 },
                { px: 200+CW, py: 320, rx: 80,  ry: 52, angle: 0.2, str: 0.65 },
                { px: 110+CW, py: 400, rx: 50,  ry: 35, angle: 0.1, str: 0.45 },
                { px: 300+CW, py: 440, rx: 55,  ry: 32, angle: 0.4, str: 0.40 },
              ];
              for (let py2 = 0; py2 < CH; py2++) {
                for (let px2 = 0; px2 < CW*2; px2++) {
                  let field = 0;
                  clouds.forEach(c => {
                    const dx = px2-c.px, dy = py2-c.py;
                    const ca = Math.cos(c.angle), sa = Math.sin(c.angle);
                    const lx = dx*ca+dy*sa, ly = -dx*sa+dy*ca;
                    const ellD = Math.sqrt((lx/c.rx)*(lx/c.rx)+(ly/c.ry)*(ly/c.ry));
                    if (ellD < 1.0) {
                      const base = c.str * Math.exp(-ellD*ellD*2.0);
                      const rawA = Math.atan2(dy, dx);
                      const turbR = Math.sqrt(dx*dx+dy*dy);
                      const turb = 0.16 * Math.sin(rawA*8+turbR*0.10) * Math.cos(rawA*4+turbR*0.07);
                      field += base + turb*base;
                    }
                  });
                  field = Math.max(0, Math.min(1, field));
                  const idx = (py2*(CW*2)+px2)*4;
                  if (field > 0.07) {
                    let r, g, b;
                    if (field < 0.28) { const t=(field-0.07)/0.21; r=Math.round(18+28*t); g=Math.round(28+38*t); b=Math.round(55+65*t); }
                    else if (field < 0.62) { const t=(field-0.28)/0.34; r=Math.round(46+74*t); g=Math.round(66+80*t); b=Math.round(120+80*t); }
                    else { const t=(field-0.62)/0.38; r=Math.round(120+60*t); g=Math.round(146+54*t); b=Math.round(200+30*t); }
                    srcImg.data[idx]=r; srcImg.data[idx+1]=g; srcImg.data[idx+2]=b;
                    srcImg.data[idx+3]=Math.round(220*Math.pow(field, 0.38));
                  } else { srcImg.data[idx+3]=0; }
                }
              }
              srcCtx.putImageData(srcImg, 0, 0);
              // Animation canvas (512x512 window into the wide texture)
              const ANIM = document.createElement('canvas');
              ANIM.width = CW; ANIM.height = CH;
              const animCtx = ANIM.getContext('2d');
              let cbOffset = 0, cbTimer = null;
              function drawCBFrame() {
                if (!aliveRef.current) return;
                cbOffset = (cbOffset + 0.6) % CW; // drift ~0.6px per frame eastward
                animCtx.clearRect(0, 0, CW, CH);
                // Draw scrolled window from wide texture (wraps seamlessly)
                animCtx.drawImage(SRC, Math.floor(cbOffset), 0, CW, CH, 0, 0, CW, CH);
                try {
                  if (map.getSource('cb-moisture-canvas')) {
                    map.getSource('cb-moisture-canvas').updateImage({ url: ANIM.toDataURL('image/png') });
                  }
                } catch(e) {}
              }
              // Initial frame
              animCtx.drawImage(SRC, 0, 0, CW, CH, 0, 0, CW, CH);
              addCanvasLayer('cb-moisture-overlay', ANIM.toDataURL('image/png'), 'cb-moisture-canvas');
              if (!window._overlayAnims) window._overlayAnims = {};
              window._overlayAnims.startCB = () => { if (!cbTimer) cbTimer = setInterval(drawCBFrame, 100); };
              window._overlayAnims.stopCB = () => { clearInterval(cbTimer); cbTimer = null; };
            })();
          })();

          // Load pan-India grid data.
          // Phase B (single source of truth): d.forecasts[] is the actual
          // source of truth -- each entry is one explicit forecast horizon
          // (fetch_status ok/unavailable, forecast_lead_hours, is_primary,
          // forecast_valid_at_utc, time_until_valid_hours). The flat
          // top-level fields (d.grid_cells, d.gfs_fhour, ...) are a
          // COMPATIBILITY MIRROR ONLY, kept for older consumers -- this code
          // now reads forecasts[] directly and picks the PRIMARY forecast
          // (is_primary === true) explicitly, rather than trusting whichever
          // lead the mirror happened to contain. If the primary forecast is
          // unavailable, that is shown as an explicit unavailable state, not
          // silently swapped for a different lead.
          fetch('data/pan_india_grid.json?' + Date.now())
            .then(r => r.json())
            .then(d => {
              const forecasts = Array.isArray(d.forecasts) ? d.forecasts : [];
              const primary = forecasts.find(f => f.is_primary) || null;
              const usable = (primary && primary.fetch_status === 'ok') ? primary
                            : forecasts.find(f => f.fetch_status === 'ok') || null;

              // Fallback to top-level grid_cells if forecasts[] is not present in artifact
              const cells = (usable && usable.grid_cells && usable.grid_cells.length > 0)
                ? usable.grid_cells
                : (Array.isArray(d.grid_cells) && d.grid_cells.length > 0 ? d.grid_cells : null);

              if (!cells || cells.length === 0) {
                gridMetaRef.current = { ...gridMetaRef.current, forecast_unavailable: true };
                setGridMeta(gridMetaRef.current);
                return;
              }
              gridCellsRef.current = cells;
              gridMetaRef.current = {
                generated_at_utc: d.generated_at_utc,
                gfs_cycle_init_utc: (usable && usable.gfs_cycle_init_utc) || d.gfs_cycle_init_utc || d.gfs_cycle,
                gfs_cycle: d.gfs_cycle,
                gfs_fhour: usable ? usable.forecast_lead_hours : (d.gfs_fhour ?? 0),
                is_primary_forecast: usable ? (usable.is_primary === true) : true,
                forecast_valid_at_utc: usable ? usable.forecast_valid_at_utc : d.generated_at_utc,
                time_until_valid_hours: usable ? usable.time_until_valid_hours : 0,
                model_type: (usable && usable.model_type) || d.model_type || 'physics_baseline',
                grid_step_deg: d.grid_step_deg,
                forecast_unavailable: false,
              };
              setGridMeta(gridMetaRef.current);
              // Grid just finished loading -- refresh activeLocation's
              // architecture results for whatever location is currently
              // selected (initially VOBL/DEFAULT) now that pan-India data
              // actually exists to look up.
              if (window.DriftLocationEngine) {
                setActiveLocationFromCoords(activeLocation.latitude, activeLocation.longitude,
                                             activeLocation.displayName, activeLocation.selectionSource);
              }
              const STEP = 1.0;
              const features = [];
              // Grid cell squares removed -- canvas overlays handle all three hazards visually
              if (false) { // disabled
              ['flash_flood'].forEach(layer => {
                d.grid_cells.forEach(c => {
                  const prob = c[layer + '_probability'] ?? 0;
                  if (prob < 0.15) return;
                  const h = STEP / 2;
                  features.push({
                    type: 'Feature',
                    geometry: {
                      type: 'Polygon',
                      coordinates: [[
                        [c.lon - h, c.lat - h],
                        [c.lon + h, c.lat - h],
                        [c.lon + h, c.lat + h],
                        [c.lon - h, c.lat + h],
                        [c.lon - h, c.lat - h]
                      ]]
                    },
                    properties: { layer, prob }
                  });
                });
              });
              const src = map.getSource('pan-india-src');
              if (src) src.setData({ type: 'FeatureCollection', features });
              } // end disabled
            })
            .catch(() => {});

          // IWV tendency animation + drainage overlay
          injectIWVTendencyLayer(map, liveData);
          injectDrainageOverlay(map, liveData);

          map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
          map.resize();
          setMapReady(true);
        });
        // Fallback: if load event already fired or any step threw, idle guarantees the overlay clears
        map.on('idle', () => { if (aliveRef.current) setMapReady(true); });
        // Hard fallback after 5s regardless
        setTimeout(() => { if (aliveRef.current) setMapReady(true); }, 5000);
        return () => {
          // Flip the alive guard FIRST, synchronously, before anything else
          // in this cleanup runs. Every deferred callback above (the 'load'
          // handler if it hasn't fired yet, 'idle', the 5s setTimeout, and
          // the window._* bridges assigned inside 'load') checks this and
          // no-ops once it's false, so nothing scheduled before unmount can
          // touch the map/popup/sources this cleanup is about to destroy.
          aliveRef.current = false;
          if (voblPopupRef.current) {
            try { voblPopupRef.current.remove(); } catch(e) {}
            voblPopupRef.current = null;
          }
          if (window.__iwvAnimTimer__) {
            clearInterval(window.__iwvAnimTimer__);
            window.__iwvAnimTimer__ = null;
          }
          // Stop the CB canvas-overlay animation interval explicitly -- its
          // closure captures this map instance, and nothing else clears it
          // on unmount, so it would otherwise keep firing against a removed
          // map every 100ms (one of the sources of the stray
          // post-teardown maplibre exceptions this cleanup fixes).
          if (window._overlayAnims && window._overlayAnims.stopCB) {
            try { window._overlayAnims.stopCB(); } catch(e) {}
          }
          if (mapRef.current) {
            // Null the ref first so any effect reading mapRef.current during
            // or immediately after remove() sees it as gone rather than
            // racing against the teardown.
            mapRef.current = null;
            map.remove();
          }
        };
      }, []);

      // Re-inject IWV / drainage overlays when live data finally arrives
      React.useEffect(() => {
        const map = mapRef.current;
        if (!map || !mapReady || !liveData) return;
        injectIWVTendencyLayer(map, liveData);
        injectDrainageOverlay(map, liveData);
      }, [liveData, mapReady]);

      React.useEffect(() => {
        const map = mapRef.current;
        if (!map || !mapReady) return;
        let cancelled = false;
        // Root-cause fix for the repeated "Cannot read properties of
        // undefined (reading 'getLayer')" console exception: maplibre-gl
        // defers its actual style-diff/render work to the next animation
        // frame after setLayoutProperty() returns. If this component
        // re-renders (tab switch, fast state churn) and the map gets torn
        // down (map.remove()) before that deferred frame runs, maplibre's
        // own internal render step throws on the now-dead map -- from a
        // callback outside any try/catch we can wrap. Deferring our own
        // layer-visibility writes to the next frame via rAF, re-checking
        // map.style/isStyleLoaded() and a local `cancelled` flag at the
        // start of that frame (set by this effect's own cleanup), closes
        // the race: once cleanup has run we never issue the writes that
        // would otherwise queue a render against a removed map.
        const raf = requestAnimationFrame(() => {
          if (cancelled) return;
          try {
            if (!map.style || !map.isStyleLoaded || !map.isStyleLoaded()) return;
            const layers = ['pan-india-ts', 'pan-india-cb', 'pan-india-ff'];
            const active = { 'thunderstorm': 'pan-india-ts', 'cloudburst': 'pan-india-cb', 'flash_flood': 'pan-india-ff' };
            // 'all' shows every hazard fill layer at once instead of a single
            // exclusive layer -- purely a visibility union, no new data path
            // and no change to how any one layer's fill-color/probability is
            // computed.
            layers.forEach(l => {
              try {
                if (!map.style || !map.getLayer(l)) return;
                const visible = panLayer === 'all' ? true : l === active[panLayer];
                map.setLayoutProperty(l, 'visibility', visible ? 'visible' : 'none');
              } catch(e) {}
            });
            // Show hazard-specific atmospheric overlays
            [
              ['terrain-hillshade', panLayer === 'flash_flood' || panLayer === 'all'],
              ['flood-susc-overlay', panLayer === 'flash_flood' || panLayer === 'all'],
              ['ts-instability-overlay', panLayer === 'thunderstorm' || panLayer === 'all'],
              ['cb-moisture-overlay', panLayer === 'cloudburst' || panLayer === 'all'],
            ].forEach(([id, visible]) => {
              try {
                if (map.style && map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
              } catch(e) {}
            });
            // Start / stop canvas animations based on active overlay
            const anims = window._overlayAnims;
            if (anims) {
              if (panLayer === 'thunderstorm' || panLayer === 'all') { anims.startTS && anims.startTS(); } else { anims.stopTS && anims.stopTS(); }
              if (panLayer === 'cloudburst' || panLayer === 'all') { anims.startCB && anims.startCB(); } else { anims.stopCB && anims.stopCB(); }
            }
          } catch(e) {}
        });
        return () => { cancelled = true; cancelAnimationFrame(raf); };
      }, [panLayer, mapReady]);

      React.useEffect(() => {
        if (!mapRef.current || !mapReady) return;
        const src = mapRef.current.getSource('storm-heat');
        if (src) src.setData(buildHeatmapGeoJSON(peakProb));
      }, [peakProb, mapReady]);

      // Keep VOBL popup in sync with real forecast data
      React.useEffect(() => {
        if (!voblPopupRef.current || !mapReady) return;
        const color = alertActive ? '#ef5350' : peakProb >= 0.15 ? '#ffc107' : '#4caf50';
        voblPopupRef.current.setHTML(
          `<div style="font-family:monospace;font-size:11px;color:#38bdf8;background:rgba(4,7,17,0.95);padding:8px 12px;border-radius:10px;border:1px solid rgba(56,189,248,0.35);white-space:nowrap">✈ VOBL / Station 43295<br><span style="color:${color};font-size:10px">${riskLabel} RISK * ${(peakProb*100).toFixed(0)}%</span></div>`
        );
      }, [peakProb, alertActive, riskLabel, mapReady]);

      // ── Phase 13: editorial DRIFT identity, built only from real state ──
      // already computed above in this component: alertActive, riskLabel,
      // peakProb, genAt, hazardCfg, activeLocation. Nothing here invents a
      // threat -- the honest "no active warning" copy is the explicit
      // fallback when alertActive is false.
      const driftHeroHeadline = alertActive
        ? `${hazardCfg.label} risk\nover the next 2-6 hours.`
        : `India's weather,\ndown to the grid.`;
      const driftHeroSub = alertActive
        ? `${riskLabel} risk detected near ${activeLocation.displayName || 'your area'} * updated ${genAt}`
        : `No active severe-weather warning right now * updated ${genAt}`;

      return (
        <div className="drift-editorial" style={{ position: 'relative', width: '100%', height: '100%', minHeight: 0, background: '#060a14', overflowY: 'auto', overflowX: 'hidden', WebkitOverflowScrolling: 'touch', fontFamily: "-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" }}>
          <style>{`
            @keyframes driftFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes driftSheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            @keyframes driftPanelIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
            .drift-editorial { -webkit-font-smoothing: antialiased; }
            .drift-editorial ::-webkit-scrollbar { width: 5px; height: 5px; }
            .drift-editorial ::-webkit-scrollbar-track { background: #060a14; }
            .drift-editorial ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
            .drift-editorial ::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,0.4); }
          `}</style>

          {/* ── HERO SECTION (Editorial Aviation / Operations Console) ────────── */}
          <section className="drift-hero-section" style={{
            padding: isMobile ? '24px 18px 20px' : '44px 56px 32px',
            background: 'linear-gradient(180deg, #070c18 0%, #091122 100%)',
            borderBottom: '1px solid rgba(255, 255, 255, 0.07)',
          }}>
            {/* Metadata Ribbon */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: isMobile ? 12 : 18 }}>
              <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.14em', color: '#64748b' }}>DRIFT OPERATIONAL NOWCAST</span>
              <span style={{ width: 3, height: 3, borderRadius: '50%', background: '#334155' }} />
              {isLiveData && (
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '2px 7px', borderRadius: 9999, background: 'rgba(34, 197, 94, 0.10)', border: '1px solid rgba(34, 197, 94, 0.22)', fontSize: 10, fontWeight: 700, color: '#4ade80' }}>
                  <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#22c55e', boxShadow: '0 0 6px #22c55e' }} />
                  LIVE OPS
                </span>
              )}
              <span style={{ fontSize: 11, color: '#94a3b8', fontWeight: 500 }}>VOBL * 13.198°N, 77.706°E</span>
