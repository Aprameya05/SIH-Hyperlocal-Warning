              { label: 'Evening',   start: 18, end: 24, slot: 3 },
            ];
            const REGIME_COLORS = { R1: '#38bdf8', R2: '#facc15', R3: '#fb923c', R4: '#4ade80', default: '#94a3b8' };
            const activeId = liveData?.synoptic_regime?.regime_id || 'R4';
            const activeColor = REGIME_COLORS[activeId] || REGIME_COLORS.default;
            const activeLabel = liveData?.synoptic_regime?.regime_name || 'Dry Synoptic';

            const R = 90, CX = 110, CY = 110;
            const innerR = 44, outerR = 88;

            const hourToAngle = (h) => (h / 24) * 2 * Math.PI - Math.PI / 2;
            const toXY = (angle, r) => ({ x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) });

            const arcPath = (startH, endH, rInner, rOuter) => {
              const a1 = hourToAngle(startH);
              const a2 = hourToAngle(endH);
              const p1 = toXY(a1, rOuter), p2 = toXY(a2, rOuter);
              const p3 = toXY(a2, rInner), p4 = toXY(a1, rInner);
              const large = (endH - startH) > 12 ? 1 : 0;
              return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
            };

            const slots = liveData?.slots || [];
            const getSlotProb = (slotIdx) => {
              const s = slots.find(s => s.slot === slotIdx);
              return s ? (s.probability ?? s.ts_prob ?? 0) : 0;
            };

            const hourTicks = Array.from({ length: 24 }, (_, h) => h);

            return (
              <div className="p-6 rounded-2xl bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl shadow-xl font-sans">
                <div className="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2">
                  REGIME FINGERPRINT -- 24H POLAR CLOCK
                </div>
                <div className="flex flex-col sm:flex-row items-center gap-8">
                  <svg viewBox="0 0 220 220" style={{ width: 220, height: 220, flexShrink: 0 }}>
                    {/* Background */}
                    <circle cx={CX} cy={CY} r={R + 18} fill="rgba(6,10,23,0.95)" />

                    {/* Hour tick marks */}
                    {hourTicks.map(h => {
                      const angle = hourToAngle(h);
                      const isMajor = h % 6 === 0;
                      const inner = isMajor ? R - 4 : R - 2;
                      const p1 = toXY(angle, inner);
                      const p2 = toXY(angle, R + 2);
                      return <line key={h} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                        stroke={isMajor ? 'rgba(148,163,184,0.7)' : 'rgba(148,163,184,0.3)'}
                        strokeWidth={isMajor ? 1.5 : 0.8} />;
                    })}

                    {/* Slot arcs */}
                    {SLOT_HOURS.map(slot => {
                      const prob = getSlotProb(slot.slot);
                      const opacity = 0.25 + prob * 0.75;
                      const innerRing = innerR;
                      const outerRing = innerR + (outerR - innerR) * (0.4 + prob * 0.6);
                      return (
                        <g key={slot.slot}>
                          <path d={arcPath(slot.start, slot.end, innerRing, outerRing)}
                            fill={activeColor}
                            opacity={opacity}
                          />
                          <path d={arcPath(slot.start, slot.end, innerRing, outerRing)}
                            fill="none" stroke={activeColor} strokeWidth="1" opacity={0.6 + prob * 0.4}
                          />
                        </g>
                      );
                    })}

                    {/* Inner circle */}
                    <circle cx={CX} cy={CY} r={innerR} fill="rgba(6,10,23,0.98)" stroke="rgba(148,163,184,0.2)" strokeWidth="1" />

                    {/* Hour labels */}
                    {[0, 6, 12, 18].map(h => {
                      const angle = hourToAngle(h);
                      const p = toXY(angle, R + 12);
                      return <text key={h} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="central"
                        fontSize="9" fill="rgba(203,213,225,0.9)" fontFamily="monospace" fontWeight="bold">{h.toString().padStart(2,'0')}Z</text>;
                    })}

                    {/* Centre text */}
                    <text x={CX} y={CY - 6} textAnchor="middle" fontSize="10" fill={activeColor}
                      fontFamily="monospace" fontWeight="bold">{activeId}</text>
                    <text x={CX} y={CY + 8} textAnchor="middle" fontSize="8" fill="rgba(148,163,184,0.9)"
                      fontFamily="sans-serif" fontWeight="600">REGIME</text>

                    {/* Current hour hand */}
                    {(() => {
                      const nowUTC = new Date();
                      const h = nowUTC.getUTCHours() + nowUTC.getUTCMinutes() / 60;
                      const angle = hourToAngle(h);
                      const tip = toXY(angle, outerR - 2);
                      return <line x1={CX} y1={CY} x2={tip.x} y2={tip.y}
                        stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" />;
                    })()}
                    <circle cx={CX} cy={CY} r={3.5} fill="#10b981" />
                  </svg>

                  <div className="space-y-3 flex-1">
                    <div className="text-xs text-slate-400 uppercase tracking-wider font-semibold">Active Synoptic Regime</div>
                    <div className="text-xl font-bold" style={{ color: activeColor }}>{activeId} -- {activeLabel}</div>
                    <div className="text-xs text-slate-300 leading-relaxed">
                      Arc width and opacity represent slot-level TS probability. The green hand marks the current UTC hour.
                      A wider, brighter arc indicates high convective confidence in that time window.
                    </div>
                    <div className="space-y-2 pt-1">
                      {SLOT_HOURS.map(sl => {
                        const prob = getSlotProb(sl.slot);
                        return (
                          <div key={sl.slot} className="flex items-center gap-3 text-xs">
                            <span className="text-slate-400 w-20 font-medium">{sl.label}</span>
                            <div className="flex-1 h-2 rounded-full bg-slate-950 overflow-hidden border border-slate-800">
                              <div className="h-full rounded-full transition-all duration-700" style={{ width: `${(prob*100).toFixed(0)}%`, background: activeColor, opacity: 0.85 }} />
                            </div>
                            <span className="font-mono font-bold w-10 text-right" style={{ color: activeColor }}>{(prob*100).toFixed(0)}%</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    // --- 6. LIVE API PAGE (FASTAPI ENDPOINTS DISPLAY) ---
    function LiveApiPage({ liveData }) {
      const { lang } = React.useContext(LangContext);
      const [responses, setResponses] = useState({});
      const [loading, setLoading] = useState({});
      const [elapsed, setElapsed] = useState({});
      const [apiStatus, setApiStatus] = useState(null);
      const API_BASE = 'https://csir-thunderstorm-api.onrender.com';
      const TIMEOUT_MS = 90000;

      useEffect(() => {
        const controller = new AbortController();
        fetch(`${API_BASE}/`, { method: 'GET', signal: controller.signal })
          .then(r => r.ok ? setApiStatus('online') : setApiStatus('waking'))
          .catch(() => setApiStatus('waking'));
        return () => controller.abort();
      }, []);

      const [postBodies, setPostBodies] = React.useState({});
      const handleTryIt = async (ep) => {
        const key = ep.path;
        setLoading(prev => ({ ...prev, [key]: true }));
        setResponses(prev => ({ ...prev, [key]: null }));
        setElapsed(prev => ({ ...prev, [key]: 0 }));

        const startTime = Date.now();
        const timer = setInterval(() => {
          setElapsed(prev => ({ ...prev, [key]: Math.floor((Date.now() - startTime) / 1000) }));
        }, 1000);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

        try {
          const fetchOpts = ep.isPost
            ? { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: postBodies[key] ?? ep.exampleBody ?? '{}', signal: controller.signal }
            : { method: 'GET', signal: controller.signal };
          // For /nowcast/predict/slot/{id}, replace {id} with 2
          const resolvedPath = ep.path.replace('{id}', '2');
          const res = await fetch(`${API_BASE}${resolvedPath}`, fetchOpts);
          const data = await res.json();
          setApiStatus('online');
          setResponses(prev => ({ ...prev, [key]: { ok: true, status: res.status, data, ms: Date.now() - startTime } }));
        } catch (err) {
          const isTimeout = err.name === 'AbortError';
          setResponses(prev => ({ ...prev, [key]: {
            ok: false,
            status: isTimeout ? 'TIMEOUT' : 'ERROR',
            data: { error: isTimeout ? 'Request timed out (90s). Render is cold-starting -- wait 30s and try again.' : err.message }
          }}));
        } finally {
          clearTimeout(timeoutId);
          clearInterval(timer);
          setLoading(prev => ({ ...prev, [key]: false }));
        }
      };

      return (
        <div className="space-y-6 max-w-[1750px] mx-auto font-sans">
          <PageHeader
            eyebrow="FASTAPI REST INTERFACE * OPERATIONAL"
            title="Live API Explorer"
            subtitle="REST API endpoints for Airport Ground Handling & Automated Systems"
            badge={apiStatus === 'online' ? '● API ONLINE' : apiStatus === 'waking' ? '◌ API WAKING' : '… CHECKING'}
            badgeColor={apiStatus === 'online' ? 'green' : 'amber'}
          />
          <div className="p-6 rounded-2xl bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl shadow-xl space-y-6">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
              <div className="flex items-center gap-2.5">
                <span className={`w-2.5 h-2.5 rounded-full ${apiStatus === 'online' ? 'bg-emerald-400' : apiStatus === 'waking' ? 'bg-amber-400 animate-pulse' : 'bg-slate-500'}`}></span>
                <span className="text-xs font-semibold text-slate-300 tracking-wide uppercase">{apiStatus === 'online' ? 'FASTAPI INSTANCE ONLINE' : apiStatus === 'waking' ? 'WAKING UP CLOUD INSTANCE…' : 'POLLING SERVER…'}</span>
              </div>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <span className="text-xs text-slate-400 font-medium">BASE URL:</span>
                <input
                  type="text"
                  readOnly
                  value="https://csir-thunderstorm-api.onrender.com"
                  className="bg-slate-950 text-xs font-mono text-cyan-300 border border-slate-800 rounded-lg px-3 py-1.5 w-full sm:w-80 shadow-inner select-all"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {API_ENDPOINTS.map(ep => {
                const key = ep.path;
                const resp = responses[key];
                const isLoading = loading[key];
                return (
                  <div key={key} className="p-5 rounded-2xl bg-slate-950/70 border border-slate-800 flex flex-col justify-between space-y-3.5 hover:border-slate-700 transition-colors">
                    <div>
                      <div className="flex items-center gap-3 mb-2">
                        <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold font-mono tracking-wider ${ep.isPost ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-sky-500/15 text-sky-300 border border-sky-500/30'}`}>
                          {ep.method}
                        </span>
                        <span className="text-xs font-bold text-white font-mono">{ep.path}</span>
                      </div>

                      <p className="text-xs text-slate-400 leading-relaxed">{ep.desc}</p>

                      {/* Editable request body for POST endpoints */}
                      {ep.isPost && ep.exampleBody && (
                        <div className="space-y-1.5 mt-3">
                          <div className="text-[10px] text-amber-300 uppercase tracking-wider font-semibold font-sans">REQUEST BODY (JSON):</div>
                          <textarea
                            value={postBodies[ep.path] ?? ep.exampleBody}
                            onChange={e => setPostBodies(prev => ({ ...prev, [ep.path]: e.target.value }))}
                            rows={2}
                            className="w-full bg-slate-900 text-xs text-emerald-300 border border-slate-800 rounded-lg p-2.5 font-mono resize-none focus:outline-none focus:border-amber-400/50 shadow-inner"
                            spellCheck={false}
                          />
                        </div>
                      )}
                    </div>

                    <div className="border-t border-slate-800/80 pt-3">
                      <div className="flex justify-end">
                        <button
                          onClick={() => handleTryIt(ep)}
                          disabled={isLoading}
                          className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${
                            isLoading
                              ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/40 cursor-wait'
                              : 'bg-cyan-500/20 text-cyan-300 border-cyan-400/40 hover:bg-cyan-500/30 cursor-pointer shadow-[0_0_12px_rgba(56,189,248,0.15)]'
                          }`}
                        >
                          {isLoading ? `⟳ ${elapsed[key] || 0}s… ${elapsed[key] > 15 ? '(API waking)' : 'Executing...'}` : '▶ Send Request'}
                        </button>
                      </div>

                      {/* Response panel */}
                      {resp && (
                        <div className={`mt-3 rounded-xl p-3.5 text-xs font-mono border max-h-52 overflow-y-auto ${
                          resp.ok ? 'bg-emerald-950/20 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/20 border-rose-500/30 text-rose-300'
                        }`}>
                          <div className="text-[11px] text-slate-400 font-sans mb-1.5 flex justify-between">
                            <span>{resp.ok ? `${resp.status} OK * ${resp.ms}ms` : resp.status}</span>
                            <span>{new Date().toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata'})} IST</span>
                          </div>
                          <pre className="whitespace-pre-wrap break-all text-[11px] leading-relaxed">{JSON.stringify(resp.data, null, 2).slice(0, 1200)}{JSON.stringify(resp.data).length > 1200 ? '\n… (truncated)' : ''}</pre>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- 7. RADAR MAP PAGE (DOPPLER RADAR DISPLAY) ---
    function RadarMapPage({ liveData }) {
      const { lang } = React.useContext(LangContext);
      const [scrubberTime, setScrubberTime] = useState(4);
      const [isPlaying, setIsPlaying] = useState(false);

      // ---- LIGHTNING FEED STATE ----
      const [strikes, setStrikes] = useState([]);          // [{x,y,lat,lng,age,dist,id}]
      const [strikeCount1h, setStrikeCount1h] = useState(0);
      const [strikeRate, setStrikeRate] = useState(0);     // strikes/min last 5 min
      const [lightningWs, setLightningWs] = useState(null);
      const [wsStatus, setWsStatus] = useState('CONNECTING'); // CONNECTING|LIVE|OFFLINE
      const strikeBuffer = React.useRef([]);               // rolling 1h buffer
      const strikeIdRef = React.useRef(0);

      // VOBL centre (lat/lng) and map geometry
      const VOBL_LAT = 13.1986, VOBL_LON = 77.7066;
      const MAP_CX = 400, MAP_CY = 300;
      const KM_PER_PX = 200 / 240;   // 200 km radius = 240px on 800x600 viewBox

      // Convert lat/lng to SVG x,y
      const latLngToXY = (lat, lng) => {
        const dLat = lat - VOBL_LAT;
        const dLon = lng - VOBL_LON;
        const km_y = dLat * 111.0;
        const km_x = dLon * 111.0 * Math.cos(VOBL_LAT * Math.PI / 180);
        const px_x = MAP_CX + km_x / KM_PER_PX;
        const px_y = MAP_CY - km_y / KM_PER_PX;
        return { x: px_x, y: px_y };
      };

      const distKm = (lat, lng) => {
        const dLat = (lat - VOBL_LAT) * Math.PI / 180;
        const dLon = (lng - VOBL_LON) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(VOBL_LAT*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 6371 * 2 * Math.asin(Math.sqrt(a));
      };

      // Age strikes every second, prune >5min old from display
      useEffect(() => {
        const ageTimer = setInterval(() => {
          const now = Date.now();
          // Prune display strikes older than 5 min
          setStrikes(prev => prev.filter(s => now - s.ts < 300000).map(s => ({...s, age: now - s.ts})));
          // Prune buffer older than 1h
          strikeBuffer.current = strikeBuffer.current.filter(s => now - s.ts < 3600000);
          setStrikeCount1h(strikeBuffer.current.length);
          // Rate: strikes in last 5 min / 5
          const last5 = strikeBuffer.current.filter(s => now - s.ts < 300000).length;
          setStrikeRate((last5 / 5).toFixed(1));
        }, 1000);
        return () => clearInterval(ageTimer);
      }, []);

      // WebSocket connection to Blitzortung
      useEffect(() => {
        let ws;
        let reconnectTimer;

        const connect = () => {
          // Blitzortung public WebSocket servers (server 9 covers Asia)
          // Use our Render proxy -- wss:// so it works from https pages
          const url = 'wss://csir-thunderstorm-api.onrender.com/ws/lightning';
          try {
            ws = new WebSocket(url);
            ws.onopen = () => {
              setWsStatus('LIVE');
              // Proxy handles bbox subscription and filtering server-side
            };
            ws.onmessage = (evt) => {
              try {
                const d = JSON.parse(evt.data);
                // Blitzortung sends: {time, lat, lon, alt, pol, mds, mcg, status, region, delay, sig}
                if (d.lat === undefined || d.lon === undefined) return;
                const lat = d.lat / 1e6;  // Blitzortung uses microdegrees
                const lng = d.lon / 1e6;
                const dist = distKm(lat, lng);
                if (dist > 250) return; // Only within 250 km
                const pos = latLngToXY(lat, lng);
                if (pos.x < 0 || pos.x > 800 || pos.y < 0 || pos.y > 600) return;
                const now = Date.now();
                const id = ++strikeIdRef.current;
                const strike = { id, lat, lng, x: pos.x, y: pos.y, ts: now, age: 0, dist: Math.round(dist) };
                strikeBuffer.current.push(strike);
                setStrikes(prev => [...prev.slice(-200), strike]); // keep last 200 visible
              } catch(e) {}
            };
            ws.onerror = () => setWsStatus('OFFLINE');
            ws.onclose = () => {
              setWsStatus('OFFLINE');
              reconnectTimer = setTimeout(connect, 8000); // reconnect after 8s
            };
          } catch(e) {
            setWsStatus('OFFLINE');
            reconnectTimer = setTimeout(connect, 8000);
          }
        };

        connect();
        return () => {
          if (ws) ws.close();
          clearTimeout(reconnectTimer);
        };
      }, []);

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setScrubberTime(prev => (prev + 1) % 5);
          }, 1200);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);
      const h9 = liveData?.satellite?.himawari9;
      const history = liveData?.satellite?.history || [];
      const sortedHistory = [...history].sort((a, b) => {
        const ta = a.timestamp_ist || a.valid_time || '';
        const tb = b.timestamp_ist || b.valid_time || '';
        return ta < tb ? -1 : ta > tb ? 1 : 0;
      });
      const frames = sortedHistory.length > 0 ? sortedHistory : [h9].filter(Boolean);
      const frame = frames[Math.min(scrubberTime, frames.length - 1)] || h9;

      return (
        <div className="font-sans max-w-[1750px] mx-auto space-y-6">
          <PageHeader
            eyebrow="DOPPLER RADAR * S-BAND * VOBL"
            title="Radar Map -- Bengaluru"
            subtitle="Coverage Radius: 200 km * 12.97° N, 77.58° E * Himawari-9 IR Active"
            badge="SAT+RADAR"
            badgeColor="amber"
          />

          <div className="bg-[#0c1326]/75 border border-[#1e293b]/70 backdrop-blur-xl rounded-2xl p-6 shadow-2xl space-y-6">

          {/* Himawari-9 Satellite Storm Proximity Panel */}
          {(() => {
            const stormDetected = h9?.storm_detected;
            const minBT = h9?.min_bt_50km;
            const voblBT = h9?.vobl_bt_celsius;
            const coldPx = h9?.cold_pixels_count ?? 0;
            const nearestKm = h9?.nearest_pixel_dist_km;
            const btTrend1h = h9?.bt_trend_1h ?? null;
            const timestampIST = h9?.timestamp_ist?.replace('T', ' ') + ' IST';
            const available = h9?.available;

            return (
              <div className={`p-5 rounded-2xl border transition-all ${
                stormDetected 
                  ? 'bg-rose-500/10 border-rose-500/30 shadow-[0_0_24px_rgba(244,63,94,0.12)]' 
                  : 'bg-[#080d1a]/80 border-[#1e293b]/60'
              }`}>
                <div className="flex flex-wrap justify-between items-center gap-2 mb-4 border-b border-[#1e293b]/50 pb-3">
                  <span className="text-xs font-bold tracking-wider text-sky-400 flex items-center gap-2.5">
                    <span className={`w-2.5 h-2.5 rounded-full ${stormDetected ? 'bg-rose-400 animate-ping' : available ? 'bg-emerald-400' : 'bg-slate-500'}`}></span>
                    HIMAWARI-9 SATELLITE * STORM PROXIMITY SIGNAL
                  </span>
                  <span className="text-[12px] font-mono text-slate-400">Band 13 * 10.4μm IR * 50km VOBL Box</span>
                </div>

                {available ? (
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 text-center">
                    <div className="p-3 rounded-xl bg-[#0b1328]/70 border border-[#1e293b]/60">
                      <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-1 uppercase">STORM DETECTED</div>
                      <div className={`text-sm font-extrabold ${stormDetected ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {stormDetected ? '⚡ YES' : '✓ CLEAR'}
                      </div>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0b1328]/70 border border-[#1e293b]/60">
                      <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-1 uppercase">MIN BT (50km)</div>
                      <div className={`text-sm font-extrabold ${minBT !== null && minBT < -40 ? 'text-rose-400' : 'text-slate-100'}`}>

                      <div className={`text-sm font-extrabold ${btTrend1h !== null && btTrend1h < -3 ? 'text-rose-400' : btTrend1h !== null && btTrend1h > 3 ? 'text-emerald-400' : 'text-slate-100'}`} title="Cloud-Top Temperature change per hour. Negative = cooling top = convection intensifying.">
                        {btTrend1h !== null ? `${btTrend1h > 0 ? '+' : ''}${btTrend1h} °C/h` : '--'}
                        {btTrend1h !== null && btTrend1h < -3 ? ' ❄' : btTrend1h !== null && btTrend1h > 3 ? ' ↑' : ''}
                      </div>

                      <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-1 uppercase">VOBL BT</div>
                      <div className="text-sm font-extrabold text-slate-100">

                    </div>
                    <div className="p-3 rounded-xl bg-[#0b1328]/70 border border-[#1e293b]/60">
                      <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-1 uppercase">COLD PIXELS</div>
                      <div className={`text-sm font-extrabold ${coldPx > 0 ? 'text-amber-400' : 'text-slate-100'}`}>
                        {coldPx} {coldPx > 0 ? '⚠' : ''}

                  const hist = liveData.satellite.himawari9.history;
                  const bts = hist.map(h => h.min_bt_50km ?? h.min_bt ?? null).filter(v => v !== null && isFinite(v));
                  if (bts.length < 2) return null;
                  const minBTv = Math.min(...bts);
                  const maxBTv = Math.max(...bts);
                  const span = maxBTv - minBTv || 1;
                  const W = 560, H = 62;
                  const PAD = { l: 36, r: 12, t: 10, b: 18 };
                  const chartW = W - PAD.l - PAD.r;
                  const chartH = H - PAD.t - PAD.b;
                  const pts = bts.map((v, i) => {

                    return `${x},${y}`;

                  const trendDiff = lastBT - firstBT;
                  const lineColor = lastBT < -50 ? '#f43f5e' : lastBT < -40 ? '#f59e0b' : '#38bdf8';
                  const trendLabel = trendDiff < -3 ? `▼ COOLING ${trendDiff.toFixed(1)}°C` : trendDiff > 3 ? `▲ WARMING +${trendDiff.toFixed(1)}°C` : `→ STABLE`;

                  return (

                      </div>
                      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="62" style={{ fontFamily: 'monospace' }}>
                        <text x={PAD.l - 4} y={PAD.t + 4} textAnchor="end" fontSize="7.5" fill="#64748b">{maxBTv.toFixed(0)}°</text>
                        <text x={PAD.l - 4} y={H - PAD.b + 4} textAnchor="end" fontSize="7.5" fill="#64748b">{minBTv.toFixed(0)}°</text>
                        {minBTv < -40 && maxBTv > -40 && (
                          <line x1={PAD.l} x2={W - PAD.r}
                            y1={PAD.t + ((maxBTv - (-40)) / span) * chartH}
                            y2={PAD.t + ((maxBTv - (-40)) / span) * chartH}
                            stroke="#f43f5e" strokeWidth="0.8" strokeDasharray="3 2" opacity="0.6" />
                        )}
                        <defs>
                          <linearGradient id="btFill" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={lineColor} stopOpacity="0.3" />
                            <stop offset="100%" stopColor={lineColor} stopOpacity="0.0" />
                          </linearGradient>
                        </defs>
                        <polyline points={pts + ` ${PAD.l + chartW},${H - PAD.b} ${PAD.l},${H - PAD.b}`}
                          fill="url(#btFill)" stroke="none" />
                        <polyline points={pts} fill="none" stroke={lineColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />

                          const x = PAD.l + (i / (bts.length - 1)) * chartW;
                          const y = PAD.t + ((maxBTv - v) / span) * chartH;
                          const isLast = i === bts.length - 1;
                          const ts = hist[i]?.timestamp_utc;
                          const hhmm = ts ? ts.slice(11, 16) + 'Z' : '';
                          return (
                            <g key={i}>
                              <circle cx={x} cy={y} r={isLast ? 4 : 2.5}

                                </text>

                                <text x={x} y={H - PAD.b + 12} textAnchor="middle" fontSize="7" fill="#64748b">
                                  {hhmm}
                                </text>
                              )}
                            </g>
                          );
                        })}
                      </svg>
                    </div>
                  );
                })()}

                          <stop offset="100%" stopColor="#00e676" stopOpacity="0" />
                        </linearGradient>
                        <mask id="radarMask">
                          <circle cx={CX} cy={CY} r={MAXR} fill="white" />
                        </mask>
                      </defs>

                      {/* Outer bezel */}
                      <circle cx={CX} cy={CY} r={MAXR+18} fill="#03091e" stroke="#1e293b" strokeWidth="1.5" />

                      {/* Degree ticks */}
                      {Array.from({length:72},(_,i)=>{
                        const a = i*5, isMajor = a%30===0, isMed = a%10===0;
                        const r1 = MAXR+3, r2 = MAXR+(isMajor?16:isMed?10:5);
                        const p1 = radarXY(a, r1), p2 = radarXY(a, r2);
                        return <line key={i} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                          stroke={isMajor?'#00e676':isMed?'#007d2b':'#004d15'}
                          strokeWidth={isMajor?1.5:0.8} />;

                        return <text key={c.lbl} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle"

                            strokeDasharray={i%2===0?"none":"5 4"} />

                      {/* Lightning density rings */}

                  {/* IR BT COLOR SCALE SIDEBAR */}
                  <div className="w-full md:w-24 bg-[#03091e] border-t md:border-t-0 md:border-l border-[#1e293b]/70 flex md:flex-col items-center justify-around md:justify-start py-4 px-2 gap-2">
                    <div className="text-[10px] text-slate-400 font-bold tracking-wider text-center leading-tight">IR BT<br/>SCALE</div>

                      <div key={row.lbl} className="flex items-center gap-1.5 w-full px-1">
                        <div style={{width:12,height:9,borderRadius:2,background:row.c,flexShrink:0}} />
                        <span className="text-[9px] text-slate-400 font-mono whitespace-nowrap">{row.lbl}</span>
                      </div>
                    ))}
                    <div className="mt-auto hidden md:block text-[9px] text-slate-500 text-center px-1 leading-snug">
                      HIMAWARI-9<br/>B13 (10.4µm)
                    </div>
                  </div>
                </div>

                {/* BOTTOM STATUS STRIP */}
                <div className="flex flex-wrap items-center justify-between px-4 py-2 bg-[#03091e] border-t border-[#1e293b]/70 text-[11px] text-slate-400">
                  <span>WEBSOCKET: <span className="text-emerald-400 font-bold">{wsStatus}</span></span>
                  <span>STRIKES (5 MIN): <span className="text-amber-400 font-bold">{strikes.length}</span></span>
                  <span>RATE: <span className={`font-bold ${strikes.length>5?'text-rose-400':strikes.length>2?'text-amber-400':'text-emerald-400'}`}>{strikes.length > 0 ? `${Math.round(strikes.length*12)}/hr` : '0/hr'}</span></span>
                  {liveStormDetected && <span className="text-rose-400 font-bold animate-pulse">⚡ DEEP CONVECTION * {liveColdPx} COLD PX</span>}
                </div>
              </div>
            );
          })()}

          {/* Timeline Scrubber */}
          <div className="flex flex-wrap items-center justify-between bg-[#080d1a]/90 p-4 rounded-2xl border border-[#1e293b]/60 text-xs gap-4 shadow-xl">
            <button
              onClick={() => setIsPlaying(!isPlaying)}
              className={`px-4 py-2 rounded-xl font-bold tracking-wide transition-all border ${
                isPlaying 
                  ? 'bg-rose-500/20 text-rose-300 border-rose-500/40 shadow-[0_0_15px_rgba(244,63,94,0.2)]'
                  : 'bg-sky-500/20 text-sky-300 border-sky-400/40 shadow-[0_0_15px_rgba(56,189,248,0.15)] hover:bg-sky-500/30'
              }`}
            >
              {isPlaying ? '⏸ PAUSE AUTO' : '▶ PLAY AUTO'}
            </button>

            <div className="flex flex-wrap gap-1.5">
              {frames.length > 0
                ? frames.map((f, idx) => (
                    <button
                      key={idx}
                      onClick={() => setScrubberTime(idx)}
                      className={`px-3 py-1.5 rounded-xl font-bold text-xs transition-all ${
                        scrubberTime === idx 
                          ? 'bg-sky-500/30 text-sky-200 border border-sky-400/60 shadow-[0_0_12px_rgba(56,189,248,0.25)]' 
                          : 'bg-[#0f172a]/70 text-slate-400 border border-[#1e293b]/50 hover:bg-[#1e293b]'
                      }`}
                    >
                      {f.timestamp_ist ? f.timestamp_ist.slice(11,16) + ' IST' : f.valid_time ? f.valid_time.slice(11,16) + ' IST' : `T-${(frames.length-1-idx)*10}m`}
                    </button>
                  ))
                : ['-60m', '-45m', '-30m', '-15m', 'NOW'].map((t, idx) => (
                    <button
                      key={t}
                      onClick={() => setScrubberTime(idx)}
                      className={`px-3 py-1.5 rounded-xl font-bold text-xs transition-all ${
                        scrubberTime === idx 
                          ? 'bg-sky-500/30 text-sky-200 border border-sky-400/60 shadow-[0_0_12px_rgba(56,189,248,0.25)]' 
                          : 'bg-[#0f172a]/70 text-slate-400 border border-[#1e293b]/50 hover:bg-[#1e293b]'
                      }`}
                    >
                      {t}
                    </button>
                  ))
              }
            </div>

            <div className="flex items-center gap-3 text-xs flex-wrap font-mono">
              <span className="text-slate-400 font-bold">BT:</span>
              <span style={{color:'#4caf50'}}>&gt;-20°C Clear</span>
              <span style={{color:'#ffc107'}}>-20 to -40°C Cloud</span>
              <span style={{color:'#ff9800'}}>-40 to -50°C Deep</span>
              <span style={{color:'#ef5350'}}>&lt;-50°C Storm</span>
              <span className="text-[#1e293b]">|</span>
              <span className="text-slate-400 font-bold">⚡ STRIKES:</span>
              <span style={{color:'rgba(255,235,59,1)'}}>●</span><span className="text-slate-400">&gt;100km</span>
              <span style={{color:'rgba(255,152,0,1)'}}>●</span><span className="text-slate-400">50-100km</span>
              <span style={{color:'rgba(239,83,80,1)'}}>●</span><span className="text-slate-400">&lt;50km</span>
            </div>
          </div>

          </div>
        </div>
      );
    }

    // --- 8. ATC VIEW PAGE (FULLSCREEN MINIMAL DISPLAY) ---
    function AtcViewFullscreen({ currentSlot, onExitAtc, liveData, slots }) {
      const isAlert = currentSlot.probability >= currentSlot.threshold;
      const isSatOverride = liveData?.himawari_override_active ?? false;

      // Next slot (wraps around)
      const nextSlot = slots ? slots[(currentSlot.slot + 1) % slots.length] : null;

      // Model version for active slot (v6 temporal slots 0-3, v5 temporal slots 1-3, v4 ensemble slot 0)
      const MODEL_LABELS = { 0: 'v6+v4 Ensemble', 1: 'v6 Temporal', 2: 'v6 Temporal', 3: 'v6 Temporal' };
      const modelLabel = MODEL_LABELS[currentSlot.slot] ?? 'v6 Temporal';

      // Monsoon phase -- prefer new convective_initiation.monsoon_regime, fall back to synoptic_regime
      const convInit = liveData?.convective_initiation ?? {};
      const monsoonRegime = convInit.monsoon_regime ?? null;
      const monsoonPhase = monsoonRegime ?? liveData?.synoptic_regime?.monsoon_phase ?? liveData?.monsoon_phase ?? null;
      const monsoonIndex = liveData?.synoptic_regime?.monsoon_index ?? null;
      const phaseColor = (monsoonPhase === 'ACTIVE' || monsoonPhase === 'ACTIVE_MODERATE') ? 'text-cyan-400'
        : monsoonPhase === 'CONVECTIVE_BURST' ? 'text-red-400'
        : monsoonPhase === 'BREAK' ? 'text-amber-400' : 'text-white';
      const regimeFactor = convInit.regime_thresh_factor ?? currentSlot.regime_adjustment ?? null;
      const capeTendency = convInit.cape_tendency_jkgh ?? null;
      const capeTrend = convInit.cape_trend ?? null;

      // Himawari state
      const h9 = liveData?.satellite?.himawari9;
      const stormDetected = h9?.storm_detected ?? false;
      const minBT = h9?.min_bt_50km ?? null;
      const coldPx = h9?.cold_pixels_count ?? 0;
      const btTrend1h = h9?.bt_trend_1h ?? null;

      // METAR TS override and SIGMET
      const metarTsOverride = liveData?.metar_ts_override ?? false;
      const sigmetBulletin = liveData?.sigmet_bulletin ?? null;

      // Recent alerts (last 5 from alert_history)
      const recentAlerts = liveData?.recent_alerts ?? [];

      // Flight category colour
      const flightCat = liveData?.metar?.flight_category ?? '--';
      const fcColor = flightCat === 'VFR' ? 'text-emerald-400' : flightCat === 'MVFR' ? 'text-blue-400' : flightCat === 'IFR' ? 'text-red-400' : 'text-purple-400';

      // IST clock
      const [istTime, setIstTime] = React.useState('');
      React.useEffect(() => {
        const tick = () => {
          const now = new Date();
          const utc = now.getTime() + now.getTimezoneOffset() * 60000;
          const ist = new Date(utc + 3600000 * 5.5);
          setIstTime(ist.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' IST');
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);

      const atcAccent = isAlert ? '#ef5350' : '#38bdf8';
      const atcBg = isAlert ? 'rgba(30,4,4,1)' : 'rgba(2,4,12,1)';
      const atcBorder = isAlert ? 'rgba(239,83,80,0.18)' : 'rgba(56,189,248,0.12)';

      return (
        <div className="fixed inset-0 z-[200] flex flex-col font-sans text-slate-100" style={{background: atcBg, transition:'background 1s'}}>
          {/* Subtle grid pattern overlay */}
          <div style={{position:'fixed',inset:0,backgroundImage:'radial-gradient(circle at 50% 50%, rgba(56,189,248,0.03) 0%, transparent 80%)',pointerEvents:'none',zIndex:1}} />
          {/* Alert pulse overlay */}
          {isAlert && <div style={{position:'fixed',inset:0,background:'radial-gradient(ellipse at center,rgba(244,63,94,0.08) 0%,transparent 70%)',pointerEvents:'none',zIndex:1,animation:'pulse-slow 2s ease-in-out infinite'}} />}

          {/* Header bar */}
          <div className="flex justify-between items-center px-8 py-3.5 relative z-10 bg-[#070d1e]/80 border-b border-[#1e293b]/70 backdrop-blur-xl">
            <div>
              <div className="flex items-center gap-3">
                <div style={{width:10,height:10,borderRadius:'50%',background:atcAccent,boxShadow:`0 0 14px ${atcAccent}`,animation:'pulse-slow 1.5s ease-in-out infinite'}} />
                <h1 className="text-xl font-black tracking-tight" style={{color:atcAccent,textShadow:`0 0 24px ${atcAccent}60`}}>VOBL ATC CONVECTIVE ALERT MONITOR</h1>
              </div>
              <p className="text-xs font-mono mt-0.5 text-slate-400 tracking-wider">IMD STATION 43295 * KEMPEGOWDA INTERNATIONAL * RUNWAY 09L/27R SECTOR</p>
            </div>
            <div className="flex items-center gap-6">
              <div className="text-right">
                <div className="text-2xl font-mono font-extrabold tabular-nums tracking-wider" style={{color:atcAccent,textShadow:`0 0 16px ${atcAccent}80`}}>{istTime}</div>
                <div className="text-xs font-mono text-slate-400 tracking-wide">GEN: {liveData?.generated_at ?? '--'} IST</div>
              </div>
              <div className="text-right">
                <div className={`text-2xl font-black tracking-tight ${isAlert ? 'animate-pulse' : ''}`} style={{color:atcAccent,textShadow:`0 0 24px ${atcAccent}`}}>
                  {isAlert ? '⚡ CONVECTIVE ALERT' : '✓ ALL CLEAR'}
                </div>
                <div className={`text-xs font-bold font-mono tracking-widest mt-0.5 ${isAlert ? 'text-rose-400' : 'text-emerald-400'}`}>
                  {isAlert ? 'OPERATIONAL ACTION REQUIRED' : 'STATUS NOMINAL'}{isSatOverride && ' * SAT OVERRIDE'}
                </div>
              </div>
              <button onClick={onExitAtc}
                className="px-4 py-2 rounded-xl text-xs font-bold tracking-wider flex items-center gap-2 transition-all bg-sky-500/15 border border-sky-400/40 text-sky-300 hover:bg-sky-500/25 shadow-[0_0_15px_rgba(56,189,248,0.15)]">
                <span>⬅</span><span>DASHBOARD</span>
              </button>
            </div>
          </div>

          {/* Main grid */}
          <div className="flex-1 grid grid-cols-12 gap-5 px-8 py-5 overflow-hidden">

            {/* Left: big probability */}
            <div className="col-span-4 flex flex-col gap-4">
              <div className="flex-1 rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl shadow-2xl flex flex-col items-center justify-center text-center p-6">
                <div className="text-xs font-mono text-slate-400 font-bold uppercase tracking-widest mb-1">
                  SLOT 0{currentSlot.slot + 1} * {currentSlot.label}
                </div>
                <div className="text-sm font-mono text-sky-400 font-bold mb-3">{currentSlot.time}</div>
                <div className={`${(currentSlot.probability * 100 < 10) ? 'text-[7.5rem]' : 'text-[6rem]'} font-mono font-black leading-none tracking-tighter drop-shadow-2xl ${
                  isAlert ? 'text-rose-400 animate-pulse' : 'text-white'
                }`}>
                  {(currentSlot.probability * 100).toFixed(1)}%
                </div>
                <span className={`px-5 py-1.5 rounded-full text-xs font-bold font-mono border mt-4 tracking-wider ${
                  isAlert ? 'bg-rose-500/20 text-rose-300 border-rose-500/50 animate-pulse' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50'
                }`}>
                  {isAlert ? 'DECISION LIMIT EXCEEDED' : 'BELOW THRESHOLD'}
                </span>
                <div className="mt-4 flex items-center gap-3 text-xs font-mono text-slate-400">
                  <span>MODEL <strong className="text-amber-300">{modelLabel}</strong></span>
                  <span>*</span>
                  <span>LIMIT <strong className="text-slate-100">{(currentSlot.threshold * 100).toFixed(0)}%</strong></span>
                </div>
              </div>

              {/* Next slot */}
              {nextSlot && (
                <div className="rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl p-4 flex items-center justify-between shadow-xl">
                  <div>
                    <div className="text-[11px] font-mono text-slate-400 font-bold tracking-wider">NEXT SLOT</div>
                    <div className="text-sm text-slate-100 font-bold">{nextSlot.label}</div>
                    <div className="text-xs font-mono text-sky-400">{nextSlot.time}</div>
                  </div>
                  <div className={`text-2xl font-mono font-black ${
                    nextSlot.probability >= nextSlot.threshold ? 'text-rose-400' :
                    nextSlot.probability >= 0.15 ? 'text-amber-400' : 'text-emerald-400'
                  }`}>
                    {(nextSlot.probability * 100).toFixed(1)}%
                  </div>
                </div>
              )}
            </div>

            {/* Centre: met readings */}
            <div className="col-span-5 flex flex-col gap-4">
              <div className="rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl p-5 shadow-2xl">
                <h3 className="text-xs font-bold text-sky-400 uppercase tracking-wider border-b border-[#1e293b]/60 pb-3 mb-4">
                  ESSENTIAL METEOROLOGICAL READINGS
                </h3>
                <div className="grid grid-cols-2 gap-3.5">
                  {[
                    { label: 'WIND SURFACE', value: liveData?.metar?.wind_dir != null ? `${liveData.metar.wind_dir}° / ${liveData.metar.wind_speed_kt} kts` : '--' },
                    { label: 'VISIBILITY', value: liveData?.metar?.visibility_km != null ? `${liveData.metar.visibility_km} km` : '--' },
                    { label: 'TEMPERATURE', value: liveData?.metar?.temp_c != null ? `${liveData.metar.temp_c}°C` : '--' },
                    { label: 'REL. HUMIDITY', value: liveData?.metar?.rh_pct != null ? `${liveData.metar.rh_pct.toFixed(0)}%` : '--' },
                    { label: 'CAPE', value: liveData?.met_parameters?.ua_cape_jkg != null ? `${liveData.met_parameters.ua_cape_jkg} J/kg` : (liveData?.met_parameters?.CAPE != null ? `${liveData.met_parameters.CAPE.toFixed(0)} J/kg` : '--') },
                    { label: 'K-INDEX', value: liveData?.met_parameters?.ua_k_index ?? liveData?.met_parameters?.K_INDEX?.toFixed(1) ?? '--' },
                    { label: 'LIFTED INDEX', value: liveData?.met_parameters?.ua_lifted_index ?? liveData?.met_parameters?.LIFTED_INDEX?.toFixed(2) ?? '--' },
                    { label: 'TOTALS-TOTALS', value: liveData?.met_parameters?.ua_totals_totals ?? liveData?.met_parameters?.TOTALS_TOTALS?.toFixed(1) ?? '--' },
                  ].map(item => (
                    <div key={item.label} className="p-3.5 rounded-xl bg-[#080d1a]/85 border border-[#1e293b]/60">
                      <span className="text-[11px] font-bold text-slate-400 block tracking-wider uppercase">{item.label}</span>
                      <span className="text-base font-mono font-bold text-slate-100">{item.value}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Flight category + METAR */}
              <div className="rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl p-5 flex items-center justify-between shadow-2xl">
                <div>
                  <div className="text-[11px] font-bold text-slate-400 tracking-wider">FLIGHT CATEGORY</div>
                  <div className={`text-2xl font-mono font-black ${fcColor}`}>{flightCat}</div>
                  <div className="text-xs font-mono text-slate-400 mt-0.5">VOBL * METAR</div>
                </div>
                <div className="text-right">
                  <div className="text-[11px] font-bold text-slate-400 tracking-wider">S-BAND RADAR</div>
                  <div className="text-sm font-bold text-slate-100">BENGALURU ACTIVE</div>
                  <div className="text-xs font-mono text-slate-400">IMD STATION 43295</div>
                </div>
              </div>
            </div>

            {/* Right: situational awareness */}
            <div className="col-span-3 flex flex-col gap-4">

              {/* Monsoon phase */}
              <div className="rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl p-4 shadow-2xl">
                <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-2">MONSOON REGIME</div>
                <div className={`text-base font-extrabold ${phaseColor}`}>
                  {monsoonPhase ?? liveData?.synoptic_regime?.regime_name ?? 'DETECTING...'}
                </div>
                <div className="mt-2.5 space-y-1 text-xs font-mono">
                  {regimeFactor !== null && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">THRESH FACTOR</span>
                      <span className={`font-bold ${regimeFactor < 1 ? 'text-sky-400' : regimeFactor > 1 ? 'text-amber-400' : 'text-slate-100'}`}>
                        ×{regimeFactor.toFixed(2)}
                      </span>
                    </div>
                  )}
                  {capeTendency !== null && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">CAPE TENDENCY</span>
                      <span className={`font-bold ${capeTendency > 50 ? 'text-rose-400' : capeTendency < -50 ? 'text-emerald-400' : 'text-slate-100'}`}>
                        {capeTendency > 0 ? '+' : ''}{capeTendency.toFixed(0)} J/kg/h
                      </span>
                    </div>
                  )}
                  {capeTrend && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">CAPE TREND</span>
                      <span className={`font-bold ${capeTrend === 'BUILDING' ? 'text-rose-400' : capeTrend === 'WEAKENING' ? 'text-emerald-400' : 'text-slate-100'}`}>
                        {capeTrend}
                      </span>
                    </div>
                  )}
                  {monsoonIndex !== null && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">MONSOON IDX</span>
                      <span className="font-bold text-slate-100">{typeof monsoonIndex === 'number' ? monsoonIndex.toFixed(2) : monsoonIndex}</span>
                    </div>
                  )}
                </div>
                <div className={`mt-2.5 pt-2.5 border-t border-[#1e293b]/60 text-xs font-semibold ${phaseColor}`}>
                  {monsoonPhase === 'CONVECTIVE_BURST'
                    ? 'BURST: All thresholds at 80% -- maximum sensitivity'
                    : (monsoonPhase === 'ACTIVE' || monsoonPhase === 'ACTIVE_MODERATE')
                      ? 'ACTIVE: Thresholds lowered -- increased sensitivity'
                      : monsoonPhase === 'BREAK'
                        ? 'BREAK: Thresholds raised -- suppress false alarms'
                        : 'NEUTRAL: Default operational thresholds applied'}
                </div>
              </div>

              {/* Himawari state */}
              <div className={`rounded-2xl bg-[#0c1326]/80 border backdrop-blur-xl p-4 shadow-2xl transition-all ${stormDetected ? 'border-rose-500/50 shadow-[0_0_20px_rgba(244,63,94,0.15)]' : 'border-[#1e293b]/70'}`}>
                <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-2">HIMAWARI-9 SATELLITE</div>
                <div className={`text-sm font-black ${stormDetected ? 'text-rose-400 animate-pulse' : 'text-emerald-400'}`}>
                  {stormDetected ? '⚡ STORM DETECTED' : '✓ CLEAR'}
                </div>
                <div className="mt-2.5 space-y-1 text-xs font-mono">
                  <div className="flex justify-between">
                    <span className="text-slate-400">MIN BT (50km)</span>
                    <span className={`font-bold ${minBT !== null && minBT < -40 ? 'text-rose-400' : 'text-slate-100'}`}>
                      {minBT !== null ? `${minBT.toFixed(1)}°C` : '--'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">BT TREND 1H</span>
                    <span className={`font-bold ${btTrend1h !== null && btTrend1h < -3 ? 'text-rose-400' : btTrend1h !== null && btTrend1h > 3 ? 'text-emerald-400' : 'text-slate-100'}`}>
                      {btTrend1h !== null ? `${btTrend1h > 0 ? '+' : ''}${btTrend1h.toFixed(1)}°C` : '--'}
                    </span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">COLD PIXELS</span>
                    <span className={`font-bold ${coldPx >= 50 ? 'text-amber-400' : 'text-slate-100'}`}>{coldPx}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">SAT OVERRIDE</span>
                    <span className={`font-bold ${isSatOverride ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {isSatOverride ? 'ACTIVE' : 'INACTIVE'}
                    </span>
                  </div>
                  {metarTsOverride && (
                    <div className="flex justify-between">
                      <span className="text-slate-400">METAR OVERRIDE</span>
                      <span className="font-bold text-rose-400 animate-pulse">ACTIVE</span>
                    </div>
                  )}
                </div>
              </div>

              {/* All slots summary */}
              <div className="rounded-2xl bg-[#0c1326]/80 border border-[#1e293b]/70 backdrop-blur-xl p-4 flex-1 shadow-2xl">
                <div className="text-[11px] font-bold text-slate-400 tracking-wider mb-2.5">ALL SLOTS</div>
                <div className="space-y-2">
                  {slots && slots.map(s => {
                    const isActive = s.slot === currentSlot.slot;
                    const exceeded = s.probability >= s.threshold;
                    return (
                      <div key={s.slot} className={`flex items-center justify-between p-2.5 rounded-xl transition-all ${
                        isActive ? 'bg-sky-500/20 border border-sky-400/50 shadow-[0_0_12px_rgba(56,189,248,0.15)]' : 'bg-[#080d1a]/80 border border-[#1e293b]/60'
                      }`}>
                        <div>
                          <div className={`text-xs font-bold ${isActive ? 'text-sky-300' : 'text-slate-400'}`}>
                            {isActive ? '▶ ' : ''}{s.label}
                          </div>
                          <div className="text-[11px] font-mono text-slate-400">{s.time}</div>
                        </div>
                        <div className={`text-sm font-mono font-black ${
                          exceeded ? 'text-rose-400' : s.probability >= 0.15 ? 'text-amber-400' : 'text-emerald-400'
                        }`}>
                          {(s.probability * 100).toFixed(1)}%
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {/* SIGMET + Recent Alerts strip */}
          {(sigmetBulletin || recentAlerts.length > 0) && (
            <div className="px-8 pb-3 flex gap-4">
              {sigmetBulletin && (
                <div className="flex-1 rounded-2xl bg-amber-500/10 border border-amber-500/30 p-3.5 backdrop-blur-md">
                  <div className="flex items-center gap-2 mb-1.5 text-xs text-amber-300 font-bold">
                    <span>📡</span>
                    <span>AUTO-GENERATED SIGMET</span>
                    <span className="ml-auto text-xs font-mono text-slate-400">ADVISORY ONLY -- NOT FOR OFFICIAL USE</span>
                  </div>
                  <pre className="text-xs text-amber-200 whitespace-pre-wrap leading-relaxed font-mono">{sigmetBulletin}</pre>
                </div>
              )}
              {recentAlerts.length > 0 && (
                <div className="w-72 rounded-2xl bg-rose-500/10 border border-rose-500/30 p-3.5 backdrop-blur-md">
                  <div className="text-xs text-rose-300 font-bold mb-2 tracking-wider">RECENT ALERTS (LAST {recentAlerts.length})</div>
                  <div className="space-y-1.5 font-mono text-xs">

    // --- PHASE 36: UNIFIED FORECAST PAGE (992-cell canonical grid, live/offline API) ---

    // an ADDITIVE tab -- no existing tab/page/visual is modified. Never
    // converts null/NOT_AVAILABLE/NOT_TRAINED into 0 or LOW; that is
    // enforced by always rendering the API's own status/risk string
    // verbatim rather than deriving a color from a missing probability.
    const UNIFIED_API_CANDIDATES = ['/forecast', '']; // relative first; same-origin only --
    // this static site has no deployed instance of the Phase 35 API yet, so
    // the live attempt is expected to fail and fall back honestly, per
    // instruction 12/13 (never claim live data that isn't really live).
    const UNIFIED_OFFLINE_ARTIFACT_PATH = './data/unified_forecast.json';
    const UNIFIED_LEAD_HOURS = [2, 3, 4, 5, 6];
    const UNIFIED_RISK_COLORS = {
      LOW: '#22c55e', MODERATE: '#eab308', HIGH: '#f97316', SEVERE: '#ef4444', NOT_AVAILABLE: '#475569',
    };

    function unifiedRiskColor(risk) {
      return UNIFIED_RISK_COLORS[risk] || UNIFIED_RISK_COLORS.NOT_AVAILABLE;
    }

    // Pure, Node-testable helpers (Phase 36 Requirement 17) -- kept free of
    // React/JSX so tests/test_unified_forecast_frontend.mjs can `new
    // Function` them exactly like tests/test_location_engine_js.mjs does
    // for assets/location_engine.js.
    function unifiedIsHazardUnavailable(hazardBlock) {
      if (!hazardBlock) return true;
      return hazardBlock.probability === null || hazardBlock.probability === undefined;
    }

    function unifiedFilterRecordsByLead(records, leadHours) {
      if (!records) return [];
      return records.filter(r => r.lead_hours === leadHours);
    }

    const UNIFIED_BBOX = { latMin: 6, latMax: 37, lonMin: 68, lonMax: 98 };
    function unifiedProjectLatLon(lat, lon, w, h) {
      const x = ((lon - UNIFIED_BBOX.lonMin) / (UNIFIED_BBOX.lonMax - UNIFIED_BBOX.lonMin)) * w;
      const y = h - ((lat - UNIFIED_BBOX.latMin) / (UNIFIED_BBOX.latMax - UNIFIED_BBOX.latMin)) * h;
      return [x, y];
    }

    function UnifiedForecastPage() {
      const [artifact, setArtifact] = useState(null);
      const [forecastSource, setForecastSource] = useState(null); // 'LIVE_API' | 'OFFLINE_ARTIFACT'

      // Load the bulk 992x5 dataset once: try the live API first (honestly,
      // not assumed present), fall back to the static offline artifact.
      useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoading(true);
          setLoadError(null);
          try {
            const res = await fetch('/forecast/all', { signal: AbortSignal.timeout ? AbortSignal.timeout(2500) : undefined });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!cancelled) {
              setArtifact(data);
              setForecastSource(data.forecast_source || 'LIVE_API');
            }
            return;
          } catch (liveErr) {
            // Honest fallback -- never silently invent data. This is the
            // Phase 35 Part 12 contract: the API itself falls back to this
            // same file when live inference is unavailable; this static
            // site does the same thing directly since no deployed instance
            // of the Phase 35 API exists for it to reach yet.
            try {
              const res2 = await fetch(UNIFIED_OFFLINE_ARTIFACT_PATH + '?_=' + Date.now());
              if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
              const data2 = await res2.json();
              if (!cancelled) {
                setArtifact(data2);
                setForecastSource('OFFLINE_ARTIFACT');
              }
            } catch (offlineErr) {
              if (!cancelled) setLoadError(`Unified forecast unavailable: ${offlineErr.message}`);
            }
          } finally {
            if (!cancelled) setLoading(false);
          }

      }, []);

      // Source status -- separate, small, non-blocking fetch with the same
      // live-then-offline-derived fallback (the offline artifact itself
      // carries a feature_provenance block we can summarize from).
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {

            if (!res.ok) throw new Error('unreachable');

      useEffect(() => {

                {recordsForLead.map(r => {
                  const hz = r[hazard];

                    {['TS', 'CB', 'FF'].map(hz => {
                      const h = hazGet(hz);
                      if (!h) return null;

                      return (

                          {unavailable ? (

                          <div className="text-[10px] text-slate-500 mt-0.5">{h.model_version} &middot; provenance: {h.provenance}</div>

                                    {(h.xai.top_contributions || []).slice(0, 6).map((c, i) => (
                                      <li key={i}>{c.feature} = {c.value != null ? Number(c.value).toFixed(3) : 'n/a'} (contribution {c.contribution.toFixed(3)}, {c.provenance})</li>
                                    ))}
                                  </ul>
                                </details>
                              ) : (
                                <span className="text-slate-600 italic">XAI: NOT_AVAILABLE{h.xai.reason ? ` -- ${h.xai.reason}` : ''}</span>
                              )}
                            </div>
                          )}
                        </div>
                      );

                    {/* Terrain coverage -- Requirement 9 */}
                    <div className="border border-slate-800 rounded p-2.5">
                      <div className="font-bold text-xs text-white mb-1">Terrain</div>
                      {terrain.status === 'MISSING' || terrain.terrain_status === 'BLOCKED_NETWORK_SRTM' ? (
                        <div className="text-[11px] text-slate-500 italic">MISSING -- no real DEM coverage for this cell (never interpolated)</div>
                      ) : (
                        <div className="text-[11px] text-slate-300">
                          elevation: {terrain.elevation_m ?? 'n/a'} m &middot; slope: {terrain.slope_deg ?? 'n/a'}&deg; &middot; catchment: {terrain.catchment_status}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>

          {/* Source/provenance status -- Requirement 8 */}
          {sources && (
            <div className="bg-slate-900 border border-slate-800 rounded-lg p-3">
              <div className="text-xs font-bold text-white mb-2">Data Source Status {sources._source === 'LIVE_API' ? '(live /forecast/sources)' : '(derived offline -- same documented values)'}</div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px]">
                {Object.entries(sources.data_sources || {}).map(([k, v]) => (

                    <span className="text-slate-400">{k}</span>

                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );

    // --- MAIN APP COMPONENT ---
    function App() {

      // place that distinguishes FETCHED/CACHED/STALE/FAILED for GFS and
      // Himawari from the real on-disk artifact age -- forecast.json's own
      // generated_at (used below for the age-based badge) proves only when
      // the writer ran, never whether upstream data was freshly fetched.
      // Fetched additively; if it fails, the existing generated_at-based
      // Data Health card is untouched and continues to work as before.
      const [canonicalPipelineRun, setCanonicalPipelineRun] = useState(null);
      const [lastUpdated, setLastUpdated] = useState('');
      const [fetchLatencyMs, setFetchLatencyMs] = useState(null);
      const [currentSlots, setCurrentSlots] = useState(DEFAULT_SLOTS);

      const NAV_TAB_LIST = ['DASHBOARD', 'FORECAST', 'UNIFIED FORECAST', 'RADAR MAP', 'MODELS', 'EXPLAINABILITY', 'REGIMES', 'LIVE API', 'ATC VIEW', 'DATA & GRAPHS', 'CONTACTS'];
      const hashToTab = (h) => {
        const map = { '#dashboard':'DASHBOARD','#forecast':'FORECAST','#unified':'UNIFIED FORECAST','#radar':'RADAR MAP','#models':'MODELS','#explainability':'EXPLAINABILITY','#regimes':'REGIMES','#api':'LIVE API','#atc':'ATC VIEW','#multiday':'MULTIDAY','#climatology':'CLIMATOLOGY','#scores':'SKILL SCORES','#alerts':'ALERTS','#graphs':'DATA & GRAPHS','#contacts':'CONTACTS','#whatif':'WHATIF' };
        return map[h.toLowerCase()] || 'DASHBOARD';
      };
      const tabToHash = (t) => {
        const map = { 'DASHBOARD':'#dashboard','FORECAST':'#forecast','UNIFIED FORECAST':'#unified','RADAR MAP':'#radar','MODELS':'#models','EXPLAINABILITY':'#explainability','REGIMES':'#regimes','LIVE API':'#api','ATC VIEW':'#atc','MULTIDAY':'#multiday','CLIMATOLOGY':'#climatology','SKILL SCORES':'#scores','ALERTS':'#alerts','DATA & GRAPHS':'#graphs','CONTACTS':'#contacts','WHATIF':'#whatif' };
        return map[t] || '#dashboard';
      };
      const [activeNavTab, setActiveNavTab] = useState(() => {
        if (typeof window !== 'undefined' && window.location.hash) return hashToTab(window.location.hash);
        return 'DASHBOARD';
      });
      const [selectedHazard, setSelectedHazard] = React.useState('ts');
      const [lang, setLang] = React.useState(() => { try { return localStorage.getItem('sih_lang') || 'en'; } catch { return 'en'; } });
      React.useEffect(() => { try { localStorage.setItem('sih_lang', lang); } catch {} }, [lang]);

      // Universal Multi-Language DOM Translation Engine across all 15 pages
      React.useEffect(() => {
        if (lang === 'en') {
          document.querySelectorAll('[data-orig-text]').forEach(el => {
            el.textContent = el.getAttribute('data-orig-text');
            el.removeAttribute('data-orig-text');
          });
          return;
        }

        const translateDom = () => {
          const root = document.getElementById('root');
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              if (!node.parentElement) return NodeFilter.FILTER_REJECT;
              const tag = node.parentElement.tagName.toLowerCase();
              if (tag === 'script' || tag === 'style' || tag === 'code' || tag === 'pre' || tag === 'input' || tag === 'textarea') {
                return NodeFilter.FILTER_REJECT;
              }
              const text = node.textContent.trim();
              if (!text || /^[\d\s.,:%°/+\----()#]+$/.test(text)) return NodeFilter.FILTER_REJECT;
              return NodeFilter.FILTER_ACCEPT;
            }
          });

          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);

          const sortedKeys = window.__SORTED_TR_KEYS__ || Object.keys(TR || {});
          for (const node of nodes) {
            const parent = node.parentElement;
            const orig = parent.getAttribute('data-orig-text') || node.textContent;
            const trimmed = orig.trim();
            if (!trimmed) continue;

            const directTr = t(lang, trimmed, null);
            if (directTr && directTr !== trimmed) {
              if (!parent.hasAttribute('data-orig-text')) {
                parent.setAttribute('data-orig-text', orig);
              }
              node.textContent = orig.replace(trimmed, directTr);
            } else {
              let currentText = orig;
              let matched = false;
              for (const key of sortedKeys) {
                if (key.length > 2 && currentText.includes(key) && TR[key] && TR[key][lang]) {
                  currentText = currentText.split(key).join(TR[key][lang]);
                  matched = true;
                }
              }
              if (matched) {
                if (!parent.hasAttribute('data-orig-text')) {
                  parent.setAttribute('data-orig-text', orig);
                }
                node.textContent = currentText;
              }
            }
          }
        };

        translateDom();
        const t1 = setTimeout(translateDom, 80);
        const t2 = setTimeout(translateDom, 300);
        const t3 = setTimeout(translateDom, 800);

        const observer = new MutationObserver(() => {
          translateDom();
        });
        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          observer.disconnect();

      }, [lang, activeNavTab, selectedHazard]);
