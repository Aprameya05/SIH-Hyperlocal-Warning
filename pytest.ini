[pytest]
# The repo root also contains several dated, point-in-time audit/patch
# snapshot folders (SIH_*_<timestamp>Z/) from earlier implementation
# passes. They're historical records, not part of the live test suite,
# and several contain test modules with the same basename as the real
# suite under tests/ (e.g. test_canonical_grid.py, test_location_engine.py),
# which collide during collection when pytest is run bare from the repo
# root (no __init__.py packages here, so module names must be unique).
#
# test_himawari.py/test_segments*.py need the heavyweight `satpy` package
# (not installed in every environment); test_nomads.py makes a live
# network call to NOMADS, which some environments' egress proxy blocks
# (see docs/KNOWN_ISSUES.md). None of these four are broken -- they're
# excluded from the default run and should be run explicitly by path
# where their dependency/network is available.
addopts = --ignore-glob=SIH_*Z --ignore=test_himawari.py --ignore=test_nomads.py --ignore=test_segments.py --ignore=test_segments_v2.py
